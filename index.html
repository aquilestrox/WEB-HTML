<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeluxeMenus Web Creator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Estilos personalizados para la cuadrícula de Minecraft */
        .mc-grid {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            gap: 4px;
            background-color: #8b8b8b;
            padding: 8px;
            border-top: 3px solid #dbdbdb;
            border-left: 3px solid #dbdbdb;
            border-bottom: 3px solid #555555;
            border-right: 3px solid #555555;
        }
        .mc-slot {
            aspect-ratio: 1;
            background-color: #8b8b8b;
            border-top: 3px solid #373737;
            border-left: 3px solid #373737;
            border-bottom: 3px solid #ffffff;
            border-right: 3px solid #ffffff;
            image-rendering: pixelated;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }
        .mc-slot:hover {
            background-color: #c6c6c6;
        }
        .mc-slot.active {
            border: 3px solid #55ff55 !important;
            background-color: #a8a8a8;
        }
        .mc-slot .item-name {
            font-size: 9px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400 font-mono">⚔️ DeluxeMenus Maker Live</h1>
            <span class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">v1.0 - HTML Local</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-7 space-y-6">
            
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm">
                <h2 class="text-lg font-semibold mb-4 text-slate-200">⚙️ Configuración General</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">ID del Menú (File name)</label>
                        <input type="text" id="menu-id" value="mi_menu_personalizado" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Título del Menú</label>
                        <input type="text" id="menu-title" value="&8Mi Menú Custom" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Filas (Tamaño)</label>
                        <select id="menu-rows" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500">
                            <option value="1">1 Fila (9 slots)</option>
                            <option value="2">2 Filas (18 slots)</option>
                            <option value="3">3 Filas (27 slots)</option>
                            <option value="4">4 Filas (36 slots)</option>
                            <option value="5">5 Filas (45 slots)</option>
                            <option value="6" selected>6 Filas (54 slots)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-slate-200">🖥️ Vista Previa del Inventario</h2>
                    <span id="preview-title" class="text-sm font-mono bg-slate-900 px-3 py-1 rounded border border-slate-700 text-yellow-400">&8Mi Menú Custom</span>
                </div>
                
                <p class="text-xs text-slate-400 mb-4">Haz clic en cualquier slot para editar su contenido en el panel derecho.</p>
                
                <div id="inventory-grid" class="mc-grid rounded-sm shadow-2xl max-w-lg mx-auto">
                    </div>
            </div>
        </div>

        <div class="lg:col-span-5 space-y-6">
            
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-200">✏️ Editor de Slot</h2>
                    <span id="selected-slot-badge" class="text-xs font-bold bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-md border border-emerald-500/30">Slot Seleccionado: 0</span>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Material de Minecraft (ID en MAYÚSCULAS)</label>
                        <input type="text" id="item-material" placeholder="DIAMOND_SWORD, CHEST, BARRIER..." class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm uppercase focus:outline-none focus:border-emerald-500">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Nombre del Ítem</label>
                            <input type="text" id="item-name" placeholder="&a¡Espada Épica!" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Cantidad (Amount)</label>
                            <input type="number" id="item-amount" value="1" min="1" max="64" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Lore / Descripción (Una línea por fila)</label>
                        <textarea id="item-lore" rows="3" placeholder="&7Línea 1&#10;&eLínea 2" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 font-mono"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Comandos al hacer Clic (Ej: [console] give %player_name% diamond)</label>
                        <textarea id="item-commands" rows="2" placeholder="[player] spawn&#10;[console] eco take %player_name% 100" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 font-mono"></textarea>
                    </div>

                    <div class="pt-2 flex gap-2">
                        <button id="btn-save-slot" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded text-sm transition shadow-sm cursor-pointer">Guardar Slot</button>
                        <button id="btn-clear-slot" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white font-medium px-4 rounded text-sm transition border border-rose-500/30 cursor-pointer">Vaciar</button>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm flex flex-col h-[350px]">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-semibold text-slate-200">📄 Código YAML Generado</h2>
                    <button id="btn-copy" class="text-xs bg-slate-700 hover:bg-slate-600 text-emerald-400 font-mono px-3 py-1.5 rounded transition cursor-pointer">Copiar Código</button>
                </div>
                <textarea id="yaml-output" readonly class="w-full flex-1 bg-slate-950 border border-slate-800 rounded p-3 text-xs font-mono text-emerald-300 resize-none focus:outline-none overflow-y-auto"></textarea>
            </div>

        </div>
    </main>

    <script>
        // Estado de la aplicación
        let currentRows = 6;
        let selectedSlot = 0;
        let menuItems = {}; // Almacena los datos de los slots configurados

        // Selectores DOM
        const gridContainer = document.getElementById('inventory-grid');
        const menuTitleInput = document.getElementById('menu-title');
        const menuIdInput = document.getElementById('menu-id');
        const menuRowsSelect = document.getElementById('menu-rows');
        const previewTitle = document.getElementById('preview-title');
        
        // Formulario de edición
        const itemMaterial = document.getElementById('item-material');
        const itemName = document.getElementById('item-name');
        const itemAmount = document.getElementById('item-amount');
        const itemLore = document.getElementById('item-lore');
        const itemCommands = document.getElementById('item-commands');
        const selectedSlotBadge = document.getElementById('selected-slot-badge');
        
        const btnSaveSlot = document.getElementById('btn-save-slot');
        const btnClearSlot = document.getElementById('btn-clear-slot');
        const btnCopy = document.getElementById('btn-copy');
        const yamlOutput = document.getElementById('yaml-output');

        // Inicialización
        function init() {
            renderGrid();
            setupEventListeners();
            updateYAML();
        }

        // Renderiza la cuadrícula de slots de Minecraft
        function renderGrid() {
            gridContainer.innerHTML = '';
            const totalSlots = currentRows * 9;

            for (let i = 0; i < totalSlots; i++) {
                const slotDiv = document.createElement('div');
                slotDiv.className = `mc-slot flex flex-col items-center justify-center p-1 text-center text-[10px] text-slate-800 font-bold ${i === selectedSlot ? 'active' : ''}`;
                slotDiv.dataset.slotId = i;

                // Si el slot tiene información guardada, mostrar un preview de texto plano
                if (menuItems[i]) {
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'item-name font-mono text-slate-900 block w-full text-center';
                    // Reemplazo básico de códigos de color para la vista previa visual rápida
                    let cleanName = menuItems[i].name || menuItems[i].material;
                    nameSpan.innerText = cleanName.replace(/&[0-9a-fk-or]/g, '');
                    
                    const matSpan = document.createElement('span');
                    matSpan.className = 'text-[8px] opacity-60 text-slate-900 block font-normal';
                    matSpan.innerText = `x${menuItems[i].amount || 1}`;

                    slotDiv.appendChild(nameSpan);
                    slotDiv.appendChild(matSpan);
                } else {
                    slotDiv.innerHTML = `<span class="opacity-20 font-mono text-xs text-slate-900">${i}</span>`;
                }

                gridContainer.appendChild(slotDiv);
            }
        }

        // Configura los capturadores de eventos
        function setupEventListeners() {
            // Cambiar título del menú en vivo
            menuTitleInput.addEventListener('input', (e) => {
                previewTitle.innerText = e.target.value;
                updateYAML();
            });

            menuIdInput.addEventListener('input', updateYAML);

            // Cambiar tamaño del inventario
            menuRowsSelect.addEventListener('change', (e) => {
                currentRows = parseInt(e.target.value);
                const maxSlots = currentRows * 9;
                if (selectedSlot >= maxSlots) {
                    selectedSlot = 0;
                    loadSlotData(0);
                }
                renderGrid();
                updateYAML();
            });

            // Hacer clic en un slot para seleccionarlo
            gridContainer.addEventListener('click', (e) => {
                const slotTarget = e.target.closest('.mc-slot');
                if (!slotTarget) return;

                // Quitar clase activa previa
                document.querySelectorAll('.mc-slot').forEach(s => s.classList.remove('active'));
                
                selectedSlot = parseInt(slotTarget.dataset.slotId);
                slotTarget.classList.add('active');
                
                loadSlotData(selectedSlot);
            });

            // Guardar datos del slot editado
            btnSaveSlot.addEventListener('click', () => {
                const material = itemMaterial.value.trim().toUpperCase();
                if (!material) {
                    alert('Por favor introduce un material válido de Minecraft (Ej: STONE)');
                    return;
                }

                menuItems[selectedSlot] = {
                    material: material,
                    name: itemName.value.trim(),
                    amount: parseInt(itemAmount.value) || 1,
                    lore: itemLore.value.split('\n').filter(line => line.trim() !== ''),
                    commands: itemCommands.value.split('\n').filter(line => line.trim() !== '')
                };

                renderGrid();
                updateYAML();
            });

            // Vaciar un slot
            btnClearSlot.addEventListener('click', () => {
                delete menuItems[selectedSlot];
                clearEditorForm();
                renderGrid();
                updateYAML();
            });

            // Copiar al portapapeles
            btnCopy.addEventListener('click', () => {
                yamlOutput.select();
                document.execCommand('copy');
                const originalText = btnCopy.innerText;
                btnCopy.innerText = '¡Copiado!';
                btnCopy.classList.remove('text-emerald-400');
                btnCopy.classList.add('text-white', 'bg-emerald-600');
                setTimeout(() => {
                    btnCopy.innerText = originalText;
                    btnCopy.classList.add('text-emerald-400');
                    btnCopy.classList.remove('text-white', 'bg-emerald-600');
                }, 2000);
            });
        }

        // Carga los datos de un slot guardado en el formulario
        function loadSlotData(slotId) {
            selectedSlotBadge.innerText = `Slot Seleccionado: ${slotId}`;
            const item = menuItems[slotId];
            
            if (item) {
                itemMaterial.value = item.material;
                itemName.value = item.name;
                itemAmount.value = item.amount;
                itemLore.value = item.lore.join('\n');
                itemCommands.value = item.commands.join('\n');
            } else {
                clearEditorForm();
            }
        }

        // Limpia los campos del panel de edición
        function clearEditorForm() {
            itemMaterial.value = '';
            itemName.value = '';
            itemAmount.value = '1';
            itemLore.value = '';
            itemCommands.value = '';
        }

        // Genera el árbol de DeluxeMenus en formato YAML strings exactos
        function updateYAML() {
            const id = menuIdInput.value.trim() || 'mi_menu';
            const title = menuTitleInput.value.trim();
            const slotsCount = currentRows * 9;

            let yaml = `# Generado con DeluxeMenus Web Creator\n`;
            yaml += `menu_title: '${title}'\n`;
            yaml += `open_command: ${id}\n`;
            yaml += `size: ${slotsCount}\n`;
            yaml += `items:\n`;

            let hasItems = false;
            for (const slotId in menuItems) {
                // Filtrar si quedan fuera de la vista actual por haber achicado filas
                if (parseInt(slotId) >= slotsCount) continue;
                
                hasItems = true;
                const item = menuItems[slotId];
                yaml += `  'item_${slotId}':\n`;
                yaml += `    material: ${item.material}\n`;
                yaml += `    slot: ${slotId}\n`;
                if (item.amount > 1) {
                    yaml += `    amount: ${item.amount}\n`;
                }
                if (item.name) {
                    yaml += `    display_name: '${item.name}'\n`;
                }
                if (item.lore && item.lore.length > 0) {
                    yaml += `    lore:\n`;
                    item.lore.forEach(line => {
                        yaml += `    - '${line}'\n`;
                    });
                }
                if (item.commands && item.commands.length > 0) {
                    yaml += `    left_click_commands:\n`;
                    item.commands.forEach(cmd => {
                        yaml += `    - '${cmd}'\n`;
                    });
                    yaml += `    right_click_commands:\n`;
                    item.commands.forEach(cmd => {
                        yaml += `    - '${cmd}'\n`;
                    });
                }
            }

            if (!hasItems) {
                yaml += `  # No has añadido ítems todavía. Haz clic en un slot.\n`;
            }

            yamlOutput.value = yaml;
        }

        // Iniciar la web al cargar
        window.onload = init;
    </script>
</body>
</html>
