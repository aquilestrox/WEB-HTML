<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Calendar - Persistente</title>
    <style>
        :root {
            --bg-window: #1e1e1e;
            --bg-sidebar: #161618;
            --bg-calendar: #1e1e20;
            --grid-line: #2b2b2e;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --accent-orange: #ff9f0a;
            --accent-blue: #0a84ff;
            --accent-pink: #ff375f;
            --accent-green: #30d158;
            --accent-yellow: #ffd60a;
            --accent-brown: #a2845e;
            --accent-purple: #bf5af2;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: #0d0d0d;
            font-family: var(--font-stack);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-size: 13px;
        }

        /* Ventana macOS */
        .window {
            width: 98vw;
            height: 96vh;
            background: var(--bg-window);
            border-radius: 12px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.08);
            display: flex;
            overflow: hidden;
        }

        /* BARRA LATERAL */
        .sidebar {
            width: 230px;
            background: var(--bg-sidebar);
            border-right: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 12px;
            flex-shrink: 0;
        }

        .traffic-lights {
            display: flex;
            gap: 7px;
            margin-bottom: 20px;
            align-items: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .section-title {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            margin: 10px 6px 6px 6px;
        }

        .calendar-list {
            list-style: none;
            margin-bottom: 12px;
        }

        .calendar-item {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12.5px;
            gap: 8px;
            transition: background 0.15s;
        }

        .calendar-item:hover {
            background: rgba(255,255,255,0.06);
        }

        .custom-checkbox {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #000;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .calendar-item.inactive .custom-checkbox {
            background: transparent !important;
            border: 1px solid var(--text-muted);
            color: transparent;
        }
        .calendar-item.inactive span:last-child {
            opacity: 0.5;
        }

        /* Minicalendario */
        .mini-calendar {
            background: rgba(0,0,0,0.25);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ccc;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
        }

        .mini-grid .day-num {
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            color: #ddd;
        }
        .mini-grid .day-num.today {
            background: #ff3b30;
            color: white;
            font-weight: bold;
        }
        .mini-grid .day-num.other-month { color: #555; }

        /* VISTA PRINCIPAL */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-calendar);
            overflow: hidden;
        }

        .top-bar {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--grid-line);
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .btn-icon:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.08);
        }

        .main-title {
            font-size: 19px;
            font-weight: 600;
        }

        .segmented-control {
            display: flex;
            background: rgba(255,255,255,0.08);
            padding: 2px;
            border-radius: 6px;
        }

        .segment-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .segment-btn.active {
            background: rgba(255,255,255,0.18);
            color: var(--text-main);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-today {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-reset:hover { color: #ff5f56; border-color: #ff5f56; }

        /* CALENDARIO BODY */
        .calendar-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .days-header {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            border-bottom: 1px solid var(--grid-line);
            text-align: center;
            font-size: 12px;
            padding: 7px 0;
            background: var(--bg-calendar);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .day-header-cell {
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Todo el día */
        .all-day-row {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            border-bottom: 1px solid var(--grid-line);
            min-height: 28px;
            align-items: center;
            font-size: 11px;
            background: rgba(0,0,0,0.15);
        }

        .all-day-label {
            color: var(--text-muted);
            text-align: right;
            padding-right: 8px;
            font-size: 10px;
        }

        .all-day-cell {
            border-left: 1px solid var(--grid-line);
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 3px 4px;
        }

        /* Grid de Horas */
        .time-grid-container {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            position: relative;
            flex: 1;
        }

        .time-labels {
            display: flex;
            flex-direction: column;
        }

        .time-label {
            height: 60px;
            text-align: right;
            padding-right: 8px;
            font-size: 11px;
            color: var(--text-muted);
            transform: translateY(-8px);
        }

        .day-column {
            border-left: 1px solid var(--grid-line);
            position: relative;
            height: calc(60px * 18);
            cursor: pointer;
        }

        .hour-row-line {
            height: 60px;
            border-bottom: 1px solid var(--grid-line);
            box-sizing: border-box;
        }

        /* EVENTOS */
        .event-card {
            position: absolute;
            left: 2px;
            right: 2px;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 11.5px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 2px;
            cursor: pointer;
            border-left-width: 3.5px;
            border-left-style: solid;
            line-height: 1.25;
            z-index: 2;
            transition: filter 0.15s, transform 0.1s;
        }

        .event-card:hover {
            filter: brightness(1.2);
            transform: scale(0.99);
        }

        .event-card .event-time {
            font-size: 10px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .all-day-chip {
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 10.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            border-left-width: 3px;
            border-left-style: solid;
        }

        /* Colores de Categorías */
        .cat-grabacion { background: rgba(255, 159, 10, 0.3); border-left-color: var(--accent-orange); color: #ffd899; }
        .cat-edicion { background: rgba(10, 132, 255, 0.3); border-left-color: var(--accent-blue); color: #99ccff; }
        .cat-ocio { background: rgba(162, 132, 94, 0.3); border-left-color: var(--accent-brown); color: #ded0c0; }
        .cat-casa { background: rgba(10, 132, 255, 0.25); border-left-color: var(--accent-blue); color: #bde0fe; }
        .cat-preparacion { background: rgba(255, 55, 95, 0.3); border-left-color: var(--accent-pink); color: #ffb3c1; }
        .cat-completado { background: rgba(48, 209, 88, 0.3); border-left-color: var(--accent-green); color: #b7efc5; }
        .cat-cumpleanos { background: rgba(191, 90, 242, 0.3); border-left-color: var(--accent-purple); color: #e8c5ff; }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: #252529;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            width: 330px;
            padding: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .modal h3 {
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        .form-group input, .form-group select {
            background: #18181a;
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
            padding: 7px;
            border-radius: 6px;
            outline: none;
            font-size: 12.5px;
            width: 100%;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
            font-size: 12px;
            color: #ddd;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: #ff453a;
            cursor: pointer;
            font-size: 12px;
            padding: 6px 8px;
            border-radius: 5px;
        }
        .btn-delete:hover { background: rgba(255,69,58,0.15); }

        .btn-cancel {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-save {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="window">
    <!-- BARRA LATERAL -->
    <div class="sidebar">
        <div>
            <div class="traffic-lights">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>

            <div class="section-title">iCloud</div>
            <ul class="calendar-list" id="categories-icloud">
                <li class="calendar-item" data-cat="casa">
                    <span class="custom-checkbox" style="background:var(--accent-blue);">✓</span>
                    <span>Casa</span>

                <li class="calendar-item" data-cat="preparacion">
                    <span class="custom-checkbox" style="background:var(--accent-pink);">✓</span>

                </li>
                <li class="calendar-item" data-cat="grabacion">
                    <span class="custom-checkbox" style="background:var(--accent-orange);">✓</span>
                    <span>Grabación</span>
                </li>
                <li class="calendar-item" data-cat="completado">
                    <span class="custom-checkbox" style="background:var(--accent-green);">✓</span>

                </li>
                <li class="calendar-item" data-cat="edicion">
                    <span class="custom-checkbox" style="background:var(--accent-yellow);">✓</span>

                </li>
                <li class="calendar-item" data-cat="ocio">

            <div class="section-title">Otros</div>
            <ul class="calendar-list" id="categories-otros">
                <li class="calendar-item" data-cat="cumpleanos">
                    <span class="custom-checkbox" style="background:var(--accent-purple);">✓</span>
                    <span>Cumpleaños</span>
                </li>
            </ul>
        </div>

        <!-- Minicalendario -->
        <div class="mini-calendar">
            <div class="mini-header">
                <span>&lt;</span>
                <span>septiembre de 2026</span>
                <span>&gt;</span>
            </div>
            <div class="mini-grid">
                <span style="color:var(--text-muted)">l</span>
                <span style="color:var(--text-muted)">m</span>
                <span style="color:var(--text-muted)">x</span>
                <span style="color:var(--text-muted)">j</span>
                <span style="color:var(--text-muted)">v</span>
                <span style="color:var(--text-muted)">s</span>
                <span style="color:var(--text-muted)">d</span>

                <div class="day-num other-month">31</div>
                <div class="day-num">1</div>
                <div class="day-num">2</div>
                <div class="day-num today">3</div>
                <div class="day-num">4</div>
                <div class="day-num">5</div>
                <div class="day-num">6</div>
            </div>
        </div>
    </div>

    <!-- VISTA PRINCIPAL -->
    <div class="main-view">
        <div class="top-bar">
            <div class="top-left">
                <button class="btn-icon" id="open-modal-btn" title="Nuevo evento">+</button>
                <div class="segmented-control">
                    <button class="segment-btn">Día</button>

            <div class="top-right">
                <button class="btn-reset" id="btn-reset" title="Restablecer eventos por defecto">↺ Restaurar</button>
                <button class="btn-icon">&lt;</button>
                <button class="btn-today">Hoy</button>
                <button class="btn-icon">&gt;</button>
                <button class="btn-icon">🔍</button>
            </div>
        </div>

        <div class="calendar-body">
            <!-- Encabezado de columnas -->
            <div class="days-header">
                <div></div>
                <div class="day-header-cell">mié 26</div>
                <div class="day-header-cell">jue 27</div>
                <div class="day-header-cell">vie 28</div>
                <div class="day-header-cell">sáb 29</div>
                <div class="day-header-cell">dom 30</div>
                <div class="day-header-cell">lun 31</div>

            </div>

            <!-- Fila Todo el día -->
            <div class="all-day-row">
                <div class="all-day-label">todo el día</div>
                <div class="all-day-cell" data-allday-day="0"></div>
                <div class="all-day-cell" data-allday-day="1"></div>
                <div class="all-day-cell" data-allday-day="2"></div>

            <!-- Rejilla de Horas -->
            <div class="time-grid-container">
                <div class="time-labels" id="hour-labels"></div>

            </div>
        </div>
    </div>
</div>

<!-- MODAL PARA CREAR / EDITAR / ELIMINAR EVENTO -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h3 id="modal-title">Detalles del Evento</h3>
        <input type="hidden" id="event-id">
        
        <div class="form-group">
            <label>Título</label>
            <input type="text" id="event-title" placeholder="Añadir título...">
        </div>

        <div class="form-group">
            <label>Día</label>
            <select id="event-day">
                <option value="0">mié 26</option>
                <option value="1">jue 27</option>
                <option value="2">vie 28</option>
                <option value="3">sáb 29</option>
                <option value="4">dom 30</option>
                <option value="5">lun 31</option>
                <option value="6">mar 1</option>
            </select>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="event-allday">
            <label for="event-allday">Todo el día</label>
        </div>

        <div class="form-row" id="time-inputs-container">
            <div class="form-group" style="flex:1;">
                <label>Inicio</label>
                <input type="time" id="event-start-time" value="10:00">
            </div>
            <div class="form-group" style="flex:1;">
                <label>Fin</label>
                <input type="time" id="event-end-time" value="12:00">
            </div>
        </div>

        <div class="form-group">
            <label>Calendario / Categoría</label>
            <select id="event-category">
                <option value="grabacion">Grabación (Naranja)</option>
                <option value="edicion">Edición (Azul)</option>
                <option value="ocio">Ocio (Marrón/Gris)</option>
                <option value="casa">Casa (Azul)</option>
                <option value="preparacion">Preparación (Rosa)</option>
                <option value="completado">Completado (Verde)</option>
                <option value="cumpleanos">Cumpleaños (Morado)</option>
            </select>
        </div>

        <div class="modal-actions">
            <button class="btn-delete" id="delete-btn" style="visibility:hidden;">Eliminar</button>
            <div>
                <button class="btn-cancel" id="cancel-btn">Cancelar</button>
                <button class="btn-save" id="save-btn">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script>
    const START_HOUR = 6;
    const END_HOUR = 23;
    const HOUR_HEIGHT = 60; // 60px por hora (1px = 1 minuto)

    // Claves de LocalStorage
    const STORAGE_EVENTS_KEY = 'apple_cal_events_v2';
    const STORAGE_CATS_KEY = 'apple_cal_cats_v2';

    // Datos por defecto idénticos a la foto
    const DEFAULT_EVENTS = [
        { id: '1', day: 1, title: 'Grabación mobs bebés G2', startTime: '10:45', endTime: '15:00', category: 'grabacion', isAllDay: false },
        { id: '2', day: 1, title: 'Edición y creación de la intro video base perfecta', startTime: '16:00', endTime: '21:00', category: 'edicion', isAllDay: false },
        { id: '3', day: 2, title: 'piscina', startTime: '10:00', endTime: '15:45', category: 'ocio', isAllDay: false },
        { id: '4', day: 2, title: 'Edición y creación de la intro video base perfecta', startTime: '15:45', endTime: '17:30', category: 'edicion', isAllDay: false },
        { id: '5', day: 3, title: 'Edición mobs bebés G2 y G3', startTime: '10:00', endTime: '15:00', category: 'edicion', isAllDay: false },
        { id: '6', day: 3, title: 'Miniaturas del vídeo Base Perfecta', startTime: '16:00', endTime: '21:00', category: 'edicion', isAllDay: false },
        { id: '7', day: 4, title: 'Grabación mobs bebés G5', startTime: '10:05', endTime: '13:45', category: 'grabacion', isAllDay: false },
        { id: '8', day: 4, title: 'Grabación mobs bebés G6', startTime: '16:00', endTime: '20:45', category: 'grabacion', isAllDay: false },
        { id: '9', day: 0, title: 'playa', startTime: '00:00', endTime: '23:59', category: 'ocio', isAllDay: true },
        { id: '10', day: 5, title: 'Papa cumple años', startTime: '00:00', endTime: '23:59', category: 'cumpleanos', isAllDay: true }
    ];

    // Estados
    let events = [];
    let activeCategories = {
        casa: true, preparacion: true, grabacion: true,
        completado: true, edicion: true, ocio: true, cumpleanos: true
    };

    // 1. DIBUJAR LÍNEAS HORARIAS
    const hourLabelsContainer = document.getElementById('hour-labels');
    const dayColumns = document.querySelectorAll('.day-column');

    for (let h = START_HOUR; h <= END_HOUR; h++) {
        const label = document.createElement('div');
        label.className = 'time-label';
        label.textContent = `${h}:00`;
        hourLabelsContainer.appendChild(label);

        dayColumns.forEach(col => {
            const line = document.createElement('div');
            line.className = 'hour-row-line';
            col.appendChild(line);
        });
    }

    // 2. CONVERSIÓN DE HORAS
    function timeStringToDecimal(timeStr) {
        if (!timeStr) return 0;
        const [h, m] = timeStr.split(':').map(Number);
        return h + (m / 60);
    }

    // 3. PERSISTENCIA EN LOCALSTORAGE
    function loadSavedData() {
        const savedEvents = localStorage.getItem(STORAGE_EVENTS_KEY);
        const savedCats = localStorage.getItem(STORAGE_CATS_KEY);

        events = savedEvents ? JSON.parse(savedEvents) : [...DEFAULT_EVENTS];
        if (savedCats) activeCategories = JSON.parse(savedCats);

        updateSidebarUI();
        renderAllEvents();
    }

    function saveAll() {
        localStorage.setItem(STORAGE_EVENTS_KEY, JSON.stringify(events));
        localStorage.setItem(STORAGE_CATS_KEY, JSON.stringify(activeCategories));
    }

    // 4. RENDERIZADO DE EVENTOS
    function renderAllEvents() {
        // Limpiar eventos existentes
        document.querySelectorAll('.event-card').forEach(el => el.remove());
        document.querySelectorAll('.all-day-cell').forEach(cell => cell.innerHTML = '');

        events.forEach(ev => {
            // Filtrar si la categoría está oculta
            if (!activeCategories[ev.category]) return;

            if (ev.isAllDay) {
                // Evento de todo el día
                const cell = document.querySelector(`.all-day-cell[data-allday-day="${ev.day}"]`);
                if (cell) {
                    const chip = document.createElement('div');
                    chip.className = `all-day-chip cat-${ev.category}`;
                    chip.textContent = ev.title;
                    chip.onclick = (e) => { e.stopPropagation(); openEditModal(ev); };
                    cell.appendChild(chip);
                }
            } else {
                // Evento con horas normales
                const col = document.querySelector(`.day-column[data-day="${ev.day}"]`);
                if (!col) return;

                const startDec = timeStringToDecimal(ev.startTime);
                const endDec = timeStringToDecimal(ev.endTime);

                const topPos = Math.max(0, (startDec - START_HOUR) * HOUR_HEIGHT);
                const height = Math.max(22, (endDec - startDec) * HOUR_HEIGHT);

                const card = document.createElement('div');
                card.className = `event-card cat-${ev.category}`;
                card.style.top = `${topPos}px`;
                card.style.height = `${height}px`;

                card.innerHTML = `
                    <strong>${ev.title}</strong>
                    <span class="event-time">🕒 ${ev.startTime} - ${ev.endTime}</span>
                `;

                card.onclick = (e) => {
                    e.stopPropagation();
                    openEditModal(ev);
                };

                col.appendChild(card);
            }
        });
    }

    // 5. MODAL: CREAR / EDITAR / BORRAR
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const eventIdInput = document.getElementById('event-id');
    const eventTitleInput = document.getElementById('event-title');
    const eventDayInput = document.getElementById('event-day');
    const eventAllDayInput = document.getElementById('event-allday');
    const eventStartTimeInput = document.getElementById('event-start-time');
    const eventEndTimeInput = document.getElementById('event-end-time');
    const eventCatInput = document.getElementById('event-category');
    const deleteBtn = document.getElementById('delete-btn');
    const timeInputsContainer = document.getElementById('time-inputs-container');

    // Toggle All-Day view
    eventAllDayInput.addEventListener('change', () => {
        timeInputsContainer.style.display = eventAllDayInput.checked ? 'none' : 'flex';
    });

    function openCreateModal(day = 0, hour = 10) {
        modalTitle.textContent = "Nuevo Evento";
        eventIdInput.value = "";
        eventTitleInput.value = "";
        eventDayInput.value = day;
        eventAllDayInput.checked = false;
        timeInputsContainer.style.display = 'flex';
        
        const hStr = String(hour).padStart(2, '0');
        const hEndStr = String(Math.min(23, hour + 2)).padStart(2, '0');
        eventStartTimeInput.value = `${hStr}:00`;
        eventEndTimeInput.value = `${hEndStr}:00`;
        eventCatInput.value = "grabacion";

        deleteBtn.style.visibility = 'hidden';
        modal.style.display = 'flex';
        eventTitleInput.focus();
    }

    function openEditModal(ev) {
        modalTitle.textContent = "Editar Evento";
        eventIdInput.value = ev.id;
        eventTitleInput.value = ev.title;
        eventDayInput.value = ev.day;
        eventAllDayInput.checked = !!ev.isAllDay;
        timeInputsContainer.style.display = ev.isAllDay ? 'none' : 'flex';

        eventStartTimeInput.value = ev.startTime || "10:00";
        eventEndTimeInput.value = ev.endTime || "12:00";
        eventCatInput.value = ev.category;

        deleteBtn.style.visibility = 'visible';
        modal.style.display = 'flex';
    }

    // Botón Cancelar y Guardar
    document.getElementById('cancel-btn').onclick = () => modal.style.display = 'none';

    document.getElementById('save-btn').onclick = () => {
        const title = eventTitleInput.value.trim();
        if (!title) {
            alert("Por favor escribe un título para el evento.");
            return;
        }

        const id = eventIdInput.value || Date.now().toString();
        const newEvent = {
            id,
            title,
            day: parseInt(eventDayInput.value),
            isAllDay: eventAllDayInput.checked,
            startTime: eventAllDayInput.checked ? "00:00" : eventStartTimeInput.value,
            endTime: eventAllDayInput.checked ? "23:59" : eventEndTimeInput.value,
            category: eventCatInput.value
        };

        const existingIndex = events.findIndex(e => e.id === id);
        if (existingIndex > -1) {
            events[existingIndex] = newEvent; // Actualizar
        } else {
            events.push(newEvent); // Crear nuevo
        }

        saveAll();
        renderAllEvents();
        modal.style.display = 'none';
    };

    // Botón Eliminar
    deleteBtn.onclick = () => {
        const id = eventIdInput.value;
        events = events.filter(e => e.id !== id);
        saveAll();
        renderAllEvents();
        modal.style.display = 'none';
    };

    // Botón "+" superior
    document.getElementById('open-modal-btn').onclick = () => openCreateModal();

    // Clic en columnas para crear evento en esa hora exacta
    dayColumns.forEach(col => {
        col.addEventListener('click', (e) => {
            const rect = col.getBoundingClientRect();
            const offsetY = e.clientY - rect.top;
            const clickedHour = Math.floor(START_HOUR + (offsetY / HOUR_HEIGHT));
            const day = parseInt(col.dataset.day);
            openCreateModal(day, clickedHour);
        });
    });

    // 6. TOGGLE DE CALENDARIOS EN LA BARRA LATERAL
    function updateSidebarUI() {
        document.querySelectorAll('.calendar-item').forEach(item => {
            const cat = item.dataset.cat;
            if (activeCategories[cat] === false) {
                item.classList.add('inactive');
            } else {
                item.classList.remove('inactive');
            }
        });
    }

    document.querySelectorAll('.calendar-item').forEach(item => {
        item.addEventListener('click', () => {
            const cat = item.dataset.cat;
            activeCategories[cat] = !activeCategories[cat];
            updateSidebarUI();
            saveAll();
            renderAllEvents();
        });
    });

    // 7. BOTÓN RESTAURAR (Por si quieres volver a los datos originales)
    document.getElementById('btn-reset').onclick = () => {
        if (confirm('¿Restaurar los eventos originales del calendario?')) {
            events = [...DEFAULT_EVENTS];
            activeCategories = {
                casa: true, preparacion: true, grabacion: true,
                completado: true, edicion: true, ocio: true, cumpleanos: true
            };
            saveAll();
            updateSidebarUI();
            renderAllEvents();
        }
    };

    // 8. Vistas Día/Semana/Mes/Año
    document.querySelectorAll('.segment-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    // Inicializar cargando datos de LocalStorage
    loadSavedData();
</script>
</body>
</html>
