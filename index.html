<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Director de Arte 2.5D — Shorts 9:16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: oklch(0.125 0.014 260);
      --surface: oklch(0.165 0.016 260);
      --surface-alt: oklch(0.205 0.019 260);
      --border: oklch(0.30 0.02 260 / 0.6);
      --text: oklch(0.96 0.008 260);
      --muted: oklch(0.68 0.02 260);
      --primary: oklch(0.63 0.21 262);
      --accent: oklch(0.76 0.16 175);
      --export: oklch(0.62 0.23 18);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-pill: 999px;
      --spring: linear(
        0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%,
        1.017, 1.077, 1.113, 1.123 26.8%, 1.106, 1.055 34.4%, 1.01 40.9%,
        0.992 46.8%, 0.986 52.8%, 0.999 70.3%, 1
      );
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: radial-gradient(950px 520px at 10% -10%, oklch(0.25 0.08 262 / 0.22), transparent 60%), var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .ms-icon { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 28px; border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px); background: oklch(0.135 0.014 260 / 0.8);
      position: sticky; top: 0; z-index: 20; gap: 12px; flex-wrap: wrap;
    }
    .topbar h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
    .badge {
      background: oklch(0.76 0.16 175 / 0.15); color: var(--accent); border: 1px solid oklch(0.76 0.16 175 / 0.35);
      font-size: 0.68rem; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-pill);
    }
    .status-pill {
      font-size: 0.76rem; font-weight: 600; padding: 6px 14px;
      border-radius: var(--radius-pill); background: var(--surface-alt); border: 1px solid var(--border);
    }

    .workspace {
      display: grid; grid-template-columns: minmax(360px, 1.15fr) minmax(330px, 0.85fr);
      gap: 22px; padding: 24px 28px; max-width: 1460px; margin: 0 auto;
    }
    @media (max-width: 960px) { .workspace { grid-template-columns: 1fr; padding: 16px; } }

    .panel { display: flex; flex-direction: column; gap: 18px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px; box-shadow: 0 12px 32px oklch(0 0 0 / 0.22);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .card-header h2 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 0.96rem; display: flex; align-items: center; gap: 8px; }

    textarea, select {
      width: 100%; background: var(--surface-alt); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 10px 12px; font: inherit; font-size: 0.86rem; outline: none;
    }
    textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px oklch(0.63 0.21 262 / 0.22); }
    textarea { resize: vertical; line-height: 1.5; }
    label { display: flex; flex-direction: column; gap: 5px; font-size: 0.75rem; color: var(--muted); font-weight: 600; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
    @media (max-width: 640px) { .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; } }

    .toggles-grid { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 0; }
    .checkbox-label { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 0.82rem; cursor: pointer; }
    .checkbox-label input { accent-color: var(--primary); width: 16px; height: 16px; }
    .preset-row { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 240px; }
    .actions-row { display: flex; gap: 10px; margin-top: 14px; }

    button, .download-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: none; border-radius: var(--radius-pill); padding: 10px 18px;
      font: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer; text-decoration: none;
      transition: transform 0.35s var(--spring), filter 0.2s ease, opacity 0.2s ease;
    }
    button:hover, .download-btn:hover { transform: translateY(-1.5px) scale(1.01); filter: brightness(1.08); }
    button:active, .download-btn:active { transform: scale(0.96); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--surface-alt); color: var(--text); border: 1px solid var(--border); }
    .btn-export { background: var(--export); color: #fff; width: 100%; padding: 13px; font-size: 0.94rem; }

    .scenes-summary { display: grid; grid-template-columns: 1fr; grid-auto-rows: max-content; gap: 12px; max-height: 450px; overflow-y: auto; padding-right: 4px; }
    @keyframes sceneEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .scene-pill { background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; animation: sceneEnter 0.4s var(--spring) backwards; }
    .scene-pill-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
    .scene-pill strong { color: var(--accent); font-size: 0.82rem; }
    .scene-time-chip { font-size: 0.72rem; color: var(--muted); background: oklch(0.14 0.015 260); padding: 2px 8px; border-radius: var(--radius-pill); border: 1px solid var(--border); }
    .scene-pill p { margin: 0 0 8px; font-size: 0.84rem; }

    .preview-card { position: sticky; top: 86px; }
    .phone-frame {
      width: min(336px, 100%); aspect-ratio: 9 / 16; margin: 0 auto 14px;
      background: #000; border-radius: 22px; overflow: hidden; border: 1px solid var(--border);
      box-shadow: 0 20px 50px oklch(0 0 0 / 0.5);
    }
    #previewCanvas { width: 100%; height: 100%; display: block; }
    .player-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .time-display { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 0.82rem; color: var(--muted); font-weight: 600; }
    .scrubber { width: 100%; margin-bottom: 8px; accent-color: var(--primary); cursor: pointer; }
    .status-banner { margin: 4px 0 0; font-size: 0.8rem; color: var(--muted); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .progress-wrap { margin-top: 12px; }
    .progress-track { width: 100%; height: 8px; background: var(--surface-alt); border-radius: var(--radius-pill); overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.12s ease; }
    .export-result { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
    .export-result video { width: min(250px, 100%); aspect-ratio: 9 / 16; margin: 0 auto; border-radius: 14px; background: #000; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>
      <svg class="ms-icon" style="color:var(--accent);width:22px;height:22px" viewBox="0 -960 960 960"><path d="m160-800 80 160h120l-80-160h80l80 160h120l-80-160h80l80 160h120l-80-160h120q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800Zm0 240v320h640v-320H160Z"/></svg>
      ArtDirector 2.5D <span class="badge">9:16 VIRAL ENGINE</span>
    </h1>
    <div id="codecSupportBadge" class="status-pill">Motor 2.5D listo</div>
  </header>

  <main class="workspace">
    <section class="panel">
      <div class="card">
        <div class="card-header">
          <h2>
            <svg class="ms-icon" viewBox="0 -960 960 960"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h357l-80 80H200v560h560v-278l80-80v358q0 33-23.5 56.5T760-120H200Zm160-160v-80h240v80H360Zm0-160v-80h360v80H360Zm0-160v-80h200v80H360Z"/></svg>
            Guion / Escenas
          </h2>
          <div class="preset-row">
            <select id="presetSelect">
              <option value="repartidor">Repartidor en moto bajo la lluvia</option>
              <option value="japon">Oficina en Japón (Sala sin trabajo)</option>
              <option value="banco">Robo en bóveda y persecución</option>
              <option value="espacio">Astronauta y choque orbital</option>
            </select>
            <button id="loadPresetBtn" type="button" class="btn-secondary">Cargar</button>
          </div>
        </div>

        <textarea id="storyInput" rows="6" placeholder="Escribe cada frase o línea de tu historia..."></textarea>

        <div class="grid-3">
          <label>Resolución
            <select id="resolutionSelect">
              <option value="720x1280" selected>720×1280 (Rápido)</option>
              <option value="1080x1920">1080×1920 (Full HD)</option>

              <option value="30" selected>30 FPS</option>
              <option value="60">60 FPS</option>
            </select>
          </label>
          <label>Subtítulos (Zona 25% inf.)
            <select id="subtitleModeSelect">
              <option value="on" selected>Activados</option>
              <option value="off">Desactivados</option>
            </select>
          </label>
        </div>

        <div class="toggles-grid">
          <label class="checkbox-label"><input type="checkbox" id="musicToggle" checked />Música atmosférica</label>
          <label class="checkbox-label"><input type="checkbox" id="sfxToggle" checked />Efectos de sonido (SFX)</label>
        </div>

        <div class="actions-row">
          <button id="buildShortBtn" type="button" class="btn-primary" style="flex:1">
            <svg class="ms-icon" viewBox="0 -960 960 960"><path d="m422-232 207-248H469l29-227-185 267h139l-30 208ZM320-80l40-280H160l360-520h80l-40 320h240L400-80h-80Z"/></svg>
            Generar Visuales 2.5D
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>
            <svg class="ms-icon" viewBox="0 -960 960 960"><path d="M480-118 120-398l66-50 294 228 294-228 66 50-360 280Zm0-202L120-600l360-280 360 280-360 280Zm0-102 228-178-228-178-228 178 228 178Z"/></svg>
            Escenas (<span id="sceneCount">0</span>)
          </h2>
        </div>
        <div id="scenesSummary" class="scenes-summary"></div>
      </div>
    </section>

    <section class="panel">
      <div class="card preview-card">
        <div class="phone-frame">
          <canvas id="previewCanvas" width="540" height="960"></canvas>
        </div>

        <div class="player-controls">
          <button id="playPauseBtn" type="button" class="btn-primary">
            <svg class="ms-icon" viewBox="0 -960 960 960"><path d="M320-200v-560l440 280-440 280Z"/></svg>
            Reproducir
          </button>
          <button id="restartBtn" type="button" class="btn-secondary" title="Reiniciar">
            <svg class="ms-icon" viewBox="0 -960 960 960"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
          </button>
          <span id="timeDisplay" class="time-display">00.0s / 00.0s</span>
        </div>

        <input type="range" id="timelineScrubber" min="0" max="100" step="0.01" value="0" class="scrubber" />
        <p id="statusBanner" class="status-banner">Listo.</p>
        <hr class="divider" />

        <button id="exportMp4Btn" type="button" class="btn-export">
          <svg class="ms-icon" viewBox="0 -960 960 960"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h480q33 0 56.5 23.5T720-720v180l160-160v440L720-420v180q0 33-23.5 56.5T640-160H160Z"/></svg>
          Exportar Short MP4 (9:16)
        </button>

        <div id="exportProgressWrap" class="progress-wrap hidden">
          <div class="progress-track"><div id="exportProgressBar" class="progress-fill"></div></div>
          <p id="exportProgressText" class="status-banner" style="margin-top:6px;">Preparando...</p>
        </div>

        <div id="exportResultWrap" class="export-result hidden">
          <video id="exportedVideoPreview" controls playsinline></video>
          <a id="downloadMp4Link" class="btn-primary download-btn" download="short-25d.mp4">
            <svg class="ms-icon" viewBox="0 -960 960 960"><path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg>
            Descargar MP4
          </a>
        </div>
      </div>
    </section>
  </main>

  <script>
    // =========================================================================
    // 0. MOTOR DE DIRECCIÓN DE ARTE 2.5D (5 REGLAS VISUALES ESTRICTAS)
    // =========================================================================
    window.ArtDirector25D = (() => {
      // Regla 3: Paletas armónicas de 3-4 colores principales + 1 color acento
      const PALETTES = {
        tension: {
          skyTop: '#0F172A', skyBot: '#1E293B',
          midDark: '#263348', midLight: '#3B4D6B',
          groundTop: '#162032', groundBot: '#0B111C',
          rim: '#F43F5E', accent: '#F43F5E', charCoat: '#334155'
        },
        comedia: {
          skyTop: '#1D4ED8', skyBot: '#60A5FA',
          midDark: '#3B82F6', midLight: '#93C5FD',
          groundTop: '#334155', groundBot: '#1E293B',
          rim: '#FDE047', accent: '#F97316', charCoat: '#F97316'
        },
        misterio: {
          skyTop: '#080C1D', skyBot: '#27245C',
          midDark: '#1E1B4B', midLight: '#3730A3',
          groundTop: '#141736', groundBot: '#080A1A',
          rim: '#22D3EE', accent: '#22D3EE', charCoat: '#312E81'
        },
        revelacion: {
          skyTop: '#064E3B', skyBot: '#0D9488',
          midDark: '#065F46', midLight: '#14B8A6',
          groundTop: '#1E293B', groundBot: '#0F172A',
          rim: '#FDE047', accent: '#FACC15', charCoat: '#0F766E'
        }
      };

      const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
      const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);

      function rRect(ctx, x, y, w, h, r) {
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
        else { ctx.beginPath(); ctx.rect(x, y, w, h); }
      }

      // Capa 1 (Fondo, z = 0.25): Degradado atmosférico + siluetas desenfocadas de bajo contraste
      function drawLayer1Background(ctx, pal, sc, cam, t) {
        ctx.save();
        ctx.translate(270 + cam.panX * 0.25, 480 + cam.panY * 0.25);
        const s = 1 + (cam.zoom - 1) * 0.25;
        ctx.scale(s, s);
        ctx.translate(-270, -480);

        const sky = ctx.createLinearGradient(0, 0, 0, 560);
        sky.addColorStop(0, pal.skyTop);
        sky.addColorStop(1, pal.skyBot);
        ctx.fillStyle = sky;
        ctx.fillRect(-160, -160, 860, 860);

        // Resplandor atmosférico de contra
        const astroX = 360 - cam.panX * 0.15, astroY = 230;
        const glow = ctx.createRadialGradient(astroX, astroY, 10, astroX, astroY, 200);
        glow.addColorStop(0, pal.accent + '44');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(astroX, astroY, 200, 0, Math.PI * 2); ctx.fill();

        // Siluetas desenfocadas en horizonte (nunca invaden el 15% superior)
        ctx.save();
        if (typeof ctx.filter === 'string') ctx.filter = 'blur(3px)';
        ctx.fillStyle = pal.midDark;
        ctx.globalAlpha = 0.45;
        if (sc.world === 'mountain' || sc.world === 'desert') {
          ctx.beginPath();
          ctx.moveTo(-120, 540); ctx.lineTo(70, 310); ctx.lineTo(250, 460);
          ctx.lineTo(410, 290); ctx.lineTo(660, 540); ctx.closePath(); ctx.fill();
        } else if (sc.world === 'space') {
          ctx.beginPath(); ctx.arc(380, 290, 82, 0, Math.PI * 2); ctx.fill();
        } else {
          for (let i = -1; i < 8; i++) {
            const h = 110 + ((i * 47) % 120);
            ctx.fillRect(i * 82, 540 - h, 68, h);
          }
        }
        ctx.restore();
        ctx.restore();
      }

      // Volumen estilizado con bisel suave, sombra de oclusión y rim light
      function drawBeveledVolume(ctx, x, y, w, h, baseCol, darkCol, rimCol, groundY) {
        ctx.save();
        // Sombra proyectada nítida en suelo
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.ellipse(x + w * 0.5 + 14, groundY + 4, w * 0.56, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cuerpo principal con degradado direccional
        const g = ctx.createLinearGradient(x, y, x + w, y + h);
        g.addColorStop(0, baseCol);
        g.addColorStop(1, darkCol);
        ctx.fillStyle = g;
        ctx.strokeStyle = '#0D111A';
        ctx.lineWidth = 3;
        rRect(ctx, x, y, w, h, 10);
        ctx.fill(); ctx.stroke();

        // Oclusión ambiental en la base
        const ao = ctx.createLinearGradient(0, y + h - 24, 0, y + h);
        ao.addColorStop(0, 'rgba(0,0,0,0)');
        ao.addColorStop(1, 'rgba(0,0,0,0.38)');
        ctx.fillStyle = ao;
        rRect(ctx, x + 2, y + h - 24, w - 4, 22, 6); ctx.fill();

        // Rim light en borde izquierdo/superior para despegar del fondo
        ctx.strokeStyle = rimCol;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(x + 6, y + h - 10);
        ctx.lineTo(x + 6, y + 8);
        ctx.lineTo(x + w - 10, y + 8);
        ctx.stroke();
        ctx.restore();
      }

      // Capa 2 (Plano Medio, z = 0.65): Suelo 2.5D + entorno/objetos clave con volumen
      function drawLayer2Midground(ctx, pal, sc, cam, t, sceneTime) {
        ctx.save();
        ctx.translate(270 + cam.panX * 0.65, 480 + cam.panY * 0.65);
        const s = 1 + (cam.zoom - 1) * 0.65;
        ctx.scale(s, s);
        ctx.translate(-270, -480);

        const groundY = 540;
        const vpX = 270 - cam.panX * 0.35;

        // Suelo con profundidad real (sin llenar más allá de lo necesario)
        const gGrad = ctx.createLinearGradient(0, groundY, 0, 960);
        gGrad.addColorStop(0, pal.groundTop);
        gGrad.addColorStop(1, pal.groundBot);
        ctx.fillStyle = gGrad;
        ctx.fillRect(-180, groundY, 900, 480);

        // Líneas de perspectiva sutiles y limpias
        ctx.strokeStyle = 'rgba(255,255,255,0.07)';
        ctx.lineWidth = 2;
        for (let i = -6; i <= 6; i++) {
          ctx.beginPath(); ctx.moveTo(vpX + i * 38, groundY); ctx.lineTo(270 + i * 160, 960); ctx.stroke();
        }
        // Línea de horizonte limpia
        ctx.strokeStyle = pal.rim + '55';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-180, groundY); ctx.lineTo(720, groundY); ctx.stroke();

        // Entorno estilizado en zona media (15%-75% seguro)
        if (sc.world === 'office' || sc.world === 'interior') {
          drawBeveledVolume(ctx, 290, 460, 175, 110, pal.midLight, pal.midDark, pal.rim, 570);
          // Monitor con color acento
          drawBeveledVolume(ctx, 330, 395, 95, 62, pal.accent, pal.midDark, '#ffffff', 460);
          // Reloj pared
          ctx.fillStyle = '#F8FAFC'; ctx.strokeStyle = '#0D111A'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(130, 270, 32, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.strokeStyle = pal.accent; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(130, 270); ctx.lineTo(130 + Math.cos(t * 2) * 20, 270 + Math.sin(t * 2) * 20); ctx.stroke();
        } else {
          // Edificios/estructuras biseladas en ambos lados dejando el centro respirar
          drawBeveledVolume(ctx, -20, 285, 125, 275, pal.midLight, pal.midDark, pal.rim, 560);
          drawBeveledVolume(ctx, 435, 255, 130, 305, pal.midLight, pal.midDark, pal.rim, 560);
          // Ventanas limpias sin saturación
          ctx.fillStyle = pal.accent + 'AA';
          [20, 56].forEach((wx) => {
            for (let wy = 320; wy <= 460; wy += 48) rRect(ctx, wx, wy, 22, 28, 4), ctx.fill();
          });
        }

        // Elemento clave / vehículo en zona heroica (y: 380..620)
        const enter = easeOutBack(Math.min(1, sceneTime / 0.42));
        const px = sc.evento === 'CHOQUE' ? 350 - Math.min(40, sceneTime * 80) : 365;
        ctx.save();
        ctx.translate(px, 595);
        ctx.scale(enter, enter);
        ctx.translate(-px, -595);

        if (sc.prop === 'moto') {
          drawBeveledVolume(ctx, px - 72, 525, 144, 48, pal.accent, pal.midDark, '#ffffff', 595);
          drawBeveledVolume(ctx, px - 68, 482, 46, 42, pal.midLight, pal.midDark, pal.rim, 525); // Cajón reparto
          ctx.fillStyle = '#0F172A'; ctx.strokeStyle = pal.rim; ctx.lineWidth = 3;
          [px - 48, px + 48].forEach((wx) => { ctx.beginPath(); ctx.arc(wx, 578, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
        } else if (sc.prop === 'van' || sc.prop === 'car') {
          drawBeveledVolume(ctx, px - 95, 495, 190, 78, pal.midLight, pal.midDark, pal.rim, 595);
          drawBeveledVolume(ctx, px - 88, 525, 176, 16, pal.accent, pal.accent, '#ffffff', 541);
          ctx.fillStyle = '#0F172A'; ctx.strokeStyle = pal.rim; ctx.lineWidth = 3;
          [px - 56, px + 56].forEach((wx) => { ctx.beginPath(); ctx.arc(wx, 578, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
        } else if (sc.prop === 'boxes') {
          drawBeveledVolume(ctx, px - 55, 525, 62, 62, pal.accent, pal.midDark, '#ffffff', 595);
          drawBeveledVolume(ctx, px + 10, 535, 52, 52, pal.midLight, pal.midDark, pal.rim, 595);
          drawBeveledVolume(ctx, px - 25, 470, 55, 55, pal.accent, pal.midDark, '#ffffff', 525);
        } else if (sc.prop === 'vault') {
          drawBeveledVolume(ctx, px - 70, 415, 140, 175, pal.midLight, pal.midDark, pal.rim, 595);
          ctx.fillStyle = pal.accent; ctx.strokeStyle = '#0D111A'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(px, 500, 36, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else if (sc.prop === 'rocket') {
          const lift = sc.evento === 'REVELACION' ? Math.min(80, sceneTime * 35) : 0;
          drawBeveledVolume(ctx, px - 34, 410 - lift, 68, 165, pal.midLight, pal.midDark, pal.rim, 595);
          ctx.fillStyle = pal.accent; ctx.beginPath(); ctx.moveTo(px - 34, 415 - lift); ctx.lineTo(px, 345 - lift); ctx.lineTo(px + 34, 415 - lift); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
        ctx.restore();
      }

      // Capa 3 (Primer Plano, z = 1.0): Personaje estilizado + sombra de contacto + micro-animación + partículas
      function drawLayer3Foreground(ctx, pal, sc, cam, t, sceneTime) {
        ctx.save();
        ctx.translate(270 + cam.panX, 480 + cam.panY);
        ctx.scale(cam.zoom, cam.zoom);
        ctx.translate(-270, -480);

        const groundY = 635;
        const reactP = easeOutCubic(Math.min(1, sceneTime / 0.45));
        const isShock = sc.evento === 'CHOQUE' || sc.evento === 'GIRO';
        const isFast = sc.evento === 'PERSECUCION' || sc.action === 'run';

        const charX = sc.prop === 'none' ? 270 : (isFast ? 140 + reactP * 45 : 175);
        const breathe = Math.sin(t * 3.4) * 3;
        const bounce = isFast ? Math.abs(Math.sin(t * 14)) * 12 : (isShock && sceneTime < 0.5 ? Math.sin(sceneTime * 18) * 10 : Math.abs(Math.sin(t * 3.4)) * 3);

        // Sombra de contacto nítida bajo los pies
        ctx.fillStyle = 'rgba(0,0,0,0.44)';
        ctx.beginPath();
        ctx.ellipse(charX, groundY + 4, 52 * (1 - bounce / 120), 13 * (1 - bounce / 120), 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(charX, groundY - bounce);
        if (isFast) ctx.rotate(0.12);

        const stride = isFast ? Math.sin(t * 14) * 24 : 0;

        // Piernas
        ctx.strokeStyle = '#0D111A'; ctx.lineWidth = 8; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-12, -48); ctx.lineTo(-14 + stride, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(12, -48); ctx.lineTo(14 - stride, 0); ctx.stroke();

        // Torso con cel-shading suave + rim light
        const torsoG = ctx.createLinearGradient(-28, -124, 28, -44);
        torsoG.addColorStop(0, pal.charCoat);
        torsoG.addColorStop(1, pal.midDark);
        ctx.fillStyle = torsoG; ctx.lineWidth = 5;
        rRect(ctx, -28, -124 + breathe * 0.4, 56, 78, 18); ctx.fill(); ctx.stroke();

        ctx.strokeStyle = pal.rim; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(-23, -114); ctx.lineTo(-23, -54); ctx.stroke();

        // Brazos
        ctx.strokeStyle = '#0D111A'; ctx.lineWidth = 7;
        const armAng = isShock ? -42 : isFast ? stride * 0.9 : Math.sin(t * 3.4) * 6;
        ctx.beginPath(); ctx.moveTo(-28, -104); ctx.lineTo(-50, -78 + armAng); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(28, -104); ctx.lineTo(50, -78 - armAng); ctx.stroke();

        // Cabeza cel-shaded (nunca cruza hacia el 15% superior: 635 - 170 - 44 = 421 >> 144)
        ctx.save();
        ctx.translate(0, -170 + breathe);
        const headG = ctx.createRadialGradient(-16, -18, 8, 0, 0, 50);
        headG.addColorStop(0, '#FFFFFF');
        headG.addColorStop(0.72, '#F7EFE6');
        headG.addColorStop(1, '#CFC4B8');
        ctx.fillStyle = headG; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Cabello o gorra limpia
        ctx.fillStyle = pal.midDark;
        if (sc.role === 'delivery') {
          ctx.fillStyle = pal.accent;
          ctx.beginPath(); ctx.arc(0, -10, 46, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillRect(0, -16, 50, 8);
        } else {
          ctx.beginPath(); ctx.arc(0, -14, 43, Math.PI * 1.06, Math.PI * 1.94); ctx.fill();
        }

        // Ojos + reacción al evento
        const blink = (t % 3.4) > 3.28;
        ctx.strokeStyle = '#0D111A'; ctx.lineWidth = 3.5;
        if (blink) {
          ctx.beginPath(); ctx.moveTo(-22, -4); ctx.lineTo(-6, -4); ctx.moveTo(6, -4); ctx.lineTo(22, -4); ctx.stroke();
        } else {
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.arc(-14, -4, isShock ? 11 : 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(14, -4, isShock ? 11 : 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#0D111A';
          ctx.beginPath(); ctx.arc(-13, -4, isShock ? 3 : 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(15, -4, isShock ? 3 : 4.5, 0, Math.PI * 2); ctx.fill();
        }

        if (isShock) {
          ctx.fillStyle = '#7F1D1D'; ctx.beginPath(); ctx.ellipse(0, 18, 9, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(0, 14, 11, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
        }

        ctx.restore();
        ctx.restore();

        // Regla 4: Comunicación en <1s (ondas de impacto, líneas cinéticas o partículas limpias)
        if ((sc.evento === 'CHOQUE' || sc.evento === 'GIRO') && sceneTime < 0.75) {
          const r = 20 + (sceneTime / 0.75) * 160;
          ctx.strokeStyle = pal.accent;
          ctx.globalAlpha = 1 - sceneTime / 0.75;
          ctx.lineWidth = 5;
          ctx.beginPath(); ctx.arc(285, 500, r, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
        }
        if (isFast) {
          ctx.strokeStyle = pal.rim + '66'; ctx.lineWidth = 3;
          for (let i = 0; i < 6; i++) {
            const lx = ((i * 110 - t * 380) % 540 + 540) % 540;
            const ly = 260 + i * 58;
            ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - 65, ly); ctx.stroke();
          }
        }
        ctx.restore();
      }

      // Render completo respetando estrictamente las 5 reglas
      function drawScene(ctx, canvasW, canvasH, { t, scene, sceneTime, showSubtitles }) {
        ctx.save();
        ctx.clearRect(0, 0, canvasW, canvasH);
        ctx.scale(canvasW / 540, canvasH / 960);

        if (!scene) {
          ctx.fillStyle = '#0B0F19'; ctx.fillRect(0, 0, 540, 960);
          ctx.restore(); return;
        }

        const pal = PALETTES[scene.tono] || PALETTES.misterio;
        const p = Math.min(1, sceneTime / Math.max(0.5, scene.duration));
        const easeP = easeOutCubic(p);

        // Cámara con movimiento suave y sin salirse de los márgenes seguros
        const cam = { zoom: 1 + easeP * 0.08, panX: 0, panY: 0 };
        if (scene.evento === 'CHOQUE' && sceneTime < 0.55) {
          const amp = (1 - sceneTime / 0.55) * 12;
          cam.panX = Math.sin(t * 52) * amp;
          cam.panY = Math.cos(t * 46) * amp;
        } else if (scene.evento === 'PERSECUCION') {
          cam.panX = -38 + easeP * 76;
          cam.zoom = 1.06;
        } else if (scene.evento === 'REVELACION') {
          cam.panY = 24 - easeP * 32;
          cam.zoom = 1.0 + easeP * 0.12;
        } else {
          cam.panX = (scene.id % 2 === 0 ? -1 : 1) * (-24 + easeP * 48);
        }

        drawLayer1Background(ctx, pal, scene, cam, t);
        drawLayer2Midground(ctx, pal, scene, cam, t, sceneTime);
        drawLayer3Foreground(ctx, pal, scene, cam, t, sceneTime);

        // Oscurecimiento suave en zonas seguras (15% sup y 25% inf) para legibilidad total
        const topFade = ctx.createLinearGradient(0, 0, 0, 144);
        topFade.addColorStop(0, 'rgba(7, 10, 18, 0.55)'); topFade.addColorStop(1, 'rgba(7, 10, 18, 0)');
        ctx.fillStyle = topFade; ctx.fillRect(0, 0, 540, 144);

        const botFade = ctx.createLinearGradient(0, 700, 0, 960);
        botFade.addColorStop(0, 'rgba(7, 10, 18, 0)'); botFade.addColorStop(1, 'rgba(7, 10, 18, 0.78)');
        ctx.fillStyle = botFade; ctx.fillRect(0, 700, 540, 260);

        // ZONA SEGURA SUPERIOR (0% - 15%): Título en cápsula limpia
        if (scene.title) {
          ctx.font = '700 22px "Space Grotesk", sans-serif';
          const tw = ctx.measureText(scene.title).width;
          ctx.fillStyle = 'rgba(10, 14, 24, 0.78)';
          ctx.strokeStyle = pal.accent;
          ctx.lineWidth = 2;
          rRect(ctx, 270 - tw / 2 - 18, 44, tw + 36, 40, 20);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#FFFFFF';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(scene.title, 270, 64);
        }

        // ZONA SEGURA INFERIOR (75% - 100%): Subtítulos grandes con contorno negro
        if (showSubtitles && scene.words && scene.words.length) {
          let wi = 0;
          for (let i = 0; i < scene.words.length; i++) { if (sceneTime >= scene.words[i].start) wi = i; }
          const start = Math.floor(wi / 2) * 2;
          const line = scene.words.slice(start, start + 2).map((x) => x.word).join(' ');
          ctx.save();
          ctx.font = '800 38px "Space Grotesk", "Plus Jakarta Sans", sans-serif';
          const lw = ctx.measureText(line).width;
          const s = lw > 460 ? 460 / lw : 1;
          ctx.translate(270, 815); ctx.scale(s, s);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.lineJoin = 'round'; ctx.lineWidth = 10; ctx.strokeStyle = '#07090F';
          ctx.strokeText(line, 0, 0);
          ctx.fillStyle = '#FFFFFF';
          ctx.fillText(line, 0, 0);
          ctx.restore();
        }

        ctx.restore();
      }

      return { PALETTES, drawScene };
    })();

    // =========================================================================
    // 1. ANALIZADOR DE GUIÓN -> CONFIGURACIÓN VISUAL ARTDIRECTOR 2.5D
    // =========================================================================
    window.StoryParser = (() => {
      const PRESETS = {
        repartidor:
`Un repartidor recogió diez cajas en el almacén para entregarlas antes de medianoche.
Salió en su moto a toda velocidad por la ciudad bajo la lluvia.
De pronto una furgoneta le cerró el paso y provocó un fuerte choque.
Logró entregar el paquete principal a tiempo y todos lo celebraron.`,
        japon:
`En Japón es casi imposible despedir a un empleado de oficina.
Los jefes lo llevan a una sala vacía sin ordenador ni trabajo.
Al principio parece un descanso mirando el reloj todo el día.
Pero la presión silenciosa termina revelando la dura trampa.`,
        banco:
`Un ladrón entró de noche a la bóveda secreta del banco.
Al tocar el oro saltó la alarma roja por todo el edificio.
Huyó corriendo en su coche mientras la policía lo perseguía.
Desapareció entre la niebla justo antes del amanecer.`,
        espacio:
`Un astronauta reparaba una estación en órbita junto a un planeta.
Un asteroide chocó contra el cohete y provocó una explosión.
Activó los propulsores de emergencia y descendió hacia la Tierra.
Aterrizó en el desierto sano y salvo al amanecer.`
      };

      function buildWords(text, duration) {
        const list = text.trim().split(/\s+/).filter(Boolean);
        if (!list.length) return [];
        const usable = Math.max(0.8, duration - 0.25);
        const w = list.map((x) => Math.max(2, x.length) + (/[,.;:!?]$/.test(x) ? 2 : 0));
        const tot = w.reduce((a, b) => a + b, 0);
        let cur = 0.12;
        return list.map((word, i) => {
          const d = (w[i] / tot) * usable;
          const obj = { word, start: cur, end: cur + d };
          cur += d;
          return obj;
        });
      }

      function compile(raw) {
        let blocks = raw.trim().split(/\n+/).map((b) => b.trim()).filter(Boolean);
        if (blocks.length === 1) {
          blocks = (raw.trim().match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [raw.trim()]).map((s) => s.trim()).filter(Boolean);
        }

        const fullLower = raw.toLowerCase();
        // Mismo tono armónico o evolución coherente en toda la historia
        let baseTono = 'misterio';
        if (/repartidor|comedia|descanso|celebr/.test(fullLower)) baseTono = 'comedia';
        if (/choque|alarma|explos|robo|ladrón/.test(fullLower)) baseTono = 'tension';

        return blocks.map((text, idx) => {
          const l = text.toLowerCase();
          let evento = 'DIALOGO';
          if (/choque|explos|cerró|saltó la alarma|ard/.test(l)) evento = 'CHOQUE';
          else if (/de pronto|trampa|giro|sin ordenador/.test(l)) evento = 'GIRO';
          else if (/velocidad|corriendo|huyó|persegu/.test(l)) evento = 'PERSECUCION';
          else if (/logró|revelando|aterrizó|celebr/.test(l)) evento = 'REVELACION';

          let tono = baseTono;
          if (evento === 'CHOQUE') tono = 'tension';
          else if (evento === 'REVELACION') tono = 'revelacion';

          let world = 'city';
          if (/oficina|sala|ordenador|jefe|reloj/.test(l)) world = 'office';
          else if (/desierto|arena/.test(l)) world = 'desert';
          else if (/espacio|órbita|planeta|asteroide/.test(l)) world = 'space';
          else if (/montaña|volcán/.test(l)) world = 'mountain';
          else if (/bóveda|banco|cocina|habitación/.test(l)) world = 'interior';

          let prop = 'none';
          if (/moto/.test(l)) prop = 'moto';
          else if (/furgoneta|furgo/.test(l)) prop = 'van';
          else if (/coche/.test(l)) prop = 'car';
          else if (/caja|paquete|almacén/.test(l)) prop = 'boxes';
          else if (/bóveda|oro/.test(l)) prop = 'vault';
          else if (/cohete|estación/.test(l)) prop = 'rocket';
          else if (/repartidor/.test(fullLower) && idx === 1) prop = 'moto';

          const role = /repartidor|paquete|moto/.test(fullLower) ? 'delivery' : 'casual';
          const action = (evento === 'PERSECUCION' || /corriendo|huyó/.test(l)) ? 'run' : 'idle';

          const num = text.match(/\b(1[0-9]{3}|20[0-2][0-9]|\d+(?:[.,]\d+)?\s?(?:millones|mil|km\/h|días))\b/i);
          const title = num ? num[1].toUpperCase() : (evento !== 'DIALOGO' ? evento : (text.replace(/[¿?¡!.,;:]/g, '').split(/\s+/).filter((w) => w.length > 4).slice(0, 2).join(' ').toUpperCase() || `ESCENA ${idx + 1}`));

          const duration = Math.max(2.8, Math.min(5.6, text.split(/\s+/).length * 0.26 + 1.4));
          return { id: idx + 1, text, title, evento, tono, world, prop, role, action, duration, words: buildWords(text, duration) };
        });
      }

      return { PRESETS, compile };
    })();

    // =========================================================================
    // 2. AUDIO SINTÉTICO (MÚSICA + SFX) + EXPORTADOR MP4
    // =========================================================================
    window.AudioEngine = (() => {
      const SR = 48000;
      let liveCtx = null;
      function ensureCtx() {
        if (!liveCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          try { liveCtx = new AC({ sampleRate: SR }); } catch (_) { liveCtx = new AC(); }
        }
        if (liveCtx.state === 'suspended') liveCtx.resume();
        return liveCtx;
      }

      async function renderMix(scenes, totalDuration, enableMusic, enableSFX) {
        const N = Math.ceil(totalDuration * SR);
        const buf = new AudioBuffer({ numberOfChannels: 2, length: N, sampleRate: SR });
        const music = new Float64Array(N), sfx = new Float64Array(N);
        let seed = 42;
        const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return (seed / 4294967296) * 2 - 1; };

        if (enableMusic) {
          const chords = [[55, 82.4, 110], [49, 73.4, 98], [43.65, 65.4, 87.3], [49, 73.4, 98]];
          const seg = totalDuration / chords.length;
          chords.forEach((notes, ci) => {
            const i0 = Math.floor(ci * seg * SR), i1 = Math.min(N, Math.floor((ci + 1) * seg * SR));
            for (let i = i0; i < i1; i++) {
              const tt = (i - i0) / SR, env = Math.min(1, tt / 0.8) * Math.min(1, (seg - tt) / 0.8);
              notes.forEach((f) => { music[i] += 0.04 * env * Math.sin(2 * Math.PI * f * tt); });
            }
          });
          for (let b = 0; b < totalDuration; b += 0.5) {
            const idx = Math.floor(b * SR), ln = Math.min(Math.floor(0.2 * SR), N - idx);
            for (let q = 0; q < ln; q++) music[idx + q] += 0.07 * Math.sin(2 * Math.PI * 66 * (q / SR)) * Math.exp(-(q / SR) * 18);
          }
        }

        if (enableSFX) {
          const addBand = (sec, dur, amp) => {
            const idx = Math.floor(sec * SR), ln = Math.min(Math.floor(dur * SR), N - idx);
            for (let q = 0; q < ln; q++) sfx[idx + q] += amp * rand() * Math.exp(-(q / SR) * 5);
          };
          scenes.forEach((sc, i) => {
            if (i > 0) addBand(sc.startTime, 0.25, 0.12);
            if (sc.evento === 'CHOQUE') addBand(sc.startTime + 0.08, 0.9, 0.35);
            else if (sc.evento === 'REVELACION') {
              const idx = Math.floor((sc.startTime + 0.15) * SR), ln = Math.min(Math.floor(0.6 * SR), N - idx);
              for (let q = 0; q < ln; q++) sfx[idx + q] += 0.12 * Math.sin(2 * Math.PI * 880 * (q / SR)) * Math.exp(-(q / SR) * 5);
            }
          });
        }

        const L = buf.getChannelData(0), R = buf.getChannelData(1), norm = Math.tanh(1.1);
        for (let i = 0; i < N; i++) {
          const v = Math.tanh((music[i] + sfx[i]) * 1.3) / norm;
          L[i] = Math.max(-0.92, Math.min(0.92, v)); R[i] = L[i];
        }
        return buf;
      }

      return { ensureCtx, renderMix };
    })();

    async function loadMp4Muxer() {
      if (typeof window.Mp4Muxer !== 'undefined') return true;
      for (const u of ['https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js', 'https://unpkg.com/mp4-muxer@5.2.2/build/mp4-muxer.js']) {
        try {
          await new Promise((res, rej) => {
            const s = document.createElement('script'); s.src = u; s.async = true;
            const tm = setTimeout(() => rej(), 4000);
            s.onload = () => { clearTimeout(tm); res(); }; s.onerror = () => { clearTimeout(tm); rej(); };
            document.head.appendChild(s);
          });
          if (typeof window.Mp4Muxer !== 'undefined') return true;
        } catch (_) {}
      }
      return false;
    }

    window.ExporterMP4 = (() => {
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      async function exportVideo({ scenes, masterBuffer, totalDuration, width, height, fps, showSubtitles, onProgress }) {
        const hasMuxer = await loadMp4Muxer();
        if (!hasMuxer || typeof VideoEncoder === 'undefined' || typeof AudioEncoder === 'undefined') {
          const c = document.createElement('canvas'); c.width = width; c.height = height;
          const ctx = c.getContext('2d'), actx = window.AudioEngine.ensureCtx(), dest = actx.createMediaStreamDestination();
          const src = actx.createBufferSource(); src.buffer = masterBuffer; src.connect(dest);
          const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
          const rec = new MediaRecorder(new MediaStream([...c.captureStream(fps).getVideoTracks(), ...dest.stream.getAudioTracks()]), { mimeType: mime, videoBitsPerSecond: 4_500_000 });
          const chunks = []; rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
          return new Promise((resolve) => {
            rec.onstop = () => resolve({ blob: new Blob(chunks, { type: mime }), ext: mime.includes('mp4') ? 'mp4' : 'webm' });
            const st = actx.currentTime + 0.05; rec.start(); src.start(st);
            const tick = () => {
              const el = Math.max(0, actx.currentTime - st);
              if (el >= totalDuration) { rec.stop(); try { src.stop(); } catch (_) {} return; }
              let sc = scenes[scenes.length - 1];
              for (const s of scenes) { if (el >= s.startTime && el < s.startTime + s.duration) { sc = s; break; } }
              window.ArtDirector25D.drawScene(ctx, width, height, { t: el, scene: sc, sceneTime: Math.max(0, el - sc.startTime), showSubtitles });
              onProgress(Math.min(0.98, el / totalDuration), `Grabando (${el.toFixed(1)}s)...`);
              requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          });
        }

        let vCfg = null;
        for (const codec of ['avc1.64002a', 'avc1.4d002a', 'avc1.42002a', 'avc1.42001f']) {
          const cfg = { codec, width, height, bitrate: width >= 1080 ? 5_800_000 : 3_400_000, framerate: fps };
          if ((await VideoEncoder.isConfigSupported(cfg)).supported) { vCfg = cfg; break; }
        }
        let aCfg = null, aMux = 'aac';
        for (const c of [{ codec: 'mp4a.40.2', mux: 'aac' }, { codec: 'opus', mux: 'opus' }]) {
          const cfg = { codec: c.codec, numberOfChannels: 2, sampleRate: masterBuffer.sampleRate, bitrate: 128000 };
          if ((await AudioEncoder.isConfigSupported(cfg)).supported) { aCfg = cfg; aMux = c.mux; break; }
        }

        const muxer = new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video: { codec: 'avc', width, height },
          audio: { codec: aMux, numberOfChannels: 2, sampleRate: masterBuffer.sampleRate },
          fastStart: 'in-memory'
        });

        const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: console.error }); ve.configure(vCfg);
        const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: console.error }); ae.configure(aCfg);

        const ch0 = masterBuffer.getChannelData(0), ch1 = masterBuffer.getChannelData(1), sr = masterBuffer.sampleRate;
        for (let off = 0; off < ch0.length; off += 2048) {
          const n = Math.min(2048, ch0.length - off), pl = new Float32Array(n * 2);
          pl.set(ch0.subarray(off, off + n), 0); pl.set(ch1.subarray(off, off + n), n);
          const ad = new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((off * 1_000_000) / sr), data: pl });
          while (ae.encodeQueueSize > 16) await sleep(4);
          ae.encode(ad); ad.close();
        }

        const c = document.createElement('canvas'); c.width = width; c.height = height;
        const ctx = c.getContext('2d'), totF = Math.ceil(totalDuration * fps), durUs = Math.round(1_000_000 / fps);
        for (let f = 0; f < totF; f++) {
          const t = f / fps;
          let sc = scenes[scenes.length - 1];
          for (const s of scenes) { if (t >= s.startTime && t < s.startTime + s.duration) { sc = s; break; } }
          window.ArtDirector25D.drawScene(ctx, width, height, { t, scene: sc, sceneTime: Math.max(0, t - sc.startTime), showSubtitles });
          const fr = new VideoFrame(c, { timestamp: Math.round((f * 1_000_000) / fps), duration: durUs });
          while (ve.encodeQueueSize > 8) await sleep(6);
          ve.encode(fr, { keyFrame: f % (fps * 2) === 0 }); fr.close();
          if (f % 10 === 0) { onProgress(0.1 + 0.85 * (f / totF), `Renderizando (${f}/${totF})...`); await sleep(0); }
        }
        await ae.flush(); await ve.flush(); muxer.finalize();
        return { blob: new Blob([muxer.target.buffer], { type: 'video/mp4' }), ext: 'mp4' };
      }
      return { exportVideo };
    })();

    // =========================================================================
    // 3. CONTROLADOR UI
    // =========================================================================
    function init() {
      const el = {
        presetSelect: document.getElementById('presetSelect'),
        loadPresetBtn: document.getElementById('loadPresetBtn'),
        storyInput: document.getElementById('storyInput'),
        resolutionSelect: document.getElementById('resolutionSelect'),
        fpsSelect: document.getElementById('fpsSelect'),
        subtitleModeSelect: document.getElementById('subtitleModeSelect'),
        musicToggle: document.getElementById('musicToggle'),
        sfxToggle: document.getElementById('sfxToggle'),
        buildShortBtn: document.getElementById('buildShortBtn'),
        sceneCount: document.getElementById('sceneCount'),
        scenesSummary: document.getElementById('scenesSummary'),
        previewCanvas: document.getElementById('previewCanvas'),
        playPauseBtn: document.getElementById('playPauseBtn'),
        restartBtn: document.getElementById('restartBtn'),
        timelineScrubber: document.getElementById('timelineScrubber'),
        timeDisplay: document.getElementById('timeDisplay'),
        statusBanner: document.getElementById('statusBanner'),
        exportMp4Btn: document.getElementById('exportMp4Btn'),
        exportProgressWrap: document.getElementById('exportProgressWrap'),
        exportProgressBar: document.getElementById('exportProgressBar'),
        exportProgressText: document.getElementById('exportProgressText'),
        exportResultWrap: document.getElementById('exportResultWrap'),
        exportedVideoPreview: document.getElementById('exportedVideoPreview'),
        downloadMp4Link: document.getElementById('downloadMp4Link')
      };

      const state = { scenes: [], masterBuffer: null, totalDuration: 0, isPlaying: false, playOffset: 0, audioStart: 0, srcNode: null, rafId: null, lastUrl: null };
      const pCtx = el.previewCanvas.getContext('2d');
      const playIcon = `<svg class="ms-icon" viewBox="0 -960 960 960"><path d="M320-200v-560l440 280-440 280Z"/></svg>`;
      const pauseIcon = `<svg class="ms-icon" viewBox="0 -960 960 960"><path d="M520-200v-560h240v560H520Zm-320 0v-560h240v560H200Z"/></svg>`;

      function drawAt(t) {
        let sc = state.scenes[state.scenes.length - 1] || null;
        for (const s of state.scenes) { if (t >= s.startTime && t < s.startTime + s.duration) { sc = s; break; } }
        window.ArtDirector25D.drawScene(pCtx, 540, 960, { t, scene: sc, sceneTime: sc ? Math.max(0, t - sc.startTime) : 0, showSubtitles: el.subtitleModeSelect.value === 'on' });
      }

      function renderSummary() {
        el.sceneCount.textContent = state.scenes.length;
        el.scenesSummary.innerHTML = '';
        const tonos = ['tension', 'comedia', 'misterio', 'revelacion'];
        const eventos = ['DIALOGO', 'CHOQUE', 'GIRO', 'PERSECUCION', 'REVELACION'];
        const props = ['none', 'moto', 'van', 'car', 'boxes', 'vault', 'rocket'];

        state.scenes.forEach((sc, i) => {
          const div = document.createElement('div');
          div.className = 'scene-pill';
          div.style.animationDelay = `${i * 40}ms`;
          div.innerHTML = `
            <div class="scene-pill-head"><strong>Escena ${i + 1} · ${sc.title}</strong><span class="scene-time-chip">${sc.startTime.toFixed(1)}s–${(sc.startTime + sc.duration).toFixed(1)}s</span></div>
            <p></p>
            <div class="grid-4">
              <label>Tono<select class="s-tono">${tonos.map((x) => `<option value="${x}">${x}</option>`).join('')}</select></label>
              <label>Evento<select class="s-ev">${eventos.map((x) => `<option value="${x}">${x}</option>`).join('')}</select></label>
              <label>Objeto<select class="s-prop">${props.map((x) => `<option value="${x}">${x}</option>`).join('')}</select></label>
              <label>Entorno<select class="s-world">${['city', 'office', 'interior', 'mountain', 'desert', 'space'].map((x) => `<option value="${x}">${x}</option>`).join('')}</select></label>
            </div>`;
          div.querySelector('p').textContent = sc.text;
          div.querySelector('.s-tono').value = sc.tono;
          div.querySelector('.s-ev').value = sc.evento;
          div.querySelector('.s-prop').value = sc.prop;
          div.querySelector('.s-world').value = sc.world;

          div.querySelector('.s-tono').addEventListener('change', (e) => { sc.tono = e.target.value; drawAt(state.playOffset); });
          div.querySelector('.s-ev').addEventListener('change', (e) => { sc.evento = e.target.value; drawAt(state.playOffset); });
          div.querySelector('.s-prop').addEventListener('change', (e) => { sc.prop = e.target.value; drawAt(state.playOffset); });
          div.querySelector('.s-world').addEventListener('change', (e) => { sc.world = e.target.value; drawAt(state.playOffset); });
          el.scenesSummary.appendChild(div);
        });
      }

      async function build() {
        stop();
        const raw = el.storyInput.value.trim();
        if (!raw) return;
        state.scenes = window.StoryParser.compile(raw);
        let c = 0; state.scenes.forEach((s) => { s.startTime = c; c += s.duration; });
        state.totalDuration = Math.max(1, c + 0.2);
        state.playOffset = 0;
        el.timelineScrubber.max = state.totalDuration.toFixed(2);
        el.timeDisplay.textContent = `0.0s / ${state.totalDuration.toFixed(1)}s`;
        drawAt(0);
        renderSummary();
        state.masterBuffer = await window.AudioEngine.renderMix(state.scenes, state.totalDuration, el.musicToggle.checked, el.sfxToggle.checked);
        el.statusBanner.textContent = `${state.scenes.length} escenas 2.5D listas (${state.totalDuration.toFixed(1)}s).`;
      }

      function stop() {
        state.isPlaying = false; el.playPauseBtn.innerHTML = `${playIcon} Reproducir`;
        if (state.srcNode) { try { state.srcNode.stop(); } catch (_) {} state.srcNode = null; }
        if (state.rafId) cancelAnimationFrame(state.rafId);
      }

      function play() {
        if (!state.scenes.length || !state.masterBuffer) return;
        const ctx = window.AudioEngine.ensureCtx();
        if (state.playOffset >= state.totalDuration - 0.05) state.playOffset = 0;
        const src = ctx.createBufferSource(); src.buffer = state.masterBuffer; src.connect(ctx.destination);
        const st = ctx.currentTime + 0.04; src.start(st, state.playOffset);
        state.srcNode = src; state.audioStart = st - state.playOffset; state.isPlaying = true;
        el.playPauseBtn.innerHTML = `${pauseIcon} Pausar`;
        const loop = () => {
          if (!state.isPlaying) return;
          const e = Math.max(0, ctx.currentTime - state.audioStart); state.playOffset = e;
          if (e >= state.totalDuration) { stop(); state.playOffset = 0; drawAt(0); el.timeDisplay.textContent = `0.0s / ${state.totalDuration.toFixed(1)}s`; el.timelineScrubber.value = 0; return; }
          drawAt(e); el.timeDisplay.textContent = `${e.toFixed(1)}s / ${state.totalDuration.toFixed(1)}s`; el.timelineScrubber.value = e;
          state.rafId = requestAnimationFrame(loop);
        };
        state.rafId = requestAnimationFrame(loop);
      }

      el.loadPresetBtn.addEventListener('click', () => { el.storyInput.value = window.StoryParser.PRESETS[el.presetSelect.value] || ''; build(); });
      el.buildShortBtn.addEventListener('click', build);
      el.subtitleModeSelect.addEventListener('change', () => drawAt(state.playOffset));
      el.playPauseBtn.addEventListener('click', () => state.isPlaying ? stop() : play());
      el.restartBtn.addEventListener('click', () => { stop(); state.playOffset = 0; drawAt(0); el.timeDisplay.textContent = `0.0s / ${state.totalDuration.toFixed(1)}s`; el.timelineScrubber.value = 0; });
      el.timelineScrubber.addEventListener('input', (e) => { stop(); state.playOffset = parseFloat(e.target.value); drawAt(state.playOffset); el.timeDisplay.textContent = `${state.playOffset.toFixed(1)}s / ${state.totalDuration.toFixed(1)}s`; });
      [el.musicToggle, el.sfxToggle].forEach((n) => n.addEventListener('change', async () => {
        if (state.scenes.length) state.masterBuffer = await window.AudioEngine.renderMix(state.scenes, state.totalDuration, el.musicToggle.checked, el.sfxToggle.checked);
      }));

      el.exportMp4Btn.addEventListener('click', async () => {
        if (!state.scenes.length || !state.masterBuffer) return;
        stop();
        const [w, h] = el.resolutionSelect.value.split('x').map(Number), fps = parseInt(el.fpsSelect.value, 10);
        el.exportMp4Btn.disabled = true; el.exportProgressWrap.classList.remove('hidden'); el.exportResultWrap.classList.add('hidden');
        try {
          const { blob, ext } = await window.ExporterMP4.exportVideo({
            scenes: state.scenes, masterBuffer: state.masterBuffer, totalDuration: state.totalDuration,
            width: w, height: h, fps, showSubtitles: el.subtitleModeSelect.value === 'on',
            onProgress: (r, m) => { el.exportProgressBar.style.width = `${Math.round(r * 100)}%`; el.exportProgressText.textContent = m; }
          });
          if (state.lastUrl) URL.revokeObjectURL(state.lastUrl);
          state.lastUrl = URL.createObjectURL(blob);
          el.exportedVideoPreview.src = state.lastUrl; el.downloadMp4Link.href = state.lastUrl; el.downloadMp4Link.download = `short-25d.${ext}`;
          el.exportResultWrap.classList.remove('hidden');
          el.statusBanner.textContent = `MP4 exportado (${(blob.size / 1024 / 1024).toFixed(2)} MB).`;
        } finally {
          el.exportMp4Btn.disabled = false; el.exportProgressWrap.classList.add('hidden');
        }
      });

      el.storyInput.value = window.StoryParser.PRESETS.repartidor;
      build();
      loadMp4Muxer();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  </script>
</body>
</html>
