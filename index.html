<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Short 2.5D Engine — Mundo 3D Real + Cámara Dinámica (Sin APIs)</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #141923;
      --panel-alt: #1c2230;
      --border: #2b3448;
      --text: #eef1f7;
      --muted: #93a1b9;
      --primary: #4f7cff;
      --accent: #00c2a8;
      --export: #ff4d6d;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar h1 { margin: 0; font-size: 1.12rem; }
    .subtitle { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }

    .badge {
      background: var(--accent);
      color: #06211c;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      vertical-align: middle;
    }

    .status-pill {
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, 1.1fr) minmax(320px, 0.9fr);
      gap: 18px;
      padding: 18px;
      max-width: 1520px;
      margin: 0 auto;
    }

    @media (max-width: 960px) {
      .workspace { grid-template-columns: 1fr; }
    }

    .panel { display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
    }

    .card h2 { margin: 0 0 10px; font-size: 0.98rem; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .card-header h2 { margin: 0; }

    textarea, select {
      width: 100%;
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font: inherit;
      font-size: 0.88rem;
    }

    textarea { resize: vertical; line-height: 1.5; }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .checkbox-label {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      color: var(--text);
      cursor: pointer;
    }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
    .toggles-grid { display: flex; flex-wrap: wrap; gap: 16px; margin: 10px 0; }
    .preset-row, .actions-row { display: flex; gap: 8px; align-items: center; }
    .preset-row { flex: 1; min-width: 240px; }
    .actions-row { margin-top: 12px; gap: 10px; }

    button, .download-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: opacity 0.15s ease;
    }

    button:hover, .download-btn:hover { opacity: 0.9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); }
    .btn-export { background: var(--export); color: #fff; width: 100%; padding: 12px; font-size: 0.96rem; }

    .scenes-summary {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
    }

    .scene-pill {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
    }

    .scene-pill strong { color: var(--accent); }
    .scene-pill small { display: block; color: var(--muted); margin-top: 2px; }

    .preview-card { position: sticky; top: 16px; }

    .phone-frame {
      width: min(350px, 100%);
      aspect-ratio: 9 / 16;
      margin: 0 auto 12px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border);
    }

    #previewCanvas { width: 100%; height: 100%; display: block; }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .time-display {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .scrubber { width: 100%; margin-bottom: 8px; }
    .status-banner { margin: 4px 0 0; font-size: 0.82rem; color: #b7c4e0; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .progress-wrap { margin-top: 12px; }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--panel-alt);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }

    .export-result {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .export-result video {
      width: min(260px, 100%);
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      border-radius: 10px;
      background: #000;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Short 2.5D Engine <span class="badge">MUNDO 3D REAL + CÁMARA MÓVIL</span></h1>
      <p class="subtitle">Cada historia genera su propio mundo 3D, cámara orbitando/volando, música + SFX y MP4 9:16</p>
    </div>
    <div id="codecSupportBadge" class="status-pill">Iniciando...</div>
  </header>

  <main class="workspace">
    <!-- PANEL IZQUIERDO -->
    <section class="panel controls-panel">
      <div class="card">
        <div class="card-header">
          <h2>1. Tu Guion o Idea</h2>
          <div class="preset-row">
            <select id="presetSelect">
              <option value="boston">Boston 1919: La inundación de melaza</option>
              <option value="hacker">Un hacker robó un banco con una tostadora</option>
              <option value="espacio">El astronauta que quedó atrapado en órbita</option>
              <option value="torre_eiffel">El estafador que vendió la Torre Eiffel</option>
              <option value="pepsi">El día que Pepsi tuvo submarinos militares</option>
              <option value="faraon">El secreto enterrado bajo la pirámide</option>
            </select>
            <button id="loadPresetBtn" type="button" class="btn-secondary">Cargar</button>
          </div>
        </div>

        <textarea id="storyInput" rows="7" placeholder="Escribe cualquier historia nueva aquí (aunque sea corta). Cada historia genera automáticamente nuevos escenarios 3D, colores, personajes y movimientos de cámara..."></textarea>

        <div class="grid-3" style="margin-top:10px;">
          <label>
            Resolución
            <select id="resolutionSelect">
              <option value="720x1280" selected>720×1280 (Rápido)</option>
              <option value="1080x1920">1080×1920 (Full HD)</option>
            </select>
          </label>
          <label>
            FPS
            <select id="fpsSelect">
              <option value="30" selected>30 FPS</option>
              <option value="60">60 FPS</option>
            </select>
          </label>
          <label>
            Subtítulos
            <select id="subtitleModeSelect">
              <option value="on" selected>Activados al ritmo</option>
              <option value="off">Solo rótulo superior</option>
            </select>
          </label>
        </div>

        <div class="toggles-grid">
          <label class="checkbox-label">
            <input type="checkbox" id="musicToggle" checked />
            Música cinematográfica
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="sfxToggle" checked />
            Efectos de sonido (SFX)
          </label>
        </div>

        <div class="actions-row">
          <button id="buildShortBtn" type="button" class="btn-primary" style="flex:1">⚡ Crear Short 3D desde mi Historia</button>
          <button id="remixVisualsBtn" type="button" class="btn-secondary" title="Cambia semilla visual si quieres otra estética">🎲 Variar Visuales</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>2. Escenas Generadas Automáticamente (<span id="sceneCount">0</span>)</h2>
        </div>
        <div id="scenesSummary" class="scenes-summary"></div>
      </div>
    </section>

    <!-- PANEL DERECHO -->
    <section class="panel preview-panel">
      <div class="card preview-card">
        <div class="phone-frame">
          <canvas id="previewCanvas" width="540" height="960"></canvas>
        </div>

        <div class="player-controls">
          <button id="playPauseBtn" type="button" class="btn-primary">▶ Reproducir Preview</button>
          <button id="restartBtn" type="button" class="btn-secondary">⟲ Reiniciar</button>
          <span id="timeDisplay" class="time-display">00.0s / 00.0s</span>
        </div>

        <input type="range" id="timelineScrubber" min="0" max="100" step="0.01" value="0" class="scrubber" />
        <p id="statusBanner" class="status-banner">Listo.</p>

        <hr class="divider" />

        <button id="exportMp4Btn" type="button" class="btn-export">🎬 Exportar Short en MP4 (9:16)</button>

        <div id="exportProgressWrap" class="progress-wrap hidden">
          <div class="progress-track">
            <div id="exportProgressBar" class="progress-fill"></div>
          </div>
          <p id="exportProgressText">Preparando...</p>
        </div>

        <div id="exportResultWrap" class="export-result hidden">
          <h3>¡Short MP4 listo!</h3>
          <video id="exportedVideoPreview" controls playsinline></video>
          <a id="downloadMp4Link" class="btn-primary download-btn" download="short-25d.mp4">⬇ Descargar MP4</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    // =========================================================================
    // 0. CARGADOR NO BLOQUEANTE DE MP4-MUXER
    // =========================================================================
    function loadScriptAsync(url) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url; s.async = true;
        s.onload = () => resolve(true);
        s.onerror = () => reject(new Error('No se pudo cargar ' + url));
        document.head.appendChild(s);
      });
    }

    async function ensureMp4MuxerLoaded() {
      if (typeof window.Mp4Muxer !== 'undefined') return true;
      for (const url of [
        'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js',
        'https://unpkg.com/mp4-muxer@5.2.2/build/mp4-muxer.js'
      ]) {
        try {
          await Promise.race([loadScriptAsync(url), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);
          if (typeof window.Mp4Muxer !== 'undefined') return true;
        } catch (_) {}
      }
      return false;
    }

    // =========================================================================
    // 1. AUDIO: SOLO MÚSICA + SFX DINÁMICOS (SIN VOZ)
    // =========================================================================
    window.AudioEngine = (() => {
      const SR = 48000;
      let liveCtx = null;

      function ensureLiveContext() {
        if (!liveCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          try { liveCtx = new AC({ sampleRate: SR }); } catch (_) { liveCtx = new AC(); }
        }
        if (liveCtx.state === 'suspended') liveCtx.resume();
        return liveCtx;
      }

      async function renderAudioMix({ scenes, totalDuration, enableMusic, enableSFX, seedVal }) {
        const N = Math.ceil(totalDuration * SR);
        const buf = new AudioBuffer({ numberOfChannels: 2, length: N, sampleRate: SR });
        const music = new Float64Array(N);
        const sfx = new Float64Array(N);

        let seed = (seedVal || 42) >>> 0;
        const rand = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return (seed / 4294967296) * 2 - 1;
        };

        if (enableMusic) {
          const rootPool = [55, 65.41, 49, 73.42];
          const root = rootPool[seedVal % rootPool.length];
          const chords = [
            [root, root * 1.5, root * 2],
            [root * 0.89, root * 1.33, root * 1.78],
            [root * 0.84, root * 1.26, root * 1.68],
            [root * 0.75, root * 1.12, root * 1.5]
          ];
          const segDur = totalDuration / chords.length;
          chords.forEach((notes, cIdx) => {
            const i0 = Math.floor(cIdx * segDur * SR);
            const i1 = Math.min(N, Math.floor((cIdx + 1) * segDur * SR));
            for (let i = i0; i < i1; i++) {
              const tt = (i - i0) / SR;
              const env = Math.min(1, tt / 1.2) * Math.min(1, (segDur - tt) / 1.0);
              let v = 0;
              notes.forEach((f, j) => {
                v += 0.045 * env * Math.sin(2 * Math.PI * f * tt + j * 0.4);
                v += 0.014 * env * Math.sin(2 * Math.PI * f * 2.01 * tt);
              });
              music[i] += v;
            }
          });

          // Pulso rítmico
          for (let beat = 0; beat < totalDuration; beat += 0.5) {
            const idx = Math.floor(beat * SR);
            const ln = Math.min(Math.floor(0.24 * SR), N - idx);
            for (let q = 0; q < ln; q++) {
              const qt = q / SR;
              music[idx + q] += 0.08 * Math.sin(2 * Math.PI * (beat % 1 === 0 ? 64 : 92) * qt) * Math.exp(-qt * 18);
            }
          }

          // Notas melódicas espaciadas
          const scale = [1, 1.189, 1.335, 1.498, 1.782, 2.0];
          for (let k = 0; k < Math.floor(totalDuration / 1.8); k++) {
            const sec = k * 1.8 + 0.35;
            const idx = Math.floor(sec * SR);
            const ln = Math.min(Math.floor(1.3 * SR), N - idx);
            const f = root * 4 * scale[(k * 3 + seedVal) % scale.length];
            for (let q = 0; q < ln; q++) {
              const qt = q / SR;
              music[idx + q] += 0.045 * Math.sin(2 * Math.PI * f * qt) * Math.exp(-qt * 3.0);
            }
          }
        }

        if (enableSFX) {
          const addBand = (sec, dur, amp, lo, hi) => {
            const idx = Math.floor(sec * SR);
            const ln = Math.min(Math.floor(dur * SR), N - idx);
            if (ln <= 0) return;
            let lp = 0, hp = 0, prev = 0;
            const aLP = Math.min(0.95, (2 * Math.PI * hi) / (SR + 2 * Math.PI * hi));
            const aHP = SR / (SR + 2 * Math.PI * lo);
            for (let q = 0; q < ln; q++) {
              const qt = q / SR;
              lp += aLP * (rand() - lp);
              hp = aHP * (hp + lp - prev);
              prev = lp;
              sfx[idx + q] += amp * hp * Math.exp(-qt * 3.8) * Math.min(1, qt * 12);
            }
          };

          scenes.forEach((sc, idx) => {
            if (idx > 0) addBand(sc.startTime, 0.35, 0.14, 240, 2600); // Whoosh de cámara en corte
            if (sc.camType === 'impact_shake' || sc.hazard === 'explosion' || sc.hazard === 'flood') {
              addBand(sc.startTime + 0.12, 1.6, 0.34, 55, 850);
            } else if (sc.camType === 'orbit_hero') {
              // Tono cristalino de revelación
              const pIdx = Math.floor((sc.startTime + 0.25) * SR);
              const ln = Math.min(Math.floor(0.65 * SR), N - pIdx);
              for (let q = 0; q < ln; q++) {
                const qt = q / SR;
                sfx[pIdx + q] += 0.11 * Math.sin(2 * Math.PI * 784 * qt) * Math.exp(-qt * 6);
              }
            } else {
              addBand(sc.startTime + 0.15, 0.25, 0.08, 400, 1800);
            }
          });
        }

        const L = buf.getChannelData(0);
        const R = buf.getChannelData(1);
        const norm = Math.tanh(1.1);
        for (let i = 0; i < N; i++) {
          const comp = Math.tanh((music[i] + sfx[i]) * 1.35) / norm;
          L[i] = Math.max(-0.92, Math.min(0.92, comp + 0.02 * music[i]));
          R[i] = Math.max(-0.92, Math.min(0.92, comp - 0.02 * music[i]));
        }
        return buf;
      }

      return { SR, ensureLiveContext, renderAudioMix };
    })();

    // =========================================================================
    // 2. DIRECTOR PROCEDURAL DE HISTORIAS (CERO REPETICIONES, 10 BIOMAS 3D)
    // =========================================================================
    window.StoryBrain = (() => {
      const PRESETS = {
        boston:
`En 1919, un depósito gigantesco en Boston guardaba dos millones de galones de melaza.
El quince de enero, el acero empezó a crujir y los remaches saltaron por los aires.
Una ola marrón avanzó por toda la ciudad a cincuenta y seis kilómetros por hora.
Los edificios quedaron rodeados y los rescatistas tuvieron que usar agua de mar.`,

        hacker:
`Un joven hacker prometió que podía vaciar un banco usando solo una tostadora modificada.
Durante semanas estudió los cables subterráneos y las cámaras acorazadas del edificio.
Una noche conectó su aparato a la red eléctrica y todas las alarmas de la ciudad saltaron.
En lugar de robar oro, dejó sin electricidad al barrio entero durante tres horas.`,

        espacio:
`En plena misión orbital, la cápsula espacial sufrió un fallo en sus propulsores principales.
La estación espacial quedaba cada vez más lejos mientras el oxígeno bajaba rápido.
El astronauta improvisó un cálculo de gravedad usando solo una linterna y un cronómetro.
Logró encender los motores de reserva justo a tiempo y regresar a la Tierra.`,

        torre_eiffel:
`En 1925, un estafador en París falsificó documentos oficiales del gobierno francés.
Reunió en secreto a cinco empresarios millonarios bajo la gran Torre Eiffel.
Les aseguró que la ciudad quería vender la torre entera como chatarra al mejor postor.
Uno le pagó una maleta llena de billetes y meses después intentó venderla otra vez.`,

        pepsi:
`En 1989, la Unión Soviética quería comprar Pepsi pero su moneda no valía fuera del país.
Sus generales propusieron el intercambio más absurdo en mitad del océano.
Pagaron a la empresa con diecisiete submarinos, un crucero y un destructor reales.
Durante unos días, una marca de refrescos tuvo una de las mayores flotas del planeta.`,

        faraon:
`Un grupo de exploradores encontró una puerta oculta bajo las arenas de una pirámide.
Al cruzar el túnel iluminado con antorchas descubrieron mecanismos de piedra intactos.
Una trampa antigua hizo temblar todo el templo mientras las columnas empezaban a caer.
Consiguieron escapar justo antes de que la cámara secreta se sellara para siempre.`
      };

      const BIOMES = [
        'modern_city',      // Rascacielos modernos, neones, coches/carretera
        'cyber_lab',        // Laboratorio futurista, servidores, núcleos brillantes
        'outer_space',      // Espacio profundo, planetas, asteroides, cohete/estación
        'bank_heist',       // Banco, columnas, cajas fuertes, lingotes de oro
        'ocean_naval',      // Océano con olas 3D, submarino, barcos
        'industrial_flood', // Ciudad ladrillo 1919, depósito industrial, ola densa
        'desert_pyramid',   // Desierto dorado, pirámides, obeliscos, esfinge
        'forest_night',     // Bosque nocturno con pinos 3D, luna llena, hoguera
        'medieval_fortress',// Castillo con torres almenadas, murallas, estandartes
        'paris_avenue'      // Bulevar europeo con Torre Eiffel 3D y farolas
      ];

      const ROLES_BY_BIOME = {
        modern_city: ['casual', 'exec', 'hacker'],
        cyber_lab: ['scientist', 'hacker', 'exec'],
        outer_space: ['astronaut', 'scientist'],
        bank_heist: ['exec', 'hacker', 'casual'],
        ocean_naval: ['explorer', 'exec'],
        industrial_flood: ['worker', 'casual'],
        desert_pyramid: ['explorer', 'monarch'],
        forest_night: ['explorer', 'casual'],
        medieval_fortress: ['knight', 'monarch'],
        paris_avenue: ['exec', 'casual']
      };

      function hashString(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function detectBiome(fullText, seed) {
        const l = fullText.toLowerCase();
        if (/espacio|órbita|astronauta|cohete|planeta|galaxia|luna|estrella|marte/.test(l)) return 'outer_space';
        if (/hacker|tostadora|código|laboratorio|ciencia|robot|ia|servidor|experimento|láser/.test(l)) return 'cyber_lab';
        if (/banco|bóveda|oro|dinero|estafador|millon|alarma|ladrón|atraco/.test(l)) return 'bank_heist';
        if (/submarino|océano|mar|barco|flota|pepsi|pirata|isla|tiburón/.test(l)) return 'ocean_naval';
        if (/melaza|depósito|tanque|boston|remaches|fábrica|inund/.test(l)) return 'industrial_flood';
        if (/pirámide|faraón|arena|desierto|egipto|templo|momia/.test(l)) return 'desert_pyramid';
        if (/torre eiffel|parís|francia|bulevar/.test(l)) return 'paris_avenue';
        if (/castillo|rey|caballero|espada|dragón|medieval|troya|imperio/.test(l)) return 'medieval_fortress';
        if (/bosque|hoguera|campamento|árbol|lobo|montaña|noche/.test(l)) return 'forest_night';
        if (/ciudad|calle|coche|policía|edificio|carrera/.test(l)) return 'modern_city';
        // Si no hay palabras clave reconocibles, elegir un bioma completamente distinto según el hash del texto
        return BIOMES[seed % BIOMES.length];
      }

      function detectHazardAndProps(text, biome) {
        const l = text.toLowerCase();
        let hazard = 'none';
        if (/ola|inund|melaza|agua|mar/.test(l)) hazard = 'flood';
        else if (/explot|saltaron|tembl|caer|trampa|fuego|alarma|destru|accidente|fallo/.test(l)) hazard = 'explosion';
        else if (/oro|dinero|billetes|millon/.test(l)) hazard = 'gold_rain';
        else if (/nieve|frío|noche|bosque/.test(l)) hazard = 'particles';

        let prop = 'monolith';
        if (/tanque|depósito|acero|remaches/.test(l)) prop = 'tank';
        else if (/cohete|cápsula|nave|propulsor|estación/.test(l)) prop = 'rocket';
        else if (/submarino|barco|flota/.test(l)) prop = 'submarine';
        else if (/torre eiffel|torre/.test(l)) prop = 'eiffel';
        else if (/pirámide|templo/.test(l)) prop = 'pyramid';
        else if (/bóveda|banco|oro|caja/.test(l)) prop = 'vault';
        else if (/tostadora|servidor|máquina|aparato|robot/.test(l)) prop = 'machine';
        else if (biome === 'outer_space') prop = 'rocket';
        else if (biome === 'ocean_naval') prop = 'submarine';
        else if (biome === 'desert_pyramid') prop = 'pyramid';
        else if (biome === 'paris_avenue') prop = 'eiffel';
        else if (biome === 'bank_heist') prop = 'vault';
        else if (biome === 'cyber_lab') prop = 'machine';
        else if (biome === 'industrial_flood') prop = 'tank';

        return { hazard, prop };
      }

      function buildWords(text, duration) {
        const list = text.trim().split(/\s+/).filter(Boolean);
        if (!list.length) return [];
        const usable = Math.max(0.8, duration - 0.25);
        const w = list.map((x) => Math.max(2, x.length) + (/[,.;:!?]$/.test(x) ? 2 : 0));
        const tot = w.reduce((a, b) => a + b, 0);
        let cur = 0.12;
        return list.map((word, i) => {
          const d = (w[i] / tot) * usable;
          const obj = { word, start: cur, end: cur + d };
          cur += d;
          return obj;
        });
      }

      function makeHeadline(text, idx, total) {
        const num = text.match(/\b(1[0-9]{3}|20[0-2][0-9]|\d+(?:[.,]\d+)?\s?(?:millones|mil|km\/h|horas|días|%))\b/i);
        if (num) return num[1].toUpperCase();
        if (idx === 0) return 'EL INICIO';
        if (idx === total - 1) return 'EL FINAL';
        const clean = text.replace(/[¿?¡!.,;:]/g, '').split(/\s+/).filter((w) => w.length > 3);
        return clean.slice(0, 2).join(' ').toUpperCase() || `ESCENA ${idx + 1}`;
      }

      function compileStory(rawText, extraSeed = 0) {
        const trimmed = rawText.trim();
        if (!trimmed) return { scenes: [], storySeed: 1 };
        const storySeed = (hashString(trimmed) + extraSeed * 7919) >>> 0;

        let blocks = trimmed.split(/\n+/).map((b) => b.trim()).filter(Boolean);
        if (blocks.length === 1) {
          const sents = trimmed.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [trimmed];
          blocks = sents.map((s) => s.trim()).filter(Boolean);
        }
        // Si el usuario escribe solo 1 línea corta (ej: una palabra o idea), la dividimos en 3 actos dinámicos para que haya movimiento y variedad
        if (blocks.length === 1) {
          const t = blocks[0];
          blocks = [
            t,
            'De pronto algo inesperado cambió todo el escenario.',
            'Y el desenlace sorprendió a todos.'
          ];
        }

        const primaryBiome = detectBiome(trimmed, storySeed);
        // Secuencia de cámaras obligatoriamente distintas entre escenas consecutivas
        const camSequence = ['dolly_flyin', 'orbit_hero', 'whip_pan_chase', 'impact_shake', 'crane_up_reveal', 'orbit_reverse'];

        const scenes = blocks.map((text, idx) => {
          const scSeed = (storySeed + idx * 104729) >>> 0;
          // Cada escena puede variar o evolucionar de bioma si el texto cambia o en el clímax
          let biome = idx === 0 ? primaryBiome : detectBiome(text, scSeed);
          if (idx > 0 && biome === primaryBiome && idx % 2 === 1 && blocks.length >= 3) {
            // Variar ligeramente entre exterior e interior/detalle manteniendo coherencia
            biome = primaryBiome;
          }

          const roles = ROLES_BY_BIOME[biome] || ['casual', 'exec'];
          const role = roles[scSeed % roles.length];
          const emotions = ['smug', 'shocked', 'thinking', 'angry', 'laughing'];
          let emotion = emotions[scSeed % emotions.length];
          if (/peligro|alarma|atrapad|saltaron|tembl|huir|shock/.test(text.toLowerCase())) emotion = 'shocked';
          else if (/ri|burl|celebr|victoria/.test(text.toLowerCase())) emotion = 'laughing';
          else if (/guerra|enfad|luch|robo/.test(text.toLowerCase())) emotion = 'angry';

          const { hazard, prop } = detectHazardAndProps(text, biome);
          let camType = camSequence[idx % camSequence.length];
          if (hazard === 'explosion' || hazard === 'flood') camType = 'impact_shake';

          const wordsCnt = text.split(/\s+/).length;
          const duration = Math.max(3.2, Math.min(6.5, wordsCnt * 0.28 + 1.6));

          return {
            id: idx + 1,
            text,
            title: makeHeadline(text, idx, blocks.length),
            biome,
            camType,
            role,
            emotion,
            hazard,
            prop,
            seed: scSeed,
            duration,
            words: buildWords(text, duration)
          };
        });

        return { scenes, storySeed };
      }

      return { PRESETS, compileStory };
    })();

    // =========================================================================
    // 3. MOTOR 3D REAL POR PROYECCIÓN PERSPECTIVA (Cámara libre + Z-Sort)
    // =========================================================================
    window.Engine3D = (() => {
      const BIOME_PALETTES = {
        modern_city: { skyA: '#1a2a6c', skyB: '#fdbb2d', groundA: '#334155', groundB: '#1e293b', road: '#0f172a', bldgA: '#64748b', bldgB: '#475569', sun: '#fde047' },
        cyber_lab: { skyA: '#090d16', skyB: '#312e81', groundA: '#1e1b4b', groundB: '#0f172a', road: '#312e81', bldgA: '#1e293b', bldgB: '#0f172a', sun: '#22d3ee' },
        outer_space: { skyA: '#020617', skyB: '#1e1b4b', groundA: '#334155', groundB: '#0f172a', road: '#475569', bldgA: '#475569', bldgB: '#334155', sun: '#f43f5e' },
        bank_heist: { skyA: '#0f172a', skyB: '#475569', groundA: '#78350f', groundB: '#451a03', road: '#991b1b', bldgA: '#cbd5e1', bldgB: '#94a3b8', sun: '#facc15' },
        ocean_naval: { skyA: '#0369a1', skyB: '#bae6fd', groundA: '#0284c7', groundB: '#0369a1', road: '#0ea5e9', bldgA: '#475569', bldgB: '#334155', sun: '#fef08a' },
        industrial_flood: { skyA: '#24354c', skyB: '#b48c65', groundA: '#4a4d4e', groundB: '#2d3136', road: '#383b40', bldgA: '#9d674a', bldgB: '#8b6f5a', sun: '#dca669' },
        desert_pyramid: { skyA: '#9a3412', skyB: '#fde047', groundA: '#eab308', groundB: '#ca8a04', road: '#a16207', bldgA: '#f59e0b', bldgB: '#d97706', sun: '#ffffff' },
        forest_night: { skyA: '#050816', skyB: '#1e3a8a', groundA: '#14532d', groundB: '#052e16', road: '#78350f', bldgA: '#166534', bldgB: '#14532d', sun: '#fef9c3' },
        medieval_fortress: { skyA: '#312e81', skyB: '#c084fc', groundA: '#57534e', groundB: '#292524', road: '#7f1d1d', bldgA: '#94a3b8', bldgB: '#64748b', sun: '#fde047' },
        paris_avenue: { skyA: '#1e3a8a', skyB: '#fbcfe8', groundA: '#475569', groundB: '#334155', road: '#1e293b', bldgA: '#e2e8f0', bldgB: '#cbd5e1', sun: '#fef08a' }
      };

      function rRect(ctx, x, y, w, h, r) {
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
        else { ctx.beginPath(); ctx.rect(x, y, w, h); }
      }

      // Proyección matemática 3D real (yaw, pitch, roll, fov)
      function project3D(wx, wy, wz, cam) {
        const dx = wx - cam.x;
        const dy = wy - cam.y;
        const dz = wz - cam.z;

        const cosY = Math.cos(-cam.yaw), sinY = Math.sin(-cam.yaw);
        const rx = dx * cosY - dz * sinY;
        const rz = dx * sinY + dz * cosY;

        const cosP = Math.cos(-cam.pitch), sinP = Math.sin(-cam.pitch);
        const ry = dy * cosP - rz * sinP;
        const tz = dy * sinP + rz * cosP;

        if (tz < 0.5) return null;

        let sx = (rx / tz) * cam.fov;
        let sy = -(ry / tz) * cam.fov;

        if (cam.roll) {
          const cR = Math.cos(cam.roll), sR = Math.sin(cam.roll);
          const nx = sx * cR - sy * sR;
          const ny = sx * sR + sy * cR;
          sx = nx; sy = ny;
        }

        return { x: 270 + sx, y: 480 + sy, z: tz };
      }

      function quadSignedArea(p0, p1, p2) {
        return (p1.x - p0.x) * (p2.y - p0.y) - (p1.y - p0.y) * (p2.x - p0.x);
      }

      function pushFace(queue, pts3D, cam, fill, stroke = '#181a24', lineWidth = 1.5, skipCull = false) {
        const p = pts3D.map((v) => project3D(v[0], v[1], v[2], cam));
        if (p.some((v) => !v)) return;
        if (!skipCull && quadSignedArea(p[0], p[1], p[2]) <= 0) return;
        const zAvg = p.reduce((a, b) => a + b.z, 0) / p.length;
        queue.push({ kind: 'poly', z: zAvg, pts: p, fill, stroke, lineWidth });
      }

      // Caja 3D extruida real con 5-6 caras + ventanas proyectadas en 3D
      function addBox3D(queue, cam, x, y, z, w, h, d, cTop, cFront, cSide, addWindows = false) {
        const hw = w / 2, hd = d / 2;
        const x0 = x - hw, x1 = x + hw;
        const y0 = y, y1 = y + h;
        const z0 = z - hd, z1 = z + hd;

        // Frente (-Z), Atrás (+Z), Arriba (+Y), Izquierda (-X), Derecha (+X)
        pushFace(queue, [[x0, y1, z0], [x1, y1, z0], [x1, y0, z0], [x0, y0, z0]], cam, cFront);
        pushFace(queue, [[x1, y1, z1], [x0, y1, z1], [x0, y0, z1], [x1, y0, z1]], cam, cFront);
        pushFace(queue, [[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]], cam, cTop);
        pushFace(queue, [[x0, y1, z1], [x0, y1, z0], [x0, y0, z0], [x0, y0, z1]], cam, cSide);
        pushFace(queue, [[x1, y1, z0], [x1, y1, z1], [x1, y0, z1], [x1, y0, z0]], cam, cSide);

        if (addWindows && h >= 4) {
          const rows = Math.min(5, Math.floor(h / 2));
          for (let r = 0; r < rows; r++) {
            const wy0 = y + 1.0 + r * 1.8;
            const wy1 = wy0 + 0.9;
            // Ventanas en cara frontal (-Z) y lateral interna
            const winCol = r % 2 === 0 ? '#fde047' : '#38bdf8';
            pushFace(queue, [[x - hw * 0.6, wy1, z0 - 0.02], [x - hw * 0.15, wy1, z0 - 0.02], [x - hw * 0.15, wy0, z0 - 0.02], [x - hw * 0.6, wy0, z0 - 0.02]], cam, winCol, '#1e293b', 1);
            pushFace(queue, [[x + hw * 0.15, wy1, z0 - 0.02], [x + hw * 0.6, wy1, z0 - 0.02], [x + hw * 0.6, wy0, z0 - 0.02], [x + hw * 0.15, wy0, z0 - 0.02]], cam, winCol, '#1e293b', 1);
            if (x < 0) {
              pushFace(queue, [[x1 + 0.02, wy1, z - hd * 0.45], [x1 + 0.02, wy1, z + hd * 0.45], [x1 + 0.02, wy0, z + hd * 0.45], [x1 + 0.02, wy0, z - hd * 0.45]], cam, winCol, '#1e293b', 1);
            } else if (x > 0) {
              pushFace(queue, [[x0 - 0.02, wy1, z + hd * 0.45], [x0 - 0.02, wy1, z - hd * 0.45], [x0 - 0.02, wy0, z - hd * 0.45], [x0 - 0.02, wy0, z + hd * 0.45]], cam, winCol, '#1e293b', 1);
            }
          }
        }
      }

      // Cilindro / prisma 3D de 10 caras
      function addCylinder3D(queue, cam, cx, y, cz, r, h, cSideA, cSideB, cTop) {
        const segs = 10;
        for (let i = 0; i < segs; i++) {
          const a0 = (i / segs) * Math.PI * 2;
          const a1 = ((i + 1) / segs) * Math.PI * 2;
          const x0 = cx + Math.cos(a0) * r, z0 = cz + Math.sin(a0) * r;
          const x1 = cx + Math.cos(a1) * r, z1 = cz + Math.sin(a1) * r;
          const col = i % 2 === 0 ? cSideA : cSideB;
          pushFace(queue, [[x0, y + h, z0], [x1, y + h, z1], [x1, y, z1], [x0, y, z0]], cam, col, '#181a24', 1);
          pushFace(queue, [[cx, y + h, cz], [x1, y + h, z1], [x0, y + h, z0]], cam, cTop, '#181a24', 1);
        }
      }

      // Pirámide / Cono 3D
      function addPyramid3D(queue, cam, cx, y, cz, r, h, cFront, cSide) {
        const top = [cx, y + h, cz];
        const b0 = [cx - r, y, cz - r], b1 = [cx + r, y, cz - r], b2 = [cx + r, y, cz + r], b3 = [cx - r, y, cz + r];
        pushFace(queue, [top, b1, b0], cam, cFront);
        pushFace(queue, [top, b2, b1], cam, cSide);
        pushFace(queue, [top, b3, b2], cam, cFront);
        pushFace(queue, [top, b0, b3], cam, cSide);
      }

      // Personaje 2D cel-shaded insertado en el mundo 3D con escala y profundidad reales
      function addCharacter3D(queue, cam, cfg) {
        const pFoot = project3D(cfg.x, cfg.y, cfg.z, cam);
        const pHead = project3D(cfg.x, cfg.y + 3.0, cfg.z, cam);
        if (!pFoot || !pHead) return;
        const pxHeight = Math.abs(pFoot.y - pHead.y);
        queue.push({ kind: 'char', z: pFoot.z, sx: pFoot.x, sy: pFoot.y, scale: pxHeight / 230, cfg });
      }

      function draw2DCharacter(ctx, sx, sy, scale, cfg, t) {
        const { role = 'casual', emotion = 'smug' } = cfg;
        const bounce = emotion === 'laughing' ? Math.abs(Math.sin(t * 20)) * 10 : Math.sin(t * 4) * 2;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.scale(scale, scale);

        ctx.fillStyle = 'rgba(0,0,0,0.38)';
        ctx.beginPath(); ctx.ellipse(0, 4, 52, 12, 0, 0, Math.PI * 2); ctx.fill();

        ctx.translate(0, -bounce);

        const coats = {
          casual: '#3b82f6', exec: '#1e293b', scientist: '#f8fafc', astronaut: '#e2e8f0',
          hacker: '#312e81', worker: '#92400e', explorer: '#b45309', knight: '#64748b', monarch: '#581c87'
        };
        const coat = coats[role] || '#3b82f6';

        // Piernas y botas
        ctx.strokeStyle = '#181a24'; ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-14, -46); ctx.lineTo(-16, 0); ctx.moveTo(14, -46); ctx.lineTo(16, 0); ctx.stroke();

        // Torso
        ctx.fillStyle = coat; ctx.lineWidth = 5;
        rRect(ctx, -32, -125, 64, 82, 20); ctx.fill(); ctx.stroke();

        if (role === 'exec') {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath(); ctx.moveTo(-6, -120); ctx.lineTo(6, -120); ctx.lineTo(0, -76); ctx.closePath(); ctx.fill();
        } else if (role === 'scientist') {
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, -120); ctx.lineTo(0, -45); ctx.stroke();
        }

        // Brazos
        const wave = Math.sin(t * 5) * 8;
        ctx.strokeStyle = '#181a24'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(-32, -108); ctx.quadraticCurveTo(-56, -80 + wave, -44, -55); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(32, -108); ctx.quadraticCurveTo(58, -88 - wave, 52, -112 - wave); ctx.stroke();

        // Cabeza cel-shaded
        ctx.save();
        ctx.translate(0, -172);
        const hg = ctx.createRadialGradient(-16, -18, 8, 0, 0, 54);
        hg.addColorStop(0, '#ffffff'); hg.addColorStop(0.75, '#fbf5ee'); hg.addColorStop(1, '#d6cbc0');
        ctx.fillStyle = hg; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Cascos / Gafas / Pelo según profesión (NO siempre el moño chino!)
        if (role === 'astronaut') {
          ctx.strokeStyle = '#38bdf8'; ctx.fillStyle = 'rgba(56, 189, 248, 0.28)'; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else if (role === 'hacker') {
          ctx.fillStyle = '#22d3ee'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 4;
          rRect(ctx, -36, -14, 72, 18, 6); ctx.fill(); ctx.stroke();
        } else if (role === 'monarch') {
          ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#181a24'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(-32, -40); ctx.lineTo(-36, -70); ctx.lineTo(-14, -52); ctx.lineTo(0, -76); ctx.lineTo(14, -52); ctx.lineTo(36, -70); ctx.lineTo(32, -40); ctx.closePath(); ctx.fill(); ctx.stroke();
        } else if (role === 'worker' || role === 'knight') {
          ctx.fillStyle = role === 'worker' ? '#facc15' : '#94a3b8';
          ctx.beginPath(); ctx.arc(0, -10, 52, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
        } else {
          // Cabello moderno cartoon
          ctx.fillStyle = '#27272a';
          ctx.beginPath(); ctx.arc(0, -16, 48, Math.PI * 1.05, Math.PI * 1.95); ctx.quadraticCurveTo(0, -32, -46, -16); ctx.fill();
        }

        // Ojos y boca
        if (role !== 'hacker') {
          ctx.fillStyle = '#181a24'; ctx.strokeStyle = '#181a24'; ctx.lineWidth = 3.5;
          if (emotion === 'laughing') {
            ctx.beginPath(); ctx.arc(-16, -4, 9, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
            ctx.beginPath(); ctx.arc(16, -4, 9, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
          } else {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-16, -4, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(16, -4, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#181a24';
            ctx.beginPath(); ctx.arc(-15, -4, emotion === 'shocked' ? 3 : 4.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(17, -4, emotion === 'shocked' ? 3 : 4.5, 0, Math.PI * 2); ctx.fill();
          }
        }
        ctx.strokeStyle = '#181a24'; ctx.lineWidth = 4;
        if (emotion === 'shocked') {
          ctx.fillStyle = '#7f1d1d'; ctx.beginPath(); ctx.ellipse(0, 22, 9, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(0, 16, 12, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
        }

        ctx.restore();
        ctx.restore();
      }

      // Construcción del mundo 3D específico para cada bioma y escena
      function buildWorld3D(scene, t, sceneTime, cam) {
        const pal = BIOME_PALETTES[scene.biome] || BIOME_PALETTES.modern_city;
        const queue = [];

        // 1. Suelo 3D en cuadrícula / carretera real
        for (let iz = -2; iz < 14; iz++) {
          const z0 = iz * 4 - 4;
          const z1 = z0 + 4;
          const gCol = iz % 2 === 0 ? pal.groundA : pal.groundB;
          pushFace(queue, [[-26, 0, z1], [-4.5, 0, z1], [-4.5, 0, z0], [-26, 0, z0]], cam, gCol, pal.groundB, 0.5, true);
          pushFace(queue, [[4.5, 0, z1], [26, 0, z1], [26, 0, z0], [4.5, 0, z0]], cam, gCol, pal.groundB, 0.5, true);
          pushFace(queue, [[-4.5, 0.01, z1], [4.5, 0.01, z1], [4.5, 0.01, z0], [-4.5, 0.01, z0]], cam, pal.road, '#0f172a', 0.5, true);
          if (iz % 2 === 0) {
            pushFace(queue, [[-0.25, 0.03, z1 - 0.8], [0.25, 0.03, z1 - 0.8], [0.25, 0.03, z0 + 0.8], [-0.25, 0.03, z0 + 0.8]], cam, '#fde047', '#fde047', 0.5, true);
          }
        }

        // 2. Arquitectura 3D flanqueando la avenida según bioma
        const hasBuildings = !['outer_space', 'ocean_naval', 'desert_pyramid', 'forest_night'].includes(scene.biome);
        if (hasBuildings) {
          for (let i = 0; i < 6; i++) {
            const zPos = i * 8 + 2;
            const hL = 6 + ((scene.seed + i * 3) % 9);
            const hR = 7 + ((scene.seed + i * 5) % 9);
            addBox3D(queue, cam, -9.5, 0, zPos, 5.5, hL, 5.5, pal.sun, pal.bldgA, pal.bldgB, true);
            addBox3D(queue, cam, 9.5, 0, zPos, 5.5, hR, 5.5, pal.sun, pal.bldgA, pal.bldgB, true);
          }
        } else if (scene.biome === 'forest_night') {
          for (let i = 0; i < 7; i++) {
            const zPos = i * 7 + 1;
            [-8, 8].forEach((tx, side) => {
              addCylinder3D(queue, cam, tx + (i % 2) * side, 0, zPos, 0.5, 2.5, '#78350f', '#451a03', '#78350f');
              addPyramid3D(queue, cam, tx + (i % 2) * side, 2.2, zPos, 2.2, 5.5, '#15803d', '#166534');
            });
          }
        } else if (scene.biome === 'desert_pyramid') {
          addPyramid3D(queue, cam, -10, 0, 22, 6, 10, '#f59e0b', '#b45309');
          addPyramid3D(queue, cam, 11, 0, 28, 8, 13, '#fbbf24', '#d97706');
          addBox3D(queue, cam, -5.5, 0, 6, 1.4, 5.5, 1.4, '#fde047', '#d97706', '#92400e', false);
          addBox3D(queue, cam, 5.5, 0, 6, 1.4, 5.5, 1.4, '#fde047', '#d97706', '#92400e', false);
        } else if (scene.biome === 'outer_space') {
          // Asteroides flotantes en 3D
          for (let i = 0; i < 6; i++) {
            const ax = (i % 2 === 0 ? -7 : 7) + Math.sin(t + i) * 1.2;
            const ay = 2 + (i % 3) * 2.5 + Math.cos(t * 1.5 + i) * 0.5;
            addBox3D(queue, cam, ax, ay, i * 6 + 4, 1.6, 1.6, 1.6, '#94a3b8', '#64748b', '#475569', false);
          }
        }

        // 3. Objeto protagonista 3D en el centro/fondo
        if (scene.prop === 'tank') {
          addCylinder3D(queue, cam, 2.2, 0, 9, 2.6, 7.5, '#94a3b8', '#64748b', '#cbd5e1');
        } else if (scene.prop === 'rocket') {
          const lift = scene.hazard === 'explosion' ? Math.min(6, sceneTime * 1.8) : 0;
          addCylinder3D(queue, cam, 2.4, 0.5 + lift, 10, 1.4, 6.5, '#f8fafc', '#cbd5e1', '#ef4444');
          addPyramid3D(queue, cam, 2.4, 7.0 + lift, 10, 1.4, 2.8, '#ef4444', '#b91c1c');
        } else if (scene.prop === 'eiffel') {
          addPyramid3D(queue, cam, 0, 0, 22, 4.5, 16, '#94a3b8', '#475569');
        } else if (scene.prop === 'vault') {
          addBox3D(queue, cam, 2.6, 0, 9, 4.2, 4.5, 3.2, '#cbd5e1', '#94a3b8', '#475569', false);
          addCylinder3D(queue, cam, 2.6, 1.2, 7.3, 1.3, 0.3, '#facc15', '#eab308', '#fef08a');
        } else if (scene.prop === 'machine') {
          addBox3D(queue, cam, 2.4, 0, 8, 2.4, 3.6, 2.2, '#22d3ee', '#1e293b', '#0f172a', false);
        } else if (scene.prop === 'submarine') {
          addBox3D(queue, cam, 2.0, 0.4 + Math.sin(t * 2) * 0.3, 11, 6.5, 1.8, 2.2, '#475569', '#334155', '#1e293b', false);
          addBox3D(queue, cam, 2.0, 2.2 + Math.sin(t * 2) * 0.3, 11, 1.8, 1.3, 1.2, '#ef4444', '#475569', '#334155', false);
        } else if (scene.prop === 'pyramid') {
          addPyramid3D(queue, cam, 2.5, 0, 14, 4.8, 7.5, '#f59e0b', '#b45309');
        } else {
          addBox3D(queue, cam, 2.6, 0, 9, 2.2, 4.5, 2.2, pal.sun, pal.bldgA, pal.bldgB, false);
        }

        // 4. Ola / Inundación 3D avanzando si aplica
        if (scene.hazard === 'flood') {
          const zWave = 14 - Math.min(12, sceneTime * 3.2);
          addBox3D(queue, cam, 0, 0, zWave, 14, 2.4 + Math.sin(t * 6) * 0.3, 3.0, '#aa5b26', '#783719', '#532b1a', false);
        }

        // 5. Personajes en coordenadas 3D reales
        const walkZ = scene.camType === 'whip_pan_chase' ? 6 - Math.sin(sceneTime) * 2 : 5.5;
        addCharacter3D(queue, cam, { x: -1.6, y: 0, z: walkZ, role: scene.role, emotion: scene.emotion });
        if (scene.id % 2 === 0) {
          addCharacter3D(queue, cam, { x: 1.8, y: 0, z: 7.5, role: 'casual', emotion: 'shocked' });
        }

        // Ordenar por profundidad Z de atrás hacia adelante (Painter's Algorithm)
        queue.sort((a, b) => b.z - a.z);
        return { queue, pal };
      }

      function drawTopLabel(ctx, title) {
        if (!title) return;
        ctx.save();
        ctx.font = '900 24px system-ui, sans-serif';
        const tw = ctx.measureText(title).width;
        ctx.fillStyle = 'rgba(12, 16, 26, 0.72)';
        rRect(ctx, 270 - tw / 2 - 18, 34, tw + 36, 40, 12);
        ctx.fill();
        ctx.fillStyle = '#fde047';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(title, 270, 54);
        ctx.restore();
      }

      function drawSubtitles(ctx, scene, sceneTime) {
        const words = scene.words;
        if (!words || !words.length) return;
        let idx = 0;
        for (let i = 0; i < words.length; i++) {
          if (sceneTime >= words[i].start) idx = i;
        }
        const start = Math.floor(idx / 2) * 2;
        const line = words.slice(start, start + 2).map((w) => w.word).join(' ');

        ctx.save();
        ctx.font = '900 38px "Arial Black", Impact, system-ui, sans-serif';
        const w = ctx.measureText(line).width;
        const s = w > 460 ? 460 / w : 1;
        ctx.translate(270, 740);
        ctx.scale(s, s);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = 9; ctx.strokeStyle = '#09090b';
        ctx.strokeText(line, 0, 0);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(line, 0, 0);
        ctx.restore();
      }

      function drawFrame(ctx, canvasW, canvasH, { t, scene, sceneTime, showSubtitles }) {
        ctx.save();
        ctx.clearRect(0, 0, canvasW, canvasH);
        ctx.scale(canvasW / 540, canvasH / 960);

        if (!scene) {
          ctx.fillStyle = '#111622'; ctx.fillRect(0, 0, 540, 960);
          ctx.restore(); return;
        }

        const p = Math.min(1, sceneTime / Math.max(0.5, scene.duration));
        const easeP = 1 - Math.pow(1 - p, 2.2);
        const pal = BIOME_PALETTES[scene.biome] || BIOME_PALETTES.modern_city;

        // CÁMARA 3D REAL CON MOVIMIENTO VISIBLE EN CADA PLANO
        const cam = { x: 0, y: 2.6, z: -6, yaw: 0, pitch: -0.06, roll: 0, fov: 480 };

        if (scene.camType === 'dolly_flyin') {
          // Vuelo rápido entrando por la avenida 3D hacia el personaje
          cam.y = 8.5 - easeP * 6.0;
          cam.z = -18 + easeP * 13.5;
          cam.pitch = -0.28 + easeP * 0.24;
          cam.yaw = -0.18 + easeP * 0.18;
        } else if (scene.camType === 'orbit_hero') {
          // Órbita real de -32° a +32° alrededor del centro (x=0, z=5.5)
          const ang = -0.55 + p * 1.1;
          const dist = 11.5;
          cam.x = Math.sin(ang) * dist;
          cam.z = 5.5 - Math.cos(ang) * dist;
          cam.yaw = -ang;
          cam.y = 2.8 + Math.sin(p * Math.PI) * 1.2;
          cam.pitch = -0.06;
        } else if (scene.camType === 'orbit_reverse') {
          const ang = 0.55 - p * 1.1;
          const dist = 10.5;
          cam.x = Math.sin(ang) * dist;
          cam.z = 5.5 - Math.cos(ang) * dist;
          cam.yaw = -ang;
          cam.y = 3.2;
        } else if (scene.camType === 'whip_pan_chase') {
          cam.x = -5.5 + p * 11.0;
          cam.z = -5.5;
          cam.yaw = (0.5 - p) * 0.45;
          cam.y = 2.4;
        } else if (scene.camType === 'crane_up_reveal') {
          cam.y = 1.6 + easeP * 10.5;
          cam.z = -3.5 - easeP * 13.0;
          cam.pitch = 0.05 - easeP * 0.38;
        } else if (scene.camType === 'impact_shake') {
          const shk = sceneTime < 1.2 ? (1 - sceneTime / 1.2) * 0.45 : 0;
          cam.x = Math.sin(t * 48) * shk;
          cam.y = 2.1 + Math.cos(t * 42) * shk;
          cam.z = -5.5 + p * 2.5;
          cam.roll = 0.07 * Math.sin(t * 32) * (1 - p);
          cam.pitch = 0.04;
        }

        // Cielo + sol/planeta desplazándose con el ángulo yaw de la cámara
        const sky = ctx.createLinearGradient(0, 0, 0, 960);
        sky.addColorStop(0, pal.skyA); sky.addColorStop(1, pal.skyB);
        ctx.fillStyle = sky; ctx.fillRect(0, 0, 540, 960);

        const sunX = 330 - cam.yaw * 220;
        const sunY = 190 - cam.pitch * 300;
        ctx.fillStyle = pal.sun;
        ctx.beginPath(); ctx.arc(sunX, sunY, 72, 0, Math.PI * 2); ctx.fill();

        // Estrellas si es espacio o noche
        if (scene.biome === 'outer_space' || scene.biome === 'forest_night' || scene.biome === 'cyber_lab') {
          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          for (let s = 0; s < 32; s++) {
            const sx = ((s * 97 - cam.yaw * 180) % 540 + 540) % 540;
            const sy = (s * 67) % 480;
            ctx.beginPath(); ctx.arc(sx, sy, 1.5 + (s % 2), 0, Math.PI * 2); ctx.fill();
          }
        }

        // Dibujar geometría 3D ordenada por Z
        const { queue } = buildWorld3D(scene, t, sceneTime, cam);
        for (const item of queue) {
          if (item.kind === 'poly') {
            ctx.fillStyle = item.fill;
            ctx.strokeStyle = item.stroke;
            ctx.lineWidth = item.lineWidth;
            ctx.beginPath();
            ctx.moveTo(item.pts[0].x, item.pts[0].y);
            for (let i = 1; i < item.pts.length; i++) ctx.lineTo(item.pts[i].x, item.pts[i].y);
            ctx.closePath();
            ctx.fill();
            if (item.lineWidth > 0) ctx.stroke();
          } else if (item.kind === 'char') {
            draw2DCharacter(ctx, item.sx, item.sy, item.scale, item.cfg, t);
          }
        }

        // Partículas atmosféricas según evento
        if (scene.hazard === 'explosion' || scene.hazard === 'gold_rain') {
          ctx.fillStyle = scene.hazard === 'gold_rain' ? '#facc15' : '#fb923c';
          for (let i = 0; i < 24; i++) {
            const px = ((i * 73 + t * 140) % 540);
            const py = ((i * 59 + t * 210) % 720);
            ctx.beginPath(); ctx.arc(px, py, 4 + (i % 4), 0, Math.PI * 2); ctx.fill();
          }
        }

        // Viñeta + flash sutil en corte
        const vig = ctx.createRadialGradient(270, 480, 170, 270, 480, 560);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(0,0,0,0.42)');
        ctx.fillStyle = vig; ctx.fillRect(0, 0, 540, 960);

        if (sceneTime < 0.14) {
          ctx.fillStyle = `rgba(255,255,255,${0.25 * (1 - sceneTime / 0.14)})`;
          ctx.fillRect(0, 0, 540, 960);
        }

        drawTopLabel(ctx, scene.title);
        if (showSubtitles) drawSubtitles(ctx, scene, sceneTime);

        ctx.restore();
      }

      return { drawFrame };
    })();

    // =========================================================================
    // 4. EXPORTADOR MP4 DETERMINISTA
    // =========================================================================
    window.ExporterMP4 = (() => {
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function pickVideoConfig(width, height, fps) {
        for (const codec of ['avc1.64002a', 'avc1.4d002a', 'avc1.42002a', 'avc1.42001f']) {
          const cfg = { codec, width, height, bitrate: width >= 1080 ? 5_800_000 : 3_400_000, framerate: fps };
          if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg;
        }
        return null;
      }

      async function pickAudioConfig(sampleRate) {
        for (const c of [{ codec: 'mp4a.40.2', mux: 'aac' }, { codec: 'opus', mux: 'opus' }]) {
          const cfg = { codec: c.codec, numberOfChannels: 2, sampleRate, bitrate: 128000 };
          if ((await AudioEncoder.isConfigSupported(cfg)).supported) return { cfg, mux: c.mux };
        }
        return null;
      }

      async function exportWithMediaRecorderFallback(opts) {
        const { scenes, masterBuffer, totalDuration, width, height, fps, showSubtitles, onProgress } = opts;
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');

        const audioCtx = window.AudioEngine.ensureLiveContext();
        const dest = audioCtx.createMediaStreamDestination();
        const src = audioCtx.createBufferSource();
        src.buffer = masterBuffer; src.connect(dest);

        const stream = new MediaStream([...canvas.captureStream(fps).getVideoTracks(), ...dest.stream.getAudioTracks()]);
        const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4_500_000 });
        const chunks = [];
        rec.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

        return new Promise((resolve) => {
          rec.onstop = () => resolve({ blob: new Blob(chunks, { type: mime }), ext: mime.includes('mp4') ? 'mp4' : 'webm' });
          const startT = audioCtx.currentTime + 0.05;
          rec.start(); src.start(startT);

          const tick = () => {
            const elapsed = Math.max(0, audioCtx.currentTime - startT);
            if (elapsed >= totalDuration) { rec.stop(); try { src.stop(); } catch (_) {} return; }
            let active = scenes[scenes.length - 1];
            for (const s of scenes) { if (elapsed >= s.startTime && elapsed < s.startTime + s.duration) { active = s; break; } }
            window.Engine3D.drawFrame(ctx, width, height, {
              t: elapsed, scene: active, sceneTime: Math.max(0, elapsed - active.startTime), showSubtitles
            });
            if (onProgress) onProgress(Math.min(0.98, elapsed / totalDuration), `Grabando vídeo (${elapsed.toFixed(1)}s)...`);
            requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        });
      }

      async function exportToMP4(opts) {
        const { scenes, masterBuffer, totalDuration, width, height, fps, showSubtitles, onProgress } = opts;
        if (onProgress) onProgress(0.02, 'Cargando empaquetador MP4...');
        const hasMuxer = await ensureMp4MuxerLoaded();
        const hasWebCodecs = typeof VideoEncoder !== 'undefined' && typeof AudioEncoder !== 'undefined';

        if (!hasMuxer || !hasWebCodecs) return await exportWithMediaRecorderFallback(opts);
        const vConfig = await pickVideoConfig(width, height, fps);
        const aChoice = await pickAudioConfig(masterBuffer.sampleRate);
        if (!vConfig || !aChoice) return await exportWithMediaRecorderFallback(opts);

        const muxer = new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video: { codec: 'avc', width, height },
          audio: { codec: aChoice.mux, numberOfChannels: 2, sampleRate: masterBuffer.sampleRate },
          fastStart: 'in-memory'
        });

        const videoEncoder = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: console.error });
        videoEncoder.configure(vConfig);
        const audioEncoder = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: console.error });
        audioEncoder.configure(aChoice.cfg);

        if (onProgress) onProgress(0.06, 'Codificando música y SFX...');
        const sr = masterBuffer.sampleRate;
        const ch0 = masterBuffer.getChannelData(0);
        const ch1 = masterBuffer.getChannelData(1);
        for (let offset = 0; offset < ch0.length; offset += 2048) {
          const n = Math.min(2048, ch0.length - offset);
          const planar = new Float32Array(n * 2);
          planar.set(ch0.subarray(offset, offset + n), 0);
          planar.set(ch1.subarray(offset, offset + n), n);
          const ad = new AudioData({
            format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: 2,
            timestamp: Math.round((offset * 1_000_000) / sr), data: planar
          });
          while (audioEncoder.encodeQueueSize > 16) await sleep(4);
          audioEncoder.encode(ad); ad.close();
        }

        const offCanvas = document.createElement('canvas');
        offCanvas.width = width; offCanvas.height = height;
        const offCtx = offCanvas.getContext('2d');
        const totalFrames = Math.ceil(totalDuration * fps);
        const frameDurUs = Math.round(1_000_000 / fps);

        for (let f = 0; f < totalFrames; f++) {
          const t = f / fps;
          let active = scenes[scenes.length - 1];
          for (const s of scenes) { if (t >= s.startTime && t < s.startTime + s.duration) { active = s; break; } }

          window.Engine3D.drawFrame(offCtx, width, height, {
            t, scene: active, sceneTime: Math.max(0, t - active.startTime), showSubtitles
          });

          const frame = new VideoFrame(offCanvas, { timestamp: Math.round((f * 1_000_000) / fps), duration: frameDurUs });
          while (videoEncoder.encodeQueueSize > 8) await sleep(6);
          videoEncoder.encode(frame, { keyFrame: f % (fps * 2) === 0 });
          frame.close();

          if (f % 10 === 0 && onProgress) {
            onProgress(0.1 + 0.85 * (f / totalFrames), `Renderizando 3D (${f}/${totalFrames})...`);
            await sleep(0);
          }
        }

        if (onProgress) onProgress(0.96, 'Finalizando MP4...');
        await audioEncoder.flush();
        await videoEncoder.flush();
        muxer.finalize();
        return { blob: new Blob([muxer.target.buffer], { type: 'video/mp4' }), ext: 'mp4' };
      }

      return { exportToMP4 };
    })();

    // =========================================================================
    // 5. CONTROLADOR UI
    // =========================================================================
    function initEngineApp() {
      const el = {
        codecSupportBadge: document.getElementById('codecSupportBadge'),
        presetSelect: document.getElementById('presetSelect'),
        loadPresetBtn: document.getElementById('loadPresetBtn'),
        storyInput: document.getElementById('storyInput'),
        resolutionSelect: document.getElementById('resolutionSelect'),
        fpsSelect: document.getElementById('fpsSelect'),
        subtitleModeSelect: document.getElementById('subtitleModeSelect'),
        musicToggle: document.getElementById('musicToggle'),
        sfxToggle: document.getElementById('sfxToggle'),
        buildShortBtn: document.getElementById('buildShortBtn'),
        remixVisualsBtn: document.getElementById('remixVisualsBtn'),
        sceneCount: document.getElementById('sceneCount'),
        scenesSummary: document.getElementById('scenesSummary'),
        previewCanvas: document.getElementById('previewCanvas'),
        playPauseBtn: document.getElementById('playPauseBtn'),
        restartBtn: document.getElementById('restartBtn'),
        timelineScrubber: document.getElementById('timelineScrubber'),
        timeDisplay: document.getElementById('timeDisplay'),
        statusBanner: document.getElementById('statusBanner'),
        exportMp4Btn: document.getElementById('exportMp4Btn'),
        exportProgressWrap: document.getElementById('exportProgressWrap'),
        exportProgressBar: document.getElementById('exportProgressBar'),
        exportProgressText: document.getElementById('exportProgressText'),
        exportResultWrap: document.getElementById('exportResultWrap'),
        exportedVideoPreview: document.getElementById('exportedVideoPreview'),
        downloadMp4Link: document.getElementById('downloadMp4Link')
      };

      const state = {
        scenes: [], storySeed: 1, extraSeed: 0, masterBuffer: null, totalDuration: 0,
        isPlaying: false, playOffset: 0, audioStartTime: 0,
        activeSourceNode: null, rafId: null, lastExportUrl: null
      };

      const previewCtx = el.previewCanvas.getContext('2d');

      if (typeof VideoEncoder !== 'undefined' && typeof AudioEncoder !== 'undefined') {
        el.codecSupportBadge.textContent = '✓ WebCodecs MP4 2.5D listo';
        el.codecSupportBadge.style.color = '#6ee7b7';
      } else {
        el.codecSupportBadge.textContent = '✓ Modo Grabación Directa';
        el.codecSupportBadge.style.color = '#fde047';
      }

      ensureMp4MuxerLoaded();
      const setStatus = (m) => { el.statusBanner.textContent = m; };

      function renderSummary() {
        el.sceneCount.textContent = state.scenes.length;
        el.scenesSummary.innerHTML = '';
        state.scenes.forEach((sc, idx) => {
          const div = document.createElement('div');
          div.className = 'scene-pill';
          div.innerHTML = `<strong>#${idx + 1} · ${sc.biome} · cámara: ${sc.camType}</strong>` +
            `<small>${sc.text}</small>`;
          el.scenesSummary.appendChild(div);
        });
      }

      async function rebuildShort() {
        stopPlayback();
        const raw = el.storyInput.value.trim();
        if (!raw) return;

        const compiled = window.StoryBrain.compileStory(raw, state.extraSeed);
        state.scenes = compiled.scenes;
        state.storySeed = compiled.storySeed;

        let cursor = 0;
        state.scenes.forEach((sc) => { sc.startTime = cursor; cursor += sc.duration; });
        state.totalDuration = Math.max(1.0, cursor + 0.25);
        state.playOffset = 0;

        el.timelineScrubber.max = state.totalDuration.toFixed(2);
        updateTimeLabel(0);
        drawPreviewAt(0);
        renderSummary();

        state.masterBuffer = await window.AudioEngine.renderAudioMix({
          scenes: state.scenes,
          totalDuration: state.totalDuration,
          enableMusic: el.musicToggle.checked,
          enableSFX: el.sfxToggle.checked,
          seedVal: state.storySeed
        });

        setStatus(`✓ Mundo 3D "${state.scenes[0]?.biome}" creado con ${state.scenes.length} cámaras en movimiento (${state.totalDuration.toFixed(1)}s).`);
      }

      function updateTimeLabel(t) {
        el.timeDisplay.textContent = `${t.toFixed(1)}s / ${state.totalDuration.toFixed(1)}s`;
        el.timelineScrubber.value = Math.min(state.totalDuration, t);
      }

      function drawPreviewAt(t) {
        if (!state.scenes.length) {
          window.Engine3D.drawFrame(previewCtx, el.previewCanvas.width, el.previewCanvas.height, { t: 0, scene: null, sceneTime: 0 });
          return;
        }
        let active = state.scenes[state.scenes.length - 1];
        for (const s of state.scenes) { if (t >= s.startTime && t < s.startTime + s.duration) { active = s; break; } }

        window.Engine3D.drawFrame(previewCtx, el.previewCanvas.width, el.previewCanvas.height, {
          t, scene: active, sceneTime: Math.max(0, t - active.startTime),
          showSubtitles: el.subtitleModeSelect.value === 'on'
        });
      }

      function stopPlayback() {
        state.isPlaying = false;
        el.playPauseBtn.textContent = '▶ Reproducir Preview';
        if (state.activeSourceNode) { try { state.activeSourceNode.stop(); } catch (_) {} state.activeSourceNode = null; }
        if (state.rafId) cancelAnimationFrame(state.rafId);
      }

      async function startPlayback() {
        if (!state.scenes.length || !state.masterBuffer) return;
        const ctx = window.AudioEngine.ensureLiveContext();
        if (state.playOffset >= state.totalDuration - 0.05) state.playOffset = 0;

        const src = ctx.createBufferSource();
        src.buffer = state.masterBuffer;
        src.connect(ctx.destination);

        const startAt = ctx.currentTime + 0.04;
        src.start(startAt, state.playOffset);
        state.activeSourceNode = src;
        state.audioStartTime = startAt - state.playOffset;
        state.isPlaying = true;
        el.playPauseBtn.textContent = '⏸ Pausar';

        const loop = () => {
          if (!state.isPlaying) return;
          const elapsed = Math.max(0, ctx.currentTime - state.audioStartTime);
          state.playOffset = elapsed;
          if (elapsed >= state.totalDuration) {
            stopPlayback(); state.playOffset = 0; updateTimeLabel(0); drawPreviewAt(0); return;
          }
          drawPreviewAt(elapsed);
          updateTimeLabel(elapsed);
          state.rafId = requestAnimationFrame(loop);
        };
        state.rafId = requestAnimationFrame(loop);
      }

      el.loadPresetBtn.addEventListener('click', () => {
        state.extraSeed = 0;
        el.storyInput.value = window.StoryBrain.PRESETS[el.presetSelect.value] || '';
        rebuildShort();
      });

      el.buildShortBtn.addEventListener('click', () => {
        state.extraSeed = 0;
        rebuildShort();
      });

      el.remixVisualsBtn.addEventListener('click', () => {
        state.extraSeed += 1;
        rebuildShort();
      });

      [el.musicToggle, el.sfxToggle].forEach((n) => {
        n.addEventListener('change', async () => {
          if (!state.scenes.length) return;
          state.masterBuffer = await window.AudioEngine.renderAudioMix({
            scenes: state.scenes, totalDuration: state.totalDuration,
            enableMusic: el.musicToggle.checked, enableSFX: el.sfxToggle.checked,
            seedVal: state.storySeed
          });
        });
      });

      el.subtitleModeSelect.addEventListener('change', () => drawPreviewAt(state.playOffset));

      el.playPauseBtn.addEventListener('click', () => {
        if (state.isPlaying) stopPlayback(); else startPlayback();
      });

      el.restartBtn.addEventListener('click', () => {
        stopPlayback(); state.playOffset = 0; updateTimeLabel(0); drawPreviewAt(0);
      });

      el.timelineScrubber.addEventListener('input', (e) => {
        stopPlayback(); state.playOffset = parseFloat(e.target.value);
        updateTimeLabel(state.playOffset); drawPreviewAt(state.playOffset);
      });

      el.exportMp4Btn.addEventListener('click', async () => {
        if (!state.scenes.length || !state.masterBuffer) return alert('Primero crea el Short.');
        stopPlayback();

        const [w, h] = el.resolutionSelect.value.split('x').map(Number);
        const fps = parseInt(el.fpsSelect.value, 10);

        el.exportMp4Btn.disabled = true;
        el.exportProgressWrap.classList.remove('hidden');
        el.exportResultWrap.classList.add('hidden');

        try {
          const { blob, ext } = await window.ExporterMP4.exportToMP4({
            scenes: state.scenes,
            masterBuffer: state.masterBuffer,
            totalDuration: state.totalDuration,
            width: w, height: h, fps,
            showSubtitles: el.subtitleModeSelect.value === 'on',
            onProgress: (ratio, msg) => {
              el.exportProgressBar.style.width = `${Math.round(ratio * 100)}%`;
              el.exportProgressText.textContent = msg;
            }
          });

          if (state.lastExportUrl) URL.revokeObjectURL(state.lastExportUrl);
          const url = URL.createObjectURL(blob);
          state.lastExportUrl = url;
          el.exportedVideoPreview.src = url;
          el.downloadMp4Link.href = url;
          el.downloadMp4Link.download = `short-25d.${ext}`;
          el.exportResultWrap.classList.remove('hidden');
          setStatus(`¡Short 3D exportado (${(blob.size / 1024 / 1024).toFixed(2)} MB) en .${ext}!`);
        } catch (err) {
          alert('Error al exportar: ' + err.message);
          setStatus('Error exportando: ' + err.message);
        } finally {
          el.exportMp4Btn.disabled = false;
          el.exportProgressWrap.classList.add('hidden');
        }
      });

      el.storyInput.value = window.StoryBrain.PRESETS.hacker;
      rebuildShort();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        try { initEngineApp(); } catch (e) {
          document.getElementById('codecSupportBadge').textContent = 'Error JS: ' + e.message;
        }
      });
    } else {
      try { initEngineApp(); } catch (e) {
        document.getElementById('codecSupportBadge').textContent = 'Error JS: ' + e.message;
      }
    }
  </script>
</body>
</html>
