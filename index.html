<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Short 2.5D Studio — Escenarios Únicos, Luces y Sombras desde tu Guion</title>
  <style>
    :root {
      --bg: #0a0d14;
      --panel: #131823;
      --panel-alt: #1b2231;
      --border: #2b354b;
      --text: #eef1f7;
      --muted: #93a1b9;
      --primary: #4f7cff;
      --accent: #00c2a8;
      --export: #ff4d6d;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar h1 { margin: 0; font-size: 1.12rem; }
    .subtitle { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }

    .badge {
      background: var(--accent);
      color: #06211c;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      vertical-align: middle;
    }

    .status-pill {
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, 1.15fr) minmax(320px, 0.85fr);
      gap: 18px;
      padding: 18px;
      max-width: 1540px;
      margin: 0 auto;
    }

    @media (max-width: 960px) {
      .workspace { grid-template-columns: 1fr; }
    }

    .panel { display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
    }

    .card h2 { margin: 0 0 10px; font-size: 0.98rem; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .card-header h2 { margin: 0; }

    textarea, select {
      width: 100%;
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      font-size: 0.86rem;
    }

    textarea { resize: vertical; line-height: 1.5; }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .checkbox-label {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      color: var(--text);
      cursor: pointer;
    }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
    @media (max-width: 640px) { .grid-4, .grid-3 { grid-template-columns: 1fr 1fr; } }

    .toggles-grid { display: flex; flex-wrap: wrap; gap: 16px; margin: 10px 0; }
    .preset-row, .actions-row { display: flex; gap: 8px; align-items: center; }
    .preset-row { flex: 1; min-width: 240px; }
    .actions-row { margin-top: 12px; gap: 10px; }

    button, .download-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: opacity 0.15s ease;
    }

    button:hover, .download-btn:hover { opacity: 0.9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); }
    .btn-export { background: var(--export); color: #fff; width: 100%; padding: 12px; font-size: 0.96rem; }

    .scenes-summary {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 440px;
      overflow-y: auto;
    }

    .scene-pill {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.82rem;
    }

    .scene-pill strong { color: var(--accent); }
    .scene-pill p { margin: 4px 0; color: var(--text); }

    .preview-card { position: sticky; top: 16px; }

    .phone-frame {
      width: min(350px, 100%);
      aspect-ratio: 9 / 16;
      margin: 0 auto 12px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border);
    }

    #previewCanvas { width: 100%; height: 100%; display: block; }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .time-display {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .scrubber { width: 100%; margin-bottom: 8px; }
    .status-banner { margin: 4px 0 0; font-size: 0.82rem; color: #b7c4e0; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .progress-wrap { margin-top: 12px; }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--panel-alt);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }

    .export-result {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .export-result video {
      width: min(260px, 100%);
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      border-radius: 10px;
      background: #000;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Short 2.5D Studio <span class="badge">14 MUNDOS 2.5D · LUCES Y SOMBRAS</span></h1>
      <p class="subtitle">Escenarios únicos según tu guion · 5 capas parallax, iluminación volumétrica, música + SFX y MP4 9:16</p>
    </div>
    <div id="codecSupportBadge" class="status-pill">Iniciando...</div>
  </header>

  <main class="workspace">
    <!-- PANEL IZQUIERDO -->
    <section class="panel controls-panel">
      <div class="card">
        <div class="card-header">
          <h2>1. Tu Guion</h2>
          <div class="preset-row">
            <select id="presetSelect">
              <option value="cocinero">Ejemplo: Cocinero, incendio, persecución y tren</option>
              <option value="hacker">Ejemplo: Hacker en oficina, bóveda de oro y policía</option>
              <option value="volcan">Ejemplo: Barco en tormenta, volcán y helicóptero</option>
              <option value="espacio">Ejemplo: Estación espacial, asteroide y desierto</option>
              <option value="carcel">Ejemplo: Fuga de prisión por el bosque nocturno</option>
            </select>
            <button id="loadPresetBtn" type="button" class="btn-secondary">Cargar</button>
          </div>
        </div>

        <textarea id="storyInput" rows="7" placeholder="Escribe cada frase de tu historia... La web crea escenarios completamente distintos para cocina, oficina, banco, calle, tren, océano, volcán, espacio, bosque, desierto, cárcel, hospital, estadio o castillo."></textarea>

        <div class="grid-3" style="margin-top:10px;">
          <label>
            Resolución
            <select id="resolutionSelect">
              <option value="720x1280" selected>720×1280 (Rápido)</option>
              <option value="1080x1920">1080×1920 (Full HD)</option>
            </select>
          </label>
          <label>
            FPS
            <select id="fpsSelect">
              <option value="30" selected>30 FPS</option>
              <option value="60">60 FPS</option>
            </select>
          </label>
          <label>
            Subtítulos
            <select id="subtitleModeSelect">
              <option value="on" selected>Activados al ritmo</option>
              <option value="off">Solo rótulo superior</option>
            </select>
          </label>
        </div>

        <div class="toggles-grid">
          <label class="checkbox-label">
            <input type="checkbox" id="musicToggle" checked />
            Música cinematográfica
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="sfxToggle" checked />
            Efectos de sonido (SFX)
          </label>
        </div>

        <div class="actions-row">
          <button id="buildShortBtn" type="button" class="btn-primary" style="flex:1">⚡ Crear Short desde mi Guion</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>2. Escenas Generadas (<span id="sceneCount">0</span>)</h2>
        </div>
        <div id="scenesSummary" class="scenes-summary"></div>
      </div>
    </section>

    <!-- PANEL DERECHO -->
    <section class="panel preview-panel">
      <div class="card preview-card">
        <div class="phone-frame">
          <canvas id="previewCanvas" width="540" height="960"></canvas>
        </div>

        <div class="player-controls">
          <button id="playPauseBtn" type="button" class="btn-primary">▶ Reproducir Preview</button>
          <button id="restartBtn" type="button" class="btn-secondary">⟲ Reiniciar</button>
          <span id="timeDisplay" class="time-display">00.0s / 00.0s</span>
        </div>

        <input type="range" id="timelineScrubber" min="0" max="100" step="0.01" value="0" class="scrubber" />
        <p id="statusBanner" class="status-banner">Listo.</p>

        <hr class="divider" />

        <button id="exportMp4Btn" type="button" class="btn-export">🎬 Exportar Short en MP4 (9:16)</button>

        <div id="exportProgressWrap" class="progress-wrap hidden">
          <div class="progress-track">
            <div id="exportProgressBar" class="progress-fill"></div>
          </div>
          <p id="exportProgressText">Preparando...</p>
        </div>

        <div id="exportResultWrap" class="export-result hidden">
          <h3>¡Short MP4 listo!</h3>
          <video id="exportedVideoPreview" controls playsinline></video>
          <a id="downloadMp4Link" class="btn-primary download-btn" download="short-25d.mp4">⬇ Descargar MP4</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    // =========================================================================
    // 0. CARGADOR NO BLOQUEANTE DE MP4-MUXER
    // =========================================================================
    function loadScriptAsync(url) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url; s.async = true;
        s.onload = () => resolve(true);
        s.onerror = () => reject(new Error('No se pudo cargar ' + url));
        document.head.appendChild(s);
      });
    }

    async function ensureMp4MuxerLoaded() {
      if (typeof window.Mp4Muxer !== 'undefined') return true;
      for (const url of [
        'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js',
        'https://unpkg.com/mp4-muxer@5.2.2/build/mp4-muxer.js'
      ]) {
        try {
          await Promise.race([loadScriptAsync(url), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);
          if (typeof window.Mp4Muxer !== 'undefined') return true;
        } catch (_) {}
      }
      return false;
    }

    // =========================================================================
    // 1. AUDIO: MÚSICA Y SFX ADAPTADOS (SIN VOZ)
    // =========================================================================
    window.AudioEngine = (() => {
      const SR = 48000;
      let liveCtx = null;

      function ensureLiveContext() {
        if (!liveCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          try { liveCtx = new AC({ sampleRate: SR }); } catch (_) { liveCtx = new AC(); }
        }
        if (liveCtx.state === 'suspended') liveCtx.resume();
        return liveCtx;
      }

      async function renderAudioMix({ scenes, totalDuration, enableMusic, enableSFX, seedVal }) {
        const N = Math.ceil(totalDuration * SR);
        const buf = new AudioBuffer({ numberOfChannels: 2, length: N, sampleRate: SR });
        const music = new Float64Array(N);
        const sfx = new Float64Array(N);

        let seed = (seedVal || 77) >>> 0;
        const rand = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return (seed / 4294967296) * 2 - 1;
        };

        if (enableMusic) {
          const roots = [55, 65.41, 49, 73.42];
          const root = roots[seedVal % roots.length];
          const chords = [
            [root, root * 1.5, root * 2],
            [root * 0.89, root * 1.33, root * 1.78],
            [root * 0.84, root * 1.26, root * 1.68],
            [root * 0.75, root * 1.12, root * 1.5]
          ];
          const segDur = totalDuration / chords.length;
          chords.forEach((notes, cIdx) => {
            const i0 = Math.floor(cIdx * segDur * SR);
            const i1 = Math.min(N, Math.floor((cIdx + 1) * segDur * SR));
            for (let i = i0; i < i1; i++) {
              const tt = (i - i0) / SR;
              const env = Math.min(1, tt / 1.0) * Math.min(1, (segDur - tt) / 0.9);
              let v = 0;
              notes.forEach((f, j) => {
                v += 0.045 * env * Math.sin(2 * Math.PI * f * tt + j * 0.4);
                v += 0.012 * env * Math.sin(2 * Math.PI * f * 2.01 * tt);
              });
              music[i] += v;
            }
          });

          for (let beat = 0; beat < totalDuration; beat += 0.5) {
            const idx = Math.floor(beat * SR);
            const ln = Math.min(Math.floor(0.22 * SR), N - idx);
            for (let q = 0; q < ln; q++) {
              const qt = q / SR;
              music[idx + q] += 0.075 * Math.sin(2 * Math.PI * (beat % 1 === 0 ? 64 : 92) * qt) * Math.exp(-qt * 18);
            }
          }

          const scale = [1, 1.189, 1.335, 1.498, 1.782, 2.0];
          for (let k = 0; k < Math.floor(totalDuration / 1.6); k++) {
            const sec = k * 1.6 + 0.3;
            const idx = Math.floor(sec * SR);
            const ln = Math.min(Math.floor(1.2 * SR), N - idx);
            const f = root * 4 * scale[(k * 3 + seedVal) % scale.length];
            for (let q = 0; q < ln; q++) {
              const qt = q / SR;
              music[idx + q] += 0.042 * Math.sin(2 * Math.PI * f * qt) * Math.exp(-qt * 3.0);
            }
          }
        }

        if (enableSFX) {
          const addBand = (sec, dur, amp, lo, hi) => {
            const idx = Math.floor(sec * SR);
            const ln = Math.min(Math.floor(dur * SR), N - idx);
            if (ln <= 0) return;
            let lp = 0, hp = 0, prev = 0;
            const aLP = Math.min(0.95, (2 * Math.PI * hi) / (SR + 2 * Math.PI * hi));
            const aHP = SR / (SR + 2 * Math.PI * lo);
            for (let q = 0; q < ln; q++) {
              const qt = q / SR;
              lp += aLP * (rand() - lp);
              hp = aHP * (hp + lp - prev);
              prev = lp;
              sfx[idx + q] += amp * hp * Math.exp(-qt * 3.8) * Math.min(1, qt * 12);
            }
          };

          const addTone = (sec, dur, f0, f1, amp) => {
            const idx = Math.floor(sec * SR);
            const ln = Math.min(Math.floor(dur * SR), N - idx);
            for (let q = 0; q < ln; q++) {
              const qt = q / SR;
              const f = f0 + (f1 - f0) * (qt / dur);
              sfx[idx + q] += amp * Math.sin(2 * Math.PI * f * qt) * Math.exp(-qt * 6);
            }
          };

          scenes.forEach((sc, idx) => {
            if (idx > 0) addBand(sc.startTime, 0.32, 0.14, 260, 2600);
            if (sc.fx === 'explosion' || sc.fx === 'fire') addBand(sc.startTime + 0.1, 1.4, 0.35, 50, 750);
            else if (sc.fx === 'rain' || sc.world === 'ocean') addBand(sc.startTime + 0.05, Math.min(2.5, sc.duration), 0.12, 500, 3200);
            else if (sc.action === 'celebrate' || sc.prop === 'gold') {
              addTone(sc.startTime + 0.2, 0.5, 880, 1320, 0.12);
              addTone(sc.startTime + 0.35, 0.5, 1320, 1760, 0.1);
            } else if (sc.action === 'alarm' || sc.fx === 'siren') {
              addTone(sc.startTime + 0.15, 0.4, 620, 920, 0.1);
              addTone(sc.startTime + 0.6, 0.4, 920, 620, 0.1);
            } else if (sc.action === 'run') {
              [0.15, 0.45, 0.75, 1.05].forEach((off) => addBand(sc.startTime + off, 0.12, 0.12, 90, 400));
            }
          });
        }

        const L = buf.getChannelData(0), R = buf.getChannelData(1);
        const norm = Math.tanh(1.1);
        for (let i = 0; i < N; i++) {
          const comp = Math.tanh((music[i] + sfx[i]) * 1.35) / norm;
          L[i] = Math.max(-0.92, Math.min(0.92, comp + 0.02 * music[i]));
          R[i] = Math.max(-0.92, Math.min(0.92, comp - 0.02 * music[i]));
        }
        return buf;
      }

      return { SR, ensureLiveContext, renderAudioMix };
    })();

    // =========================================================================
    // 2. COMPOSITOR SEMÁNTICO (14 MUNDOS ÚNICOS + PROPS + ACCIONES)
    // =========================================================================
    window.SemanticDirector = (() => {
      const PRESETS = {
        cocinero:
`Un cocinero trabajaba de noche dentro de una pequeña cocina preparando una cena secreta.
De pronto la sartén empezó a arder en llamas y sonó la alarma de incendios.
Salió corriendo por la calle bajo la lluvia mientras llegaba la policía.
Saltó encima de un tren en marcha y escapó en la oscuridad.`,

        hacker:
`Un joven hacker trabajaba frente a su ordenador en una oficina oscura llena de luces neón.
Descubrió la clave de la bóveda del banco y planeó llevarse todo el oro.
Al entrar en la cámara acorazada saltaron los láseres y sonó la sirena roja.
Huyó en un coche deportivo por la avenida antes del amanecer.`,

        volcan:
`Un grupo de exploradores navegaba en un barco hacia una isla con un enorme volcán.
Al pisar la arena del desierto la montaña empezó a temblar con fuerza.
Corrieron por el bosque mientras caía fuego y ceniza del cielo.
Despegaron en un helicóptero justo cuando la lava cubrió la costa.`,

        espacio:
`Un astronauta flotaba en el espacio reparando una estación junto a un planeta anillado.
Un asteroide chocó contra la nave y provocó chispas y fuego en los motores.
Aterrizó de emergencia en las dunas del desierto al atardecer.
Al salir de la cápsula celebró mirando el cielo estrellado.`,

        carcel:
`Un prisionero observaba la luna desde su celda detrás de los barrotes de la cárcel.
Consiguió abrir una puerta oculta y corrió por el bosque oscuro bajo la lluvia.
Tras cruzar un puente antiguo llegó hasta un estadio lleno de luces.
Se escondió entre la multitud mientras todos celebraban la victoria.`
      };

      const WORLDS = [
        'kitchen', 'hacker_office', 'bank_vault', 'city_street', 'train_tracks',
        'ocean', 'volcano', 'outer_space', 'forest', 'desert',
        'prison', 'hospital', 'stadium', 'castle'
      ];

      function hashStr(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function buildWords(text, duration) {
        const list = text.trim().split(/\s+/).filter(Boolean);
        if (!list.length) return [];
        const usable = Math.max(0.8, duration - 0.25);
        const w = list.map((x) => Math.max(2, x.length) + (/[,.;:!?]$/.test(x) ? 2 : 0));
        const tot = w.reduce((a, b) => a + b, 0);
        let cur = 0.12;
        return list.map((word, i) => {
          const d = (w[i] / tot) * usable;
          const obj = { word, start: cur, end: cur + d };
          cur += d;
          return obj;
        });
      }

      function analyzeSentence(text, idx, total, seed, prev) {
        const l = text.toLowerCase();

        // 1. MUNDO / ESCENARIO ÚNICO
        let world = null;
        if (/cocin|sartén|horno|restaurante|cena/.test(l)) world = 'kitchen';
        else if (/bóveda|banco|acorazada|lingote|tesoro/.test(l)) world = 'bank_vault';
        else if (/hacker|ordenador|computador|oficina|servidor|código|neón/.test(l)) world = 'hacker_office';
        else if (/cárcel|prisión|celda|barrote/.test(l)) world = 'prison';
        else if (/hospital|médico|enferm|ambulancia|camilla/.test(l)) world = 'hospital';
        else if (/estadio|fútbol|partido|multitud|grada/.test(l)) world = 'stadium';
        else if (/castillo|rey|reina|trono|caballero|medieval/.test(l)) world = 'castle';
        else if (/tren|vía|estación|ferrocarril/.test(l)) world = 'train_tracks';
        else if (/espacio|órbita|planeta|asteroide|estación espacial|astronauta/.test(l)) world = 'outer_space';
        else if (/volcán|lava|erupción/.test(l)) world = 'volcano';
        else if (/océano|mar|barco|submarino|isla|navega|ola/.test(l)) world = 'ocean';
        else if (/bosque|árbol|selva/.test(l)) world = 'forest';
        else if (/desierto|arena|duna|pirámide|egipto/.test(l)) world = 'desert';
        else if (/calle|avenida|ciudad|coche|policía|puente|edificio/.test(l)) world = 'city_street';
        else {
          // Si no hay palabra clave explícita, garantizar rotación diversa de escenarios distintos
          world = WORLDS[(seed + idx * 5) % WORLDS.length];
        }

        // 2. ILUMINACIÓN / HORA
        let lighting = 'day';
        if (/noche|oscur|luna|madrugada|cárcel|celda/.test(l)) lighting = 'night';
        else if (/atardecer|ocaso|dorado/.test(l)) lighting = 'sunset';
        else if (/neón|hacker|ciber|bóveda|láser/.test(l)) lighting = 'neon';
        else if (/fuego|llama|ard|volcán|lava|incendio|explos/.test(l)) lighting = 'fire';
        else if (prev && prev.lighting === 'night' && !/amanec|sol|día/.test(l)) lighting = 'night';

        // 3. PERSONAJE Y VESTUARIO
        let role = 'casual';
        if (/cocinero|chef/.test(l)) role = 'chef';
        else if (/policía|guardia|detective/.test(l)) role = 'police';
        else if (/hacker|programador/.test(l)) role = 'hacker';
        else if (/astronauta/.test(l)) role = 'astronaut';
        else if (/médico|doctor|científico/.test(l)) role = 'scientist';
        else if (/rey|reina|emperador/.test(l)) role = 'monarch';
        else if (/prisionero|preso/.test(l)) role = 'prisoner';
        else if (/ladrón|empresario|banquero/.test(l)) role = 'suit';
        else if (/explorador|pirata/.test(l)) role = 'explorer';
        else if (prev) role = prev.role;

        // 4. ACCIÓN Y SEGUNDO PERSONAJE
        let action = 'idle';
        let hasSecond = false;
        let secondRole = 'police';
        if (/corri|huy|escap|persegu|salt/.test(l)) action = 'run';
        else if (/pele|luch|enfrent|atac/.test(l)) { action = 'fight'; hasSecond = true; }
        else if (/celebr|victoria|gan|festej/.test(l)) action = 'celebrate';
        else if (/alarma|sirena|asust|tembl|choqu/.test(l)) action = 'alarm';
        else if (/plane|pens|observ|descubr|repar/.test(l)) action = 'think';

        if (/policía/.test(l) && role !== 'police') { hasSecond = true; secondRole = 'police'; }
        else if (/grupo|todos|multitud|exploradores/.test(l)) { hasSecond = true; secondRole = 'casual'; }

        // 5. OBJETO / VEHÍCULO PROTAGONISTA
        let prop = 'none';
        let icon = '';
        if (/coche|deportivo|auto|patrulla/.test(l)) { prop = 'car'; icon = '🚗'; }
        else if (/helicóptero|despeg/.test(l)) { prop = 'helicopter'; icon = '🚁'; }
        else if (/tren/.test(l)) { prop = 'train'; icon = '🚆'; }
        else if (/barco|submarino/.test(l)) { prop = 'boat'; icon = '🚢'; }
        else if (/cohete|cápsula|nave/.test(l)) { prop = 'rocket'; icon = '🚀'; }
        else if (/oro|diamante|tesoro|dinero/.test(l)) { prop = 'gold'; icon = '💰'; }
        else if (/ordenador|pantalla/.test(l)) { icon = '💻'; }
        else if (/sartén|cena|cocin/.test(l)) { icon = '🍳'; }

        // 6. EFECTOS CLIMÁTICOS / PELIGRO
        let fx = 'none';
        if (/fuego|llama|ard|incendio|lava/.test(l)) fx = 'fire';
        else if (/explot|choc|chispas/.test(l)) fx = 'explosion';
        else if (/lluvia|tormenta/.test(l)) fx = 'rain';
        else if (/sirena|alarma|policía/.test(l)) fx = 'siren';
        else if (/celebr|oro|victoria/.test(l)) fx = 'sparkles';

        // 7. CÁMARA 2.5D (Obligatoriamente distinta en cada corte)
        const cams = ['dolly_zoom_in', 'pan_left', 'crane_down', 'pan_right', 'chase_track'];
        let camType = cams[idx % cams.length];
        if (fx === 'explosion' || action === 'alarm') camType = 'impact_shake';
        else if (action === 'run') camType = idx % 2 === 0 ? 'chase_track' : 'pan_right';

        const num = text.match(/\b(1[0-9]{3}|20[0-2][0-9]|\d+(?:[.,]\d+)?\s?(?:millones|mil|km\/h|horas|días|%))\b/i);
        const title = num ? num[1].toUpperCase() : (text.replace(/[¿?¡!.,;:]/g, '').split(/\s+/).filter((w) => w.length > 4).slice(0, 2).join(' ').toUpperCase() || `ESCENA ${idx + 1}`);

        const wordsCnt = text.trim().split(/\s+/).length;
        const duration = Math.max(3.0, Math.min(6.0, wordsCnt * 0.27 + 1.4));

        return {
          id: idx + 1, text, title, world, lighting, role, action, hasSecond, secondRole, prop, icon, fx, camType,
          duration, words: buildWords(text, duration)
        };
      }

      function compileScript(rawText) {
        const trimmed = rawText.trim();
        if (!trimmed) return { scenes: [], seed: 1 };
        const seed = hashStr(trimmed);

        let blocks = trimmed.split(/\n+/).map((b) => b.trim()).filter(Boolean);
        if (blocks.length === 1) {
          const sents = trimmed.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [trimmed];
          blocks = sents.map((s) => s.trim()).filter(Boolean);
        }

        const scenes = [];
        for (let i = 0; i < blocks.length; i++) {
          scenes.push(analyzeSentence(blocks[i], i, blocks.length, seed, scenes[i - 1] || null));
        }
        return { scenes, seed };
      }

      return { PRESETS, WORLDS, compileScript };
    })();

    // =========================================================================
    // 3. MOTOR 2.5D DE 5 CAPAS CON LUCES, SOMBRAS Y 14 ESCENARIOS ÚNICOS
    // =========================================================================
    window.Engine25D = (() => {
      function rRect(ctx, x, y, w, h, r) {
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
        else {
          ctx.beginPath();
          ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
        }
      }

      function layerTransform(ctx, cam, z, fn) {
        ctx.save();
        ctx.translate(270 + cam.panX * z, 480 + cam.panY * z);
        const s = 1 + (cam.zoom - 1) * z;
        ctx.scale(s, s);
        ctx.translate(-270, -480);
        fn();
        ctx.restore();
      }

      // Suelo 2.5D con punto de fuga dinámico según cam.panX / cam.panY
      function drawPerspectiveGround(ctx, cam, yHoriz, colTop, colBot, gridCol, mode = 'tiles') {
        const vpX = 270 - cam.panX * 0.45;
        const g = ctx.createLinearGradient(0, yHoriz, 0, 960);
        g.addColorStop(0, colTop); g.addColorStop(1, colBot);
        ctx.fillStyle = g;
        ctx.fillRect(-350, yHoriz, 1240, 960 - yHoriz + 300);

        if (mode === 'road') {
          // Carretera asfaltada con aceras y líneas discontinuas
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.moveTo(vpX - 42, yHoriz); ctx.lineTo(vpX + 42, yHoriz);
          ctx.lineTo(660, 1080); ctx.lineTo(-120, 1080); ctx.closePath(); ctx.fill();

          ctx.strokeStyle = '#facc15'; ctx.lineWidth = 4;
          ctx.setLineDash([28, 24]);
          ctx.beginPath(); ctx.moveTo(vpX, yHoriz); ctx.lineTo(270, 1080); ctx.stroke();
          ctx.setLineDash([]);
        } else if (mode === 'tracks') {
          // Vías del tren en perspectiva
          ctx.fillStyle = '#292524';
          ctx.beginPath();
          ctx.moveTo(vpX - 50, yHoriz); ctx.lineTo(vpX + 50, yHoriz);
          ctx.lineTo(640, 1080); ctx.lineTo(-100, 1080); ctx.closePath(); ctx.fill();

          ctx.strokeStyle = '#78350f'; ctx.lineWidth = 8;
          for (let f = 0.08; f <= 1; f += 0.12) {
            const y = yHoriz + (1050 - yHoriz) * f * f;
            const hw = 40 + f * f * 240;
            const cx = vpX + (270 - vpX) * f * f;
            ctx.beginPath(); ctx.moveTo(cx - hw, y); ctx.lineTo(cx + hw, y); ctx.stroke();
          }
          ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(vpX - 24, yHoriz); ctx.lineTo(80, 1080); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(vpX + 24, yHoriz); ctx.lineTo(460, 1080); ctx.stroke();
        } else if (mode === 'tiles' || mode === 'turf') {
          ctx.strokeStyle = gridCol; ctx.lineWidth = 2;
          for (let i = -8; i <= 8; i++) {
            ctx.beginPath(); ctx.moveTo(vpX + i * 35, yHoriz); ctx.lineTo(270 + i * 165, 1080); ctx.stroke();
          }
          [0.08, 0.2, 0.36, 0.58, 0.85].forEach((f) => {
            const y = yHoriz + (960 - yHoriz) * f;
            ctx.beginPath(); ctx.moveTo(-350, y); ctx.lineTo(890, y); ctx.stroke();
          });
        }
      }

      // Cielo base según iluminación
      function drawSky(ctx, lighting, cam, world, t) {
        const palettes = {
          day: ['#0284c7', '#bae6fd', '#fef08a'],
          sunset: ['#7c2d12', '#fb923c', '#fde047'],
          night: ['#040712', '#172554', '#fef9c3'],
          neon: ['#09061a', '#2e1065', '#22d3ee'],
          fire: ['#450a0a', '#c2410c', '#fde047']
        };
        const [top, bot, astro] = palettes[lighting] || palettes.day;
        const g = ctx.createLinearGradient(0, 0, 0, 720);
        g.addColorStop(0, top); g.addColorStop(1, bot);
        ctx.fillStyle = g; ctx.fillRect(-300, -200, 1140, 1300);

        if (world === 'outer_space') {
          // Planeta anillado enorme
          ctx.save(); ctx.translate(340, 260);
          const pg = ctx.createRadialGradient(-30, -30, 15, 0, 0, 110);
          pg.addColorStop(0, '#fb7185'); pg.addColorStop(1, '#4c0519');
          ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0, 0, 105, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = 'rgba(253, 224, 71, 0.65)'; ctx.lineWidth = 14;
          ctx.beginPath(); ctx.ellipse(0, 0, 185, 38, -0.25, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        } else {
          const sx = 370 - cam.panX * 0.25, sy = 190 - cam.panY * 0.25;
          const glow = ctx.createRadialGradient(sx, sy, 12, sx, sy, 140);
          glow.addColorStop(0, astro); glow.addColorStop(0.35, astro); glow.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sx, sy, 140, 0, Math.PI * 2); ctx.fill();
        }

        if (lighting === 'night' || lighting === 'neon' || world === 'outer_space') {
          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < 40; i++) {
            const x = ((i * 113) % 720) - 90, y = (i * 67) % 520;

          });

              }

              ctx.fillStyle = '#facc15';

            } else if (w === 'prison') {

          } else if (w === 'desert' || w === 'volcano') {

            });

      function drawVehicleOrProp(ctx, sc, t, sceneTime) {

        if (p === 'car') {
          const cx = sc.action === 'run' ? 220 + sceneTime * 45 : 340;
          const cy = 675;
          ctx.fillStyle = 'rgba(0,0,0,0.4)';

          rRect(ctx, cx - 110, cy - 22, 220, 56, 16); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#bae6fd';
          rRect(ctx, cx - 65, cy - 62, 130, 44, 14); ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#18181b';
          [cx - 68, cx + 68].forEach((wx) => { ctx.beginPath(); ctx.arc(wx, cy + 34, 24, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });

        } else if (p === 'train') {

          rRect(ctx, tx - 140, ty - 95, 280, 145, 16); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#1e293b'; ctx.fillRect(tx - 120, ty - 75, 240, 45);
          ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(tx - 80, ty + 10, 18, 0, Math.PI * 2); ctx.fill();
        } else if (p === 'helicopter') {
          const hx = 340, hy = 350 + Math.sin(t * 3) * 14;
          ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#141720'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.ellipse(hx, hy, 85, 42, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillRect(hx + 65, hy - 10, 95, 18); ctx.strokeRect(hx + 65, hy - 10, 95, 18);
          ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 6;
          const blade = Math.cos(t * 28) * 140;
          ctx.beginPath(); ctx.moveTo(hx - blade, hy - 54); ctx.lineTo(hx + blade, hy - 54); ctx.stroke();
        } else if (p === 'boat') {
          const bx = 330, by = 650 + Math.sin(t * 2.6) * 12;
          ctx.fillStyle = '#78350f'; ctx.strokeStyle = '#141720'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(bx - 120, by); ctx.lineTo(bx + 120, by); ctx.lineTo(bx + 85, by + 55); ctx.lineTo(bx - 85, by + 55); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#f8fafc'; ctx.fillRect(bx - 45, by - 45, 90, 45); ctx.strokeRect(bx - 45, by - 45, 90, 45);
        } else if (p === 'rocket') {
          const rx = 350, ry = 540 - (sc.fx === 'fire' ? sceneTime * 35 : 0);
          ctx.fillStyle = '#f8fafc'; ctx.strokeStyle = '#141720'; ctx.lineWidth = 4;
          rRect(ctx, rx - 38, ry - 110, 76, 170, 34); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#ef4444';
          ctx.beginPath(); ctx.moveTo(rx - 38, ry - 60); ctx.lineTo(rx, ry - 145); ctx.lineTo(rx + 38, ry - 60); ctx.closePath(); ctx.fill(); ctx.stroke();
        } else if (p === 'gold') {
          ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#141720'; ctx.lineWidth = 4;
          for (let i = 0; i < 5; i++) {
            ctx.fillRect(310 + (i % 3) * 44, 670 - Math.floor(i / 3) * 24, 40, 20);
            ctx.strokeRect(310 + (i % 3) * 44, 670 - Math.floor(i / 3) * 24, 40, 20);
          }
        }
        ctx.restore();
      }

      // Personaje expresivo con sombra proyectada y luz de borde
      function drawCharacter(ctx, x, y, scale, cfg, t, lighting) {
        const { role, action, icon, flip } = cfg;
        const isRun = action === 'run';
        const isCeleb = action === 'celebrate';
        const legSwing = isRun ? Math.sin(t * 16) * 26 : 0;
        const bob = isRun ? Math.abs(Math.sin(t * 16)) * 14 : isCeleb ? Math.abs(Math.sin(t * 10)) * 18 : Math.sin(t * 3.5) * 2;

        ctx.save();
        ctx.translate(x, y);

        // Sombra direccional proyectada en el suelo
        ctx.fillStyle = 'rgba(0,0,0,0.42)';
        ctx.beginPath(); ctx.ellipse(18 * scale, 6, 56 * scale, 14 * scale, 0, 0, Math.PI * 2); ctx.fill();

        ctx.translate(0, -bob * scale);
        ctx.scale(scale * (flip ? -1 : 1), scale);

        const coats = {
          casual: '#3b82f6', chef: '#ffffff', police: '#1e3a8a', hacker: '#312e81',
          astronaut: '#e2e8f0', scientist: '#f8fafc', monarch: '#6b21a8',
          prisoner: '#f97316', suit: '#1e293b', worker: '#d97706', explorer: '#92400e'
        };
        const coat = coats[role] || '#3b82f6';

        ctx.strokeStyle = '#141720'; ctx.lineWidth = 8; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-14, -46); ctx.lineTo(-16 + legSwing, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(14, -46); ctx.lineTo(16 - legSwing, 0); ctx.stroke();

        ctx.fillStyle = coat; ctx.lineWidth = 5;
        rRect(ctx, -32, -125, 64, 82, 20); ctx.fill(); ctx.stroke();

        // Luz de borde (Rim light) en lado iluminado
        ctx.strokeStyle = lighting === 'neon' ? '#22d3ee' : 'rgba(255,250,210,0.45)';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-28, -116); ctx.lineTo(-28, -50); ctx.stroke();

        ctx.strokeStyle = '#141720'; ctx.lineWidth = 7;
        if (isCeleb) {
          ctx.beginPath(); ctx.moveTo(-30, -108); ctx.lineTo(-56, -162); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(30, -108); ctx.lineTo(56, -162); ctx.stroke();
        } else {
          const w = isRun ? Math.sin(t * 16) * 20 : Math.sin(t * 4) * 6;
          ctx.beginPath(); ctx.moveTo(-30, -108); ctx.quadraticCurveTo(-55, -80 + w, -42, -55); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(30, -108); ctx.quadraticCurveTo(55, -85 - w, 46, -105 - w); ctx.stroke();
        }

        // Cabeza cel-shaded
        ctx.save();
        ctx.translate(0, -172);
        const hg = ctx.createRadialGradient(-18, -20, 8, 0, 0, 54);
        hg.addColorStop(0, '#ffffff'); hg.addColorStop(0.7, '#faf4ec'); hg.addColorStop(1, '#c7bdb2');
        ctx.fillStyle = hg; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        if (role === 'chef') {
          ctx.fillStyle = '#ffffff';
          rRect(ctx, -34, -84, 68, 42, 10); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(0, -82, 36, Math.PI, 0); ctx.fill(); ctx.stroke();
        } else if (role === 'police') {
          ctx.fillStyle = '#1e3a8a'; rRect(ctx, -40, -68, 80, 32, 8); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(0, -52, 7, 0, Math.PI * 2); ctx.fill();
        } else if (role === 'astronaut') {
          ctx.strokeStyle = '#38bdf8'; ctx.fillStyle = 'rgba(56, 189, 248, 0.25)'; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else if (role === 'hacker') {
          ctx.fillStyle = '#22d3ee'; rRect(ctx, -34, -14, 68, 18, 6); ctx.fill(); ctx.stroke();
        } else {
          ctx.fillStyle = '#27272a';
          ctx.beginPath(); ctx.arc(0, -16, 48, Math.PI * 1.05, Math.PI * 1.95); ctx.quadraticCurveTo(0, -32, -46, -16); ctx.fill();
        }

        if (role !== 'hacker') {
          ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#141720'; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.arc(-16, -4, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(16, -4, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#141720';
          ctx.beginPath(); ctx.arc(-14, -4, action === 'alarm' ? 3 : 4.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(18, -4, action === 'alarm' ? 3 : 4.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.strokeStyle = '#141720'; ctx.lineWidth = 4;
        if (action === 'alarm' || action === 'fight') {
          ctx.fillStyle = '#7f1d1d'; ctx.beginPath(); ctx.ellipse(0, 22, 10, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(0, 16, 12, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
        }

        if (icon && !flip) {
          ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = '#141720'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(64, -76, 30, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.font = '32px system-ui, Apple Color Emoji, Segoe UI Emoji';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(icon, 64, -74);
        }

        ctx.restore();
        ctx.restore();
      }

      function drawLightingAndForeground(ctx, sc, cam, t) {
        // Capa z = 1.35: elementos en primer plano y conos de luz
        layerTransform(ctx, cam, 1.35, () => {
          if (sc.world === 'prison') {
            ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#09090b'; ctx.lineWidth = 4;
            for (let bx = 70; bx <= 470; bx += 100) {
              ctx.fillRect(bx, -50, 14, 1060); ctx.strokeRect(bx, -50, 14, 1060);
            }
          } else if (sc.world === 'city_street' && (sc.lighting === 'night' || sc.lighting === 'neon')) {
            // Farolas en primer plano con cono de luz cálida
            [40, 500].forEach((lx) => {
              ctx.fillStyle = '#1e293b'; ctx.fillRect(lx - 6, 220, 12, 740);
              ctx.save(); ctx.globalCompositeOperation = 'lighter';
              const g = ctx.createRadialGradient(lx, 240, 10, lx, 440, 240);
              g.addColorStop(0, 'rgba(254, 240, 138, 0.38)'); g.addColorStop(1, 'rgba(254, 240, 138, 0)');
              ctx.fillStyle = g; ctx.fillRect(lx - 240, 180, 480, 600);
              ctx.restore();
            });
          }
        });

        // Luces globales volumétricas y clima
        ctx.save();
        if (sc.world === 'kitchen' || sc.world === 'hacker_office' || sc.world === 'bank_vault') {
          ctx.globalCompositeOperation = 'lighter';
          const col = sc.world === 'hacker_office' ? 'rgba(34, 211, 238, 0.22)' : 'rgba(254, 240, 138, 0.24)';
          const g = ctx.createRadialGradient(270, 90, 10, 270, 520, 460);
          g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, 540, 960);
        }

        if (sc.fx === 'siren') {
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = Math.sin(t * 14) > 0 ? 'rgba(239, 68, 68, 0.18)' : 'rgba(59, 130, 246, 0.18)';
          ctx.fillRect(0, 0, 540, 960);
        } else if (sc.fx === 'fire' || sc.fx === 'explosion') {
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = 'rgba(251, 146, 60, 0.8)';
          for (let i = 0; i < 24; i++) {
            const fx = ((i * 79 + Math.sin(t * 5 + i) * 35) % 540);
            const fy = 820 - ((i * 63 + t * 240) % 680);
            ctx.beginPath(); ctx.arc(fx, fy, 4 + (i % 6), 0, Math.PI * 2); ctx.fill();
          }
        } else if (sc.fx === 'rain') {
          ctx.strokeStyle = 'rgba(186, 230, 253, 0.55)'; ctx.lineWidth = 2;
          for (let i = 0; i < 34; i++) {
            const rx = (i * 53 + t * 60) % 540, ry = (i * 97 + t * 520) % 960;
            ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 8, ry + 24); ctx.stroke();
          }
        } else if (sc.fx === 'sparkles' || sc.action === 'celebrate') {
          ctx.fillStyle = '#fde047';
          for (let i = 0; i < 22; i++) ctx.fillRect((i * 89 + t * 80) % 540, (i * 67 + t * 180) % 860, 7, 7);
        }
        ctx.restore();
      }

      function drawFrame(ctx, canvasW, canvasH, { t, scene, sceneTime, showSubtitles }) {
        ctx.save();
        ctx.clearRect(0, 0, canvasW, canvasH);
        ctx.scale(canvasW / 540, canvasH / 960);

        if (!scene) {
          ctx.fillStyle = '#0f131d'; ctx.fillRect(0, 0, 540, 960);
          ctx.restore(); return;
        }

        const p = Math.min(1, sceneTime / Math.max(0.5, scene.duration));
        const easeP = 1 - Math.pow(1 - p, 2.2);

        // Cámara 2.5D con desplazamiento real de parallax
        const cam = { zoom: 1.0, panX: 0, panY: 0 };
        if (scene.camType === 'dolly_zoom_in') {
          cam.zoom = 1.0 + easeP * 0.24;
          cam.panY = 40 - easeP * 60;
        } else if (scene.camType === 'pan_left') {
          cam.zoom = 1.12;
          cam.panX = 95 - p * 190;
        } else if (scene.camType === 'pan_right') {
          cam.zoom = 1.12;
          cam.panX = -95 + p * 190;
        } else if (scene.camType === 'crane_down') {
          cam.zoom = 1.18 - easeP * 0.14;
          cam.panY = 85 - easeP * 110;
        } else if (scene.camType === 'chase_track') {
          cam.zoom = 1.15;
          cam.panX = -110 + p * 220;
          cam.panY = Math.sin(t * 14) * 5;
        } else if (scene.camType === 'impact_shake') {
          const shk = sceneTime < 1.2 ? (1 - sceneTime / 1.2) * 14 : 0;
          cam.zoom = 1.14 + p * 0.08;
          cam.panX = Math.sin(t * 50) * shk;
          cam.panY = Math.cos(t * 44) * shk;
        }

        // 1-3: Cielo, fondo, suelo 3D y props de entorno
        drawWorldBackdropAndProps(ctx, scene, cam, t, sceneTime);

        // 4: Escenario principal (vehículo/prop + personajes en z = 1.0)
        layerTransform(ctx, cam, 1.0, () => {
          drawVehicleOrProp(ctx, scene, t, sceneTime);

          const charX = scene.prop !== 'none' ? 165 : (scene.hasSecond ? 175 : 270);
          const moveX = scene.action === 'run' ? charX + Math.sin(sceneTime * 2) * 35 : charX;
          drawCharacter(ctx, moveX, 710, 0.92, { role: scene.role, action: scene.action, icon: scene.icon }, t, scene.lighting);

          if (scene.hasSecond) {
            drawCharacter(ctx, 375, 705, 0.88, { role: scene.secondRole, action: scene.action === 'fight' ? 'fight' : 'alarm', icon: '', flip: true }, t, scene.lighting);
          }
        });

        // 5: Primer plano, luces volumétricas y partículas
        drawLightingAndForeground(ctx, scene, cam, t);

        // Viñeta cinemática
        const vig = ctx.createRadialGradient(270, 480, 175, 270, 480, 560);
        vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.44)');
        ctx.fillStyle = vig; ctx.fillRect(0, 0, 540, 960);

        if (sceneTime < 0.14) {
          ctx.fillStyle = `rgba(255,255,255,${0.22 * (1 - sceneTime / 0.14)})`;
          ctx.fillRect(0, 0, 540, 960);
        }

        // Rótulo superior
        if (scene.title) {
          ctx.save();
          ctx.font = '900 22px system-ui, sans-serif';
          const tw = ctx.measureText(scene.title).width;
          ctx.fillStyle = 'rgba(10, 14, 24, 0.72)';
          rRect(ctx, 270 - tw / 2 - 16, 34, tw + 32, 38, 12); ctx.fill();
          ctx.fillStyle = '#fde047'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(scene.title, 270, 53);
          ctx.restore();
        }

        // Subtítulos opcionales
        if (showSubtitles && scene.words && scene.words.length) {
          let idx = 0;
          for (let i = 0; i < scene.words.length; i++) { if (sceneTime >= scene.words[i].start) idx = i; }
          const start = Math.floor(idx / 2) * 2;
          const line = scene.words.slice(start, start + 2).map((w) => w.word).join(' ');
          ctx.save();
          ctx.font = '900 36px "Arial Black", Impact, system-ui, sans-serif';
          const w = ctx.measureText(line).width;
          const s = w > 460 ? 460 / w : 1;
          ctx.translate(270, 775); ctx.scale(s, s);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.lineJoin = 'round'; ctx.lineWidth = 9; ctx.strokeStyle = '#09090b';
          ctx.strokeText(line, 0, 0); ctx.fillStyle = '#ffffff'; ctx.fillText(line, 0, 0);
          ctx.restore();
        }

        ctx.restore();
      }

      return { drawFrame };
    })();

    // =========================================================================
    // 4. EXPORTADOR MP4 DETERMINISTA
    // =========================================================================
    window.ExporterMP4 = (() => {
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function pickVideoConfig(width, height, fps) {
        for (const codec of ['avc1.64002a', 'avc1.4d002a', 'avc1.42002a', 'avc1.42001f']) {
          const cfg = { codec, width, height, bitrate: width >= 1080 ? 5_800_000 : 3_400_000, framerate: fps };
          if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg;
        }
        return null;
      }

      async function pickAudioConfig(sampleRate) {
        for (const c of [{ codec: 'mp4a.40.2', mux: 'aac' }, { codec: 'opus', mux: 'opus' }]) {
          const cfg = { codec: c.codec, numberOfChannels: 2, sampleRate, bitrate: 128000 };
          if ((await AudioEncoder.isConfigSupported(cfg)).supported) return { cfg, mux: c.mux };
        }
        return null;
      }

      async function exportWithMediaRecorderFallback(opts) {
        const { scenes, masterBuffer, totalDuration, width, height, fps, showSubtitles, onProgress } = opts;
        const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        const audioCtx = window.AudioEngine.ensureLiveContext();
        const dest = audioCtx.createMediaStreamDestination();
        const src = audioCtx.createBufferSource(); src.buffer = masterBuffer; src.connect(dest);
        const stream = new MediaStream([...canvas.captureStream(fps).getVideoTracks(), ...dest.stream.getAudioTracks()]);
        const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4_500_000 });
        const chunks = [];
        rec.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

        return new Promise((resolve) => {
          rec.onstop = () => resolve({ blob: new Blob(chunks, { type: mime }), ext: mime.includes('mp4') ? 'mp4' : 'webm' });
          const startT = audioCtx.currentTime + 0.05;
          rec.start(); src.start(startT);
          const tick = () => {
            const elapsed = Math.max(0, audioCtx.currentTime - startT);
            if (elapsed >= totalDuration) { rec.stop(); try { src.stop(); } catch (_) {} return; }
            let active = scenes[scenes.length - 1];
            for (const s of scenes) { if (elapsed >= s.startTime && elapsed < s.startTime + s.duration) { active = s; break; } }
            window.Engine25D.drawFrame(ctx, width, height, { t: elapsed, scene: active, sceneTime: Math.max(0, elapsed - active.startTime), showSubtitles });
            if (onProgress) onProgress(Math.min(0.98, elapsed / totalDuration), `Grabando vídeo (${elapsed.toFixed(1)}s)...`);
            requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        });
      }

      async function exportToMP4(opts) {
        const { scenes, masterBuffer, totalDuration, width, height, fps, showSubtitles, onProgress } = opts;
        if (onProgress) onProgress(0.02, 'Cargando empaquetador MP4...');
        const hasMuxer = await ensureMp4MuxerLoaded();
        const hasWebCodecs = typeof VideoEncoder !== 'undefined' && typeof AudioEncoder !== 'undefined';

        if (!hasMuxer || !hasWebCodecs) return await exportWithMediaRecorderFallback(opts);
        const vConfig = await pickVideoConfig(width, height, fps);
        const aChoice = await pickAudioConfig(masterBuffer.sampleRate);
        if (!vConfig || !aChoice) return await exportWithMediaRecorderFallback(opts);

        const muxer = new Mp4Muxer.Muxer({
          target: new Mp4Muxer.ArrayBufferTarget(),
          video: { codec: 'avc', width, height },
          audio: { codec: aChoice.mux, numberOfChannels: 2, sampleRate: masterBuffer.sampleRate },
          fastStart: 'in-memory'
        });

        const videoEncoder = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: console.error });
        videoEncoder.configure(vConfig);
        const audioEncoder = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: console.error });
        audioEncoder.configure(aChoice.cfg);

        if (onProgress) onProgress(0.06, 'Codificando música y SFX...');
        const sr = masterBuffer.sampleRate;
        const ch0 = masterBuffer.getChannelData(0), ch1 = masterBuffer.getChannelData(1);
        for (let offset = 0; offset < ch0.length; offset += 2048) {
          const n = Math.min(2048, ch0.length - offset);
          const planar = new Float32Array(n * 2);
          planar.set(ch0.subarray(offset, offset + n), 0);
          planar.set(ch1.subarray(offset, offset + n), n);
          const ad = new AudioData({
            format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: 2,
            timestamp: Math.round((offset * 1_000_000) / sr), data: planar
          });
          while (audioEncoder.encodeQueueSize > 16) await sleep(4);
          audioEncoder.encode(ad); ad.close();
        }

        const offCanvas = document.createElement('canvas'); offCanvas.width = width; offCanvas.height = height;
        const offCtx = offCanvas.getContext('2d');
        const totalFrames = Math.ceil(totalDuration * fps);
        const frameDurUs = Math.round(1_000_000 / fps);

        for (let f = 0; f < totalFrames; f++) {
          const t = f / fps;
          let active = scenes[scenes.length - 1];
          for (const s of scenes) { if (t >= s.startTime && t < s.startTime + s.duration) { active = s; break; } }
          window.Engine25D.drawFrame(offCtx, width, height, { t, scene: active, sceneTime: Math.max(0, t - active.startTime), showSubtitles });

          const frame = new VideoFrame(offCanvas, { timestamp: Math.round((f * 1_000_000) / fps), duration: frameDurUs });
          while (videoEncoder.encodeQueueSize > 8) await sleep(6);
          videoEncoder.encode(frame, { keyFrame: f % (fps * 2) === 0 });
          frame.close();

          if (f % 10 === 0 && onProgress) {
            onProgress(0.1 + 0.85 * (f / totalFrames), `Renderizando 2.5D (${f}/${totalFrames})...`);
            await sleep(0);
          }
        }

        if (onProgress) onProgress(0.96, 'Finalizando MP4...');
        await audioEncoder.flush(); await videoEncoder.flush(); muxer.finalize();
        return { blob: new Blob([muxer.target.buffer], { type: 'video/mp4' }), ext: 'mp4' };
      }

      return { exportToMP4 };
    })();

      if (typeof VideoEncoder !== 'undefined' && typeof AudioEncoder !== 'undefined') {
        el.codecSupportBadge.textContent = '✓ WebCodecs MP4 2.5D listo';
        el.codecSupportBadge.style.color = '#6ee7b7';
      } else {
        el.codecSupportBadge.textContent = '✓ Modo Grabación Directa';
        el.codecSupportBadge.style.color = '#fde047';
      }

      ensureMp4MuxerLoaded();
      const setStatus = (m) => { el.statusBanner.textContent = m; };

      function renderSummary() {
        el.sceneCount.textContent = state.scenes.length;
        el.scenesSummary.innerHTML = '';

        const lights = ['day', 'sunset', 'night', 'neon', 'fire'];
        const props = ['none', 'car', 'train', 'helicopter', 'boat', 'rocket', 'gold'];
        const actions = ['idle', 'run', 'fight', 'celebrate', 'alarm', 'think'];

        state.scenes.forEach((sc, idx) => {
          const card = document.createElement('div');
          card.className = 'scene-pill';
          card.innerHTML = `
            <strong>Escena #${idx + 1} · ${sc.title}</strong>
            <p></p>
            <div class="grid-4">
              <label>Mundo<select class="ed-world">${window.SemanticDirector.WORLDS.map((w) => `<option value="${w}">${w}</option>`).join('')}</select></label>
              <label>Luz<select class="ed-light">${lights.map((l) => `<option value="${l}">${l}</option>`).join('')}</select></label>
              <label>Objeto<select class="ed-prop">${props.map((p) => `<option value="${p}">${p}</option>`).join('')}</select></label>
              <label>Acción<select class="ed-act">${actions.map((a) => `<option value="${a}">${a}</option>`).join('')}</select></label>
            </div>
          `;
          card.querySelector('p').textContent = sc.text;
          card.querySelector('.ed-world').value = sc.world;
          card.querySelector('.ed-light').value = sc.lighting;
          card.querySelector('.ed-prop').value = sc.prop;
          card.querySelector('.ed-act').value = sc.action;

          card.querySelector('.ed-world').addEventListener('change', (e) => { sc.world = e.target.value; drawPreviewAt(state.playOffset); });
          card.querySelector('.ed-light').addEventListener('change', (e) => { sc.lighting = e.target.value; drawPreviewAt(state.playOffset); });
          card.querySelector('.ed-prop').addEventListener('change', (e) => { sc.prop = e.target.value; drawPreviewAt(state.playOffset); });
          card.querySelector('.ed-act').addEventListener('change', (e) => { sc.action = e.target.value; drawPreviewAt(state.playOffset); });

          el.scenesSummary.appendChild(card);
        });
      }

      async function rebuildShort() {
        stopPlayback();
        const raw = el.storyInput.value.trim();
        if (!raw) return;

        const compiled = window.SemanticDirector.compileScript(raw);
        state.scenes = compiled.scenes;
        state.seed = compiled.seed;

        let cursor = 0;
        state.scenes.forEach((sc) => { sc.startTime = cursor; cursor += sc.duration; });
        state.totalDuration = Math.max(1.0, cursor + 0.25);
        state.playOffset = 0;

        el.timelineScrubber.max = state.totalDuration.toFixed(2);
        updateTimeLabel(0);
        drawPreviewAt(0);
        renderSummary();

        state.masterBuffer = await window.AudioEngine.renderAudioMix({
          scenes: state.scenes, totalDuration: state.totalDuration,
          enableMusic: el.musicToggle.checked, enableSFX: el.sfxToggle.checked, seedVal: state.seed
        });

        setStatus(`✓ ${state.scenes.length} escenas creadas desde tu guion (${state.totalDuration.toFixed(1)}s).`);
      }

      function updateTimeLabel(t) {
        el.timeDisplay.textContent = `${t.toFixed(1)}s / ${state.totalDuration.toFixed(1)}s`;
        el.timelineScrubber.value = Math.min(state.totalDuration, t);
      }

      function drawPreviewAt(t) {
        if (!state.scenes.length) {
          window.Engine25D.drawFrame(previewCtx, el.previewCanvas.width, el.previewCanvas.height, { t: 0, scene: null, sceneTime: 0 });
          return;
        }
        let active = state.scenes[state.scenes.length - 1];
        for (const s of state.scenes) { if (t >= s.startTime && t < s.startTime + s.duration) { active = s; break; } }

        window.Engine25D.drawFrame(previewCtx, el.previewCanvas.width, el.previewCanvas.height, {
          t, scene: active, sceneTime: Math.max(0, t - active.startTime),
          showSubtitles: el.subtitleModeSelect.value === 'on'
        });
      }

      function stopPlayback() {
        state.isPlaying = false;
        el.playPauseBtn.textContent = '▶ Reproducir Preview';
        if (state.activeSourceNode) { try { state.activeSourceNode.stop(); } catch (_) {} state.activeSourceNode = null; }
        if (state.rafId) cancelAnimationFrame(state.rafId);
      }

      async function startPlayback() {
        if (!state.scenes.length || !state.masterBuffer) return;
        const ctx = window.AudioEngine.ensureLiveContext();
        if (state.playOffset >= state.totalDuration - 0.05) state.playOffset = 0;

        const src = ctx.createBufferSource(); src.buffer = state.masterBuffer; src.connect(ctx.destination);
        const startAt = ctx.currentTime + 0.04;
        src.start(startAt, state.playOffset);
        state.activeSourceNode = src;
        state.audioStartTime = startAt - state.playOffset;
        state.isPlaying = true;
        el.playPauseBtn.textContent = '⏸ Pausar';

        const loop = () => {
          if (!state.isPlaying) return;
          const elapsed = Math.max(0, ctx.currentTime - state.audioStartTime);
          state.playOffset = elapsed;
          if (elapsed >= state.totalDuration) {
            stopPlayback(); state.playOffset = 0; updateTimeLabel(0); drawPreviewAt(0); return;
          }
          drawPreviewAt(elapsed); updateTimeLabel(elapsed);
          state.rafId = requestAnimationFrame(loop);
        };
        state.rafId = requestAnimationFrame(loop);
      }

      el.loadPresetBtn.addEventListener('click', () => {
        el.storyInput.value = window.SemanticDirector.PRESETS[el.presetSelect.value] || '';
        rebuildShort();
      });

      el.buildShortBtn.addEventListener('click', rebuildShort);

      [el.musicToggle, el.sfxToggle].forEach((n) => {
        n.addEventListener('change', async () => {
          if (!state.scenes.length) return;
          state.masterBuffer = await window.AudioEngine.renderAudioMix({
            scenes: state.scenes, totalDuration: state.totalDuration,
            enableMusic: el.musicToggle.checked, enableSFX: el.sfxToggle.checked, seedVal: state.seed
          });
        });
      });

      el.subtitleModeSelect.addEventListener('change', () => drawPreviewAt(state.playOffset));

      el.playPauseBtn.addEventListener('click', () => {
        if (state.isPlaying) stopPlayback(); else startPlayback();
      });

      el.restartBtn.addEventListener('click', () => {
        stopPlayback(); state.playOffset = 0; updateTimeLabel(0); drawPreviewAt(0);
      });

      el.timelineScrubber.addEventListener('input', (e) => {
        stopPlayback(); state.playOffset = parseFloat(e.target.value);
        updateTimeLabel(state.playOffset); drawPreviewAt(state.playOffset);
      });

      el.exportMp4Btn.addEventListener('click', async () => {
        if (!state.scenes.length || !state.masterBuffer) return alert('Primero crea el Short.');
        stopPlayback();

        const [w, h] = el.resolutionSelect.value.split('x').map(Number);
        const fps = parseInt(el.fpsSelect.value, 10);

        el.exportMp4Btn.disabled = true;
        el.exportProgressWrap.classList.remove('hidden');
        el.exportResultWrap.classList.add('hidden');

        try {
          const { blob, ext } = await window.ExporterMP4.exportToMP4({
            scenes: state.scenes, masterBuffer: state.masterBuffer,
            totalDuration: state.totalDuration, width: w, height: h, fps,
            showSubtitles: el.subtitleModeSelect.value === 'on',
            onProgress: (ratio, msg) => {
              el.exportProgressBar.style.width = `${Math.round(ratio * 100)}%`;
              el.exportProgressText.textContent = msg;
            }
          });

          if (state.lastExportUrl) URL.revokeObjectURL(state.lastExportUrl);
          const url = URL.createObjectURL(blob);
          state.lastExportUrl = url;
          el.exportedVideoPreview.src = url;
          el.downloadMp4Link.href = url;
          el.downloadMp4Link.download = `short-25d.${ext}`;
          el.exportResultWrap.classList.remove('hidden');
          setStatus(`¡MP4 exportado (${(blob.size / 1024 / 1024).toFixed(2)} MB) en .${ext}!`);
        } catch (err) {
          alert('Error al exportar: ' + err.message);
          setStatus('Error exportando: ' + err.message);
        } finally {
          el.exportMp4Btn.disabled = false;
          el.exportProgressWrap.classList.add('hidden');
        }
      });

      el.storyInput.value = window.SemanticDirector.PRESETS.cocinero;
      rebuildShort();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        try { initApp(); } catch (e) {
          document.getElementById('codecSupportBadge').textContent = 'Error JS: ' + e.message;
        }
      });
    } else {
      try { initApp(); } catch (e) {
        document.getElementById('codecSupportBadge').textContent = 'Error JS: ' + e.message;
      }
    }
  </script>
</body>
</html>
