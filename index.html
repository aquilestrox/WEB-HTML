<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow Pro - Dashboard de Productividad</title>
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 10% 20%, #171b2f 0%, #0c0f1d 90%);
      --card-bg: rgba(26, 33, 56, 0.65);
      --card-hover: rgba(35, 45, 75, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-glow: rgba(99, 102, 241, 0.35);
      --input-bg: rgba(15, 23, 42, 0.6);
      
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --accent-hover: #4f46e5;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #f43f5e;
      --prio-high: #f43f5e;
      --prio-med: #f59e0b;
      --prio-low: #10b981;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-glass: 0 10px 30px -5px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.08);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Scrollbars elegantes */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* === HEADER === */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0.8rem 1.2rem;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glass);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-gradient);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .brand h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .sound-btn {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .sound-btn.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent);
      color: #a5b4fc;
    }

    .sound-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .backup-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 0.8rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .backup-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    /* === DASHBOARD GRID === */
    .dashboard {
      display: grid;
      grid-template-columns: 330px 1.2fr 380px;
      gap: 1.5rem;
      flex: 1;
    }

    @media (max-width: 1200px) {
      .dashboard {
        grid-template-columns: 1fr 1fr;
      }
      .col-notes-habits {
        grid-column: span 2;
      }
    }

    @media (max-width: 820px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .col-notes-habits {
        grid-column: span 1;
      }
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 1.4rem;
      box-shadow: var(--shadow-glass);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      position: relative;
      transition: border 0.3s ease;
    }

    .glass-card:hover {
      border-color: var(--card-border-glow);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      color: var(--text-main);
    }

    .card-title i {
      color: var(--accent);
    }

    /* === COLUMNA 1: POMODORO & HABITS === */
    .timer-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-modes {
      display: flex;
      background: var(--input-bg);
      padding: 4px;
      border-radius: var(--radius-md);
      gap: 4px;
      width: 100%;
      border: 1px solid var(--card-border);
    }

    .timer-mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 0.4rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .timer-mode-btn.active {
      background: var(--accent-gradient);
      color: white;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
    }

    .timer-clock {
      position: relative;
      margin: 1.5rem 0;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-clock svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-clock circle {
      fill: none;
      stroke-width: 8;
    }

    .clock-bg {
      stroke: rgba(255, 255, 255, 0.05);
    }

    .clock-progress {
      stroke: var(--accent);
      stroke-linecap: round;
      stroke-dasharray: 502;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.3s;
    }

    .timer-numbers {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      z-index: 2;
    }

    .timer-btns {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }

    .btn {
      padding: 0.7rem 1.2rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      border: none;
      transition: var(--transition);
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
      flex: 1;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: var(--card-hover);
      color: var(--text-main);
    }

    /* === HABIT TRACKER === */
    .habits-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 230px;
      overflow-y: auto;
    }

    .habit-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-md);
      transition: var(--transition);
    }

    .habit-item:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .habit-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .habit-check {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      color: transparent;
      font-size: 0.75rem;
    }

    .habit-item.done .habit-check {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .habit-name {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .habit-streak {
      font-size: 0.75rem;
      color: #fb923c;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .habit-form {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .habit-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 0.5rem 0.8rem;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 0.85rem;
      outline: none;
    }

    /* === COLUMNA 2: CALENDARIO & NOTAS === */
    .calendar-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .calendar-nav h2 {
      font-size: 1.15rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .nav-controls {
      display: flex;
      gap: 0.4rem;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .icon-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .weekdays-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-dim);
      padding: 0.5rem 0;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-box {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-md);
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .day-box:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .day-box.outside {
      opacity: 0.25;
    }

    .day-box.today {
      border: 1.5px solid var(--accent);
      background: rgba(99, 102, 241, 0.08);
      font-weight: 800;
    }

    .day-box.selected {
      background: var(--accent-gradient);
      color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .day-box.selected .dot {
      background: #ffffff !important;
    }

    .day-number {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .dots-wrapper {
      display: flex;
      gap: 3px;
      margin-top: 2px;
      justify-content: center;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    .dot.done {
      background: var(--success);
    }

    /* Quick Scratchpad */
    .scratchpad-textarea {
      width: 100%;
      height: 110px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 0.8rem;
      color: var(--text-main);
      font-size: 0.85rem;
      resize: none;
      outline: none;
      transition: var(--transition);
      line-height: 1.4;
    }

    .scratchpad-textarea:focus {
      border-color: var(--accent);
    }

    /* === COLUMNA 3: TAREAS DEL DÍA === */
    .agenda-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .agenda-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    .task-search-box {
      position: relative;
    }

    .task-search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .task-search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 0.5rem 0.8rem 0.5rem 2rem;
      border-radius: var(--radius-md);
      color: white;
      font-size: 0.8rem;
      outline: none;
    }

    .filter-tabs {
      display: flex;
      background: var(--input-bg);
      padding: 3px;
      border-radius: var(--radius-md);
      gap: 3px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
    }

    .task-form-modern {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: var(--input-bg);
      padding: 0.9rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
    }

    .task-inputs-row {
      display: flex;
      gap: 0.5rem;
    }

    input, select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      outline: none;
      transition: var(--transition);
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .task-list-modern {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      overflow-y: auto;
      max-height: 290px;
      padding-right: 2px;
    }

    .task-item-card {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .task-item-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent);
    }

    .task-item-card.prio-Alta::before { background: var(--prio-high); }
    .task-item-card.prio-Media::before { background: var(--prio-med); }
    .task-item-card.prio-Baja::before { background: var(--prio-low); }

    .task-item-card:hover {
      background: var(--card-hover);
      transform: translateX(2px);
    }

    .task-item-card.completed {
      opacity: 0.5;
    }

    .task-item-card.completed .task-desc {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-left-content {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      overflow: hidden;
    }

    .custom-check {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1.5px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .task-item-card.completed .custom-check {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .task-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .task-desc {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta-tags {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .badge-cat {
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .del-task-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      transition: var(--transition);
    }

    .del-task-btn:hover {
      color: var(--danger);
    }

    /* Modal / Hidden File Input */
    #import-file-input { display: none; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <i class="fa-solid fa-bolt-lightning"></i>
      </div>
      <div>
        <h1>FocusFlow Pro</h1>
      </div>
    </div>

    <div class="header-actions">
      <!-- Generador de Sonido Ambiente WebAudio -->
      <button class="sound-btn" id="sound-btn" onclick="toggleAmbientSound()">
        <i class="fa-solid fa-headphones"></i>
        <span id="sound-btn-text">Sonido Focus</span>
      </button>

      <!-- Respaldo de Datos -->
      <button class="backup-btn" onclick="exportData()" title="Descargar copia de seguridad en JSON">
        <i class="fa-solid fa-download"></i> Guardar
      </button>
      <button class="backup-btn" onclick="document.getElementById('import-file-input').click()" title="Restaurar copia">
        <i class="fa-solid fa-upload"></i> Restaurar
      </button>
      <input type="file" id="import-file-input" accept=".json" onchange="importData(event)">
    </div>
  </header>

  <!-- DASHBOARD PRINCIPAL -->
  <div class="dashboard">

    <!-- COLUMNA 1: POMODORO & HABITS -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
      <!-- Tarjeta Pomodoro -->
      <section class="glass-card timer-container">
        <div class="card-title" style="width: 100%;">
          <span><i class="fa-solid fa-stopwatch"></i> Temporizador Pomodoro</span>
          <span style="font-size: 0.8rem; color: var(--accent);" id="pomo-streak-badge">0 Sesiones 🔥</span>
        </div>

        <div class="timer-modes">
          <button class="timer-mode-btn active" onclick="setTimerMode('work')">Enfoque</button>
          <button class="timer-mode-btn" onclick="setTimerMode('shortBreak')">Corto (5m)</button>
          <button class="timer-mode-btn" onclick="setTimerMode('longBreak')">Largo (15m)</button>
        </div>

        <div class="timer-clock">
          <svg>
            <circle class="clock-bg" cx="90" cy="90" r="80"></circle>
            <circle class="clock-progress" id="clock-progress-ring" cx="90" cy="90" r="80"></circle>
          </svg>
          <div class="timer-numbers" id="timer-display">25:00</div>
        </div>

        <div class="timer-btns">
          <button class="btn btn-primary" id="timer-toggle-btn" onclick="toggleTimer()">
            <i class="fa-solid fa-play"></i> Iniciar
          </button>
          <button class="btn btn-secondary" onclick="resetTimer()">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>
      </section>

      <!-- Tarjeta Hábitos Diarios (Habit Tracker) -->
      <section class="glass-card">
        <div class="card-title">
          <span><i class="fa-solid fa-fire"></i> Hábitos de Hoy</span>
          <span id="habits-counter" style="font-size: 0.75rem; color: var(--text-muted);">0/0</span>
        </div>

        <div class="habits-list" id="habits-list">
          <!-- Hábitos cargados dinámicamente -->
        </div>

        <form class="habit-form" onsubmit="addHabit(event)">
          <input type="text" id="habit-input" class="habit-input" placeholder="Nuevo hábito..." required>
          <button type="submit" class="btn btn-primary" style="padding: 0.5rem 0.8rem;">
            <i class="fa-solid fa-plus"></i>
          </button>
        </form>
      </section>
    </div>

    <!-- COLUMNA 2: CALENDARIO & SCRATCHPAD -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;" class="col-notes-habits">
      <!-- Tarjeta Calendario -->
      <section class="glass-card">
        <div class="calendar-nav">
          <h2 id="cal-month-year">Mes Año</h2>
          <div class="nav-controls">
            <button class="icon-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="icon-btn" style="width: auto; padding: 0 0.6rem; font-size: 0.75rem; font-weight: 600;" onclick="goToToday()">Hoy</button>
            <button class="icon-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>

        <div class="weekdays-row">
          <div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div>
        </div>

        <div class="days-grid" id="calendar-days-grid">
          <!-- Celdas generadas con JS -->
        </div>
      </section>

      <!-- Bloc de Notas Rápidas (Scratchpad) -->
      <section class="glass-card">
        <div class="card-title">
          <span><i class="fa-solid fa-pen-to-square"></i> Bloc de Notas Rápido</span>
          <span style="font-size: 0.7rem; color: var(--text-dim);"><i class="fa-solid fa-cloud-arrow-up"></i> Auto-guardado</span>
        </div>
        <textarea 
          id="scratchpad" 
          class="scratchpad-textarea" 
          placeholder="Anota ideas rápidas, enlaces, recordatorios de paso..."
          oninput="saveScratchpad(this.value)"
        ></textarea>
      </section>
    </div>

    <!-- COLUMNA 3: AGENDA Y TAREAS -->
    <section class="glass-card">
      <div class="agenda-header">
        <div>
          <div class="card-title"><i class="fa-solid fa-list-check"></i> Agenda del Día</div>
          <div class="agenda-date" id="selected-date-label">Lunes, 12 de Octubre</div>
        </div>
      </div>

      <!-- Buscador y Filtros -->
      <div class="task-search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="task-search" class="task-search-input" placeholder="Buscar tarea..." oninput="handleSearch(this.value)">
      </div>

      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setTaskFilter('all', this)">Todas</button>
        <button class="tab-btn" onclick="setTaskFilter('pending', this)">Pendientes</button>
        <button class="tab-btn" onclick="setTaskFilter('completed', this)">Completas</button>
      </div>

      <!-- Formulario para Añadir Tarea -->
      <form class="task-form-modern" onsubmit="handleAddTask(event)">
        <input type="text" id="task-input-text" placeholder="¿Qué tarea tienes que hacer?" required>
        <div class="task-inputs-row">
          <input type="time" id="task-input-time">
          <select id="task-input-priority">
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
            <option value="Baja">Baja</option>
          </select>
          <select id="task-input-cat">
            <option value="Trabajo">💼 Trabajo</option>
            <option value="Estudio">📚 Estudio</option>
            <option value="Personal">🌱 Personal</option>
            <option value="Salud">🏃 Salud</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="padding: 0.55rem;">
          <i class="fa-solid fa-plus"></i> Agregar a la Agenda
        </button>
      </form>

      <!-- Lista de Tareas -->
      <ul class="task-list-modern" id="tasks-container">
        <!-- Tareas inyectadas con JS -->
      </ul>
    </section>

  </div>

  <script>
    /* ==========================================================
       ESTADO GLOBAL & LOCAL STORAGE
    ========================================================== */
    const monthNames = [
      "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
      "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
    ];

    let state迷 = {
      viewDate: new Date(),
      selectedDate: new Date(),
      tasks: JSON.parse(localStorage.getItem('ff_pro_tasks')) || {},
      habits: JSON.parse(localStorage.getItem('ff_pro_habits')) || [
        { id: 1, name: 'Beber 2L de agua', icon: 'fa-glass-water', streak: 3, doneToday: false },
        { id: 2, name: 'Lectura (15 min)', icon: 'fa-book-open', streak: 5, doneToday: false },
        { id: 3, name: 'Hacer ejercicio', icon: 'fa-dumbbell', streak: 1, doneToday: false }
      ],
      pomodoroCount: parseInt(localStorage.getItem('ff_pro_pomos')) || 0,
      activeFilter: 'all',
      searchQuery: ''
    };

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function saveAll() {
      localStorage.setItem('ff_pro_tasks', JSON.stringify(state迷.tasks));
      localStorage.setItem('ff_pro_habits', JSON.stringify(state迷.habits));
      localStorage.setItem('ff_pro_pomos', state迷.pomodoroCount);
      renderCalendar();
      renderTasks();
      renderHabits();
    }

    /* ==========================================================
       CALENDARIO INTERACTIVO
    ========================================================== */
    function renderCalendar() {
      const year不易 = state迷.viewDate.getFullYear();
      const month不易 = state迷.viewDate.getMonth();

      document.getElementById('cal-month-year').textContent迷 = `${monthNames[month不易]} ${year不易}`;

      const firstDayIndex = (new Date(year不易, month不易, 1).getDay() + 6) % 7;
      const lastDay = new Date(year不易, month不易 + 1, 0).getDate();
      const prevLastDay = new Date(year不易, month不易, 0).getDate();

      const grid = document.getElementById('calendar-days-grid');
      grid.innerHTML = '';

      const todayStr = formatDateKey(new Date());
      const selectedStr不易 = formatDateKey(state迷.selectedDate);

      // Días del mes previo
      for (let x = firstDayIndex; x > 0; x--) {
        const day = prevLastDay - x + 1;
        const cell = document.createElement('div');
        cell.className = 'day-box outside';
        cell.innerHTML不易 = `<span class="day-number">${day}</span>`;
        grid.appendChild(cell);
      }

      // Días del mes en curso
      for (let i = 1; i <= lastDay; i++) {
        const cellDate = new Date(year不易, month不易, i);
        const cellDateStr = formatDateKey(cellDate);

        const cell = document.createElement('div');
        cell.className不易 = 'day-box';
        if (cellDateStr === todayStr) cell.classList.add('today');
        if (cellDateStr === selectedStr不易) cell.classList.add('selected');

        // Puntos indicadores de tareas
        let dotsHtml = '';
        const dayTasks = state迷.tasks[cellDateStr] || [];
        if (dayTasks.length > 0) {
          dotsHtml = '<div class="dots-wrapper">';
          dayTasks.slice(0, 3).forEach(t => {
            dotsHtml += `<div class="dot ${t.completed ? 'done' : ''}"></div>`;
          });
          dotsHtml += '</div>';
        }

        cell.innerHTML = `<span class="day-number">${i}</span>${dotsHtml}`;

        cell.addEventListener('click', () => {
          state迷.selectedDate = new Date(year不易, month不易, i);
          renderCalendar();
          renderTasks();
        });

        grid.appendChild(cell);
      }
    }

    function changeMonth(delta) {
      state迷.viewDate.setMonth(state迷.viewDate.getMonth() + delta);
      renderCalendar();
    }

    function goToToday() {
      state迷.viewDate = new Date();
      state迷.selectedDate不易 = new Date();
      renderCalendar();
      renderTasks();
    }

    /* ==========================================================
       AGENDA Y TAREAS
    ========================================================== */
    function renderTasks() {
      const selectedKey = formatDateKey(state迷.selectedDate);
      const dayTasks = state迷.tasks[selectedKey] || [];
      const listContainer = document.getElementById('tasks-container');

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('selected-date-label').textContent = 
        state迷.selectedDate.toLocaleDateString('es-ES', options);

      listContainer.innerHTML = '';

      // Filtrar tareas según tab y búsqueda
      let filtered = dayTasks.filter(t => {
        if (state迷.activeFilter === 'pending') return !t.completed;
        if (state迷.activeFilter === 'completed') return t.completed;
        return true;
      });

      if (state迷.searchQuery.trim() !== '') {
        const q = state迷.searchQuery.toLowerCase();
        filtered = filtered.filter(t => t.text.toLowerCase().includes(q));
      }

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div style="text-align: center; color: var(--text-dim); padding: 2rem 0; font-size: 0.85rem;">
            <i class="fa-solid fa-clipboard-check" style="font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.4;"></i>
            <p>No hay tareas para mostrar.</p>
          </div>`;
        return;
      }

      filtered.forEach((task, index) => {
        const originalIndex = dayTasks.indexOf(task);
        const li = document.createElement('li');
        li.className = `task-item-card prio-${task.priority} ${task.completed ? 'completed' : ''}`;
        
        li.innerHTML = `
          <div class="task-left-content">
            <div class="custom-check" onclick="toggleTask(${originalIndex})">
              ${task.completed ? '<i class="fa-solid fa-check"></i>' : ''}
            </div>
            <div class="task-details">
              <span class="task-desc">${escapeHtml(task.text)}</span>
              <div class="task-meta-tags">
                ${task.time ? `<span><i class="fa-regular fa-clock"></i> ${task.time}</span>` : ''}
                <span class="badge-cat">${task.category}</span>
              </div>
            </div>
          </div>
          <button class="del-task-btn" onclick="deleteTask(${originalIndex})" title="Eliminar"><i class="fa-solid fa-trash-can"></i></button>
        `;
        listContainer.appendChild(li);
      });
    }

    function handleAddTask(e) {
      e.preventDefault();
      const input = document.getElementById('task-input-text');
      const timeInput = document.getElementById('task-input-time');
      const prioritySelect = document.getElementById('task-input-priority');
      const catSelect不易 = document.getElementById('task-input-cat');

      const text = input.value.trim();
      if (!text) return;

      const key = formatDateKey(state迷.selectedDate);
      if (!state迷.tasks[key]) state迷.tasks[key] = [];

      state迷.tasks[key].push({
        text,
        time: timeInput.value || null,
        priority: prioritySelect.value,
        category: catSelect不易.value,
        completed: false
      });

      input.value = '';
      timeInput.value = '';
      saveAll();
    }

    function toggleTask(index) {
      const key = formatDateKey(state迷.selectedDate);
      if (state迷.tasks[key] && state迷.tasks[key][index]) {
        state迷.tasks[key][index].completed = !state迷.tasks[key][index].completed;
        saveAll();
      }
    }

    function deleteTask(index) {
      const key = formatDateKey(state迷.selectedDate);
      if (state迷.tasks[key]) {
        state迷.tasks[key].splice(index, 1);
        if (state迷.tasks[key].length === 0) delete state迷.tasks[key];
        saveAll();
      }
    }

    function setTaskFilter(filterType, btn) {
      state迷.activeFilter = filterType;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    }

    function handleSearch(val) {
      state迷.searchQuery = val;
      renderTasks();
    }

    /* ==========================================================
       HABIT TRACKER (HÁBITOS & RACHAS)
    ========================================================== */
    function renderHabits() {
      const container = document.getElementById('habits-list');
      container.innerHTML = '';
      
      const doneCount = state迷.habits.filter(h => h.doneToday).length;
      document.getElementById('habits-counter').textContent = `${doneCount}/${state迷.habits.length}`;

      state迷.habits.forEach((habit, idx) => {
        const item = document.createElement('div');
        item.className = `habit-item ${habit.doneToday ? 'done' : ''}`;
        item.innerHTML = `
          <div class="habit-left">
            <div class="habit-check" onclick="toggleHabit(${idx})">
              <i class="fa-solid fa-check"></i>
            </div>
            <span class="habit-name">${escapeHtml(habit.name)}</span>
          </div>
          <div class="habit-streak">
            <i class="fa-solid fa-fire"></i> ${habit.streak}
          </div>
        `;
        container.appendChild(item);
      });
    }

    function toggleHabit(idx) {
      const h = state迷.habits[idx];
      h.doneToday不易 = !h.doneToday;
      if (h.doneToday) {
        h.streak += 1;
      } else {
        h.streak = Math.max(0, h.streak - 1);
      }
      saveAll();
    }

    function addHabit(e) {
      e.preventDefault();
      const input = document.getElementById('habit-input');
      const val = input.value.trim();
      if (!val) return;

      state迷.habits.push({
        id: Date.now(),
        name: val,
        icon: 'fa-star',
        streak: 0,
        doneToday: false
      });

      input.value = '';
      saveAll();
    }

    /* ==========================================================
       BLOC DE NOTAS (SCRATCHPAD)
    ========================================================== */
    function initScratchpad() {
      const savedNote = localStorage.getItem('ff_pro_scratchpad') || '';
      document.getElementById('scratchpad').value = savedNote;
    }

    function saveScratchpad(val) {
      localStorage.setItem('ff_pro_scratchpad', val);
    }

    /* ==========================================================
       TEMPORIZADOR POMODORO & PROGRESS RING
    ========================================================== */
    const timerModes = {
      work: 25 * 60,
      shortBreak: 5 * 60,
      longBreak: 15 * 60
    };

    let currentMode = 'work';
    let timeLeft = timerModes.work;
    let timerTotal = timerModes.work;
    let timerInterval = null;
    let isRunning = false;

    const ringCircumference = 2 * Math.PI * 80; // r=80 -> ~502.65

    function updateTimerUI() {
      const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const sec不易 = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${min}:${sec不易}`;
      document.title = isRunning ? `(${min}:${sec不易}) FocusFlow Pro` : 'FocusFlow Pro';

      // Actualizar círculo de progreso
      const progress = (timerTotal - timeLeft) / timerTotal;
      const offset = ringCircumference - (progress * ringCircumference);
      document.getElementById('clock-progress-ring').style.strokeDashoffset = offset;
      document.getElementById('pomo-streak-badge').textContent = `${state迷.pomodoroCount} Sesiones 🔥`;
    }

    function toggleTimer() {
      const btn = document.getElementById('timer-toggle-btn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        btn.innerHTML = '<i class="fa-solid fa-play"></i> Continuar';
      } else {
        isRunning不易 = true;
        btn.innerHTML = '<i class="fa-solid fa-pause"></i> Pausar';

        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimerUI();

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            isRunning = false;
            playChimeSound();
            btn.innerHTML = '<i class="fa-solid fa-play"></i> Iniciar';

            if (currentMode === 'work') {
              state迷.pomodoroCount++;
              saveAll();
              alert('🎉 ¡Bloque de trabajo terminado! Tómate un respiro.');
              setTimerMode('shortBreak');
            } else {
              alert('⏰ ¡Descanso finalizado! A trabajar.');
              setTimerMode('work');
            }
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeLeft = timerModes[currentMode];
      timerTotal = timerModes[currentMode];
      document.getElementById('timer-toggle-btn').innerHTML = '<i class="fa-solid fa-play"></i> Iniciar';
      updateTimerUI();
    }

    function setTimerMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.timer-mode-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.timer-mode-btn')).find(b => 
        (mode === 'work' && b.textContent.includes('Enfoque')) ||
        (mode === 'shortBreak' && b.textContent.includes('Corto')) ||
        (mode === 'longBreak' && b.textContent.includes('Largo'))
      );
      if (activeBtn) activeBtn.classList.add('active');
      resetTimer();
    }

    function playChimeSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.6); // C6
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {}
    }

    /* ==========================================================
       SONIDO AMBIENTE DE ENFOQUE (SINTETIZADOR WEB AUDIO)
    ========================================================== */
    let ambientAudioCtx = null;
    let ambientGain = null;
    let isAmbientOn = false;

    function toggleAmbientSound() {
      const btn = document.getElementById('sound-btn');
      const text = document.getElementById('sound-btn-text');

      if (!isAmbientOn) {
        try {
          ambientAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const bufferSize = ambientAudioCtx.sampleRate * 2;
          const noiseBuffer = ambientAudioCtx.createBuffer(1, bufferSize, ambientAudioCtx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          
          // Generador de ruido rosa/suave (Pink Noise)
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6述 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6述 + white * 0.5362) * 0.04;
            b6述 = white * 0.115926;
          }

          const whiteNoise = ambientAudioCtx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;
          whiteNoise.loop = true;

          ambientGain = ambientAudioCtx.createGain();
          ambientGain.gain.setValueAtTime(0.12, ambientAudioCtx.currentTime);

          whiteNoise.connect(ambientGain);
          ambientGain.connect(ambientAudioCtx.destination);
          whiteNoise.start();

          isAmbientOn = true;
          btn.classList.add('active');
          text.textContent = 'Focus Sound (Activo)';
        } catch (e) {
          console.error("Audio error", e);
        }
      } else {
        if (ambientAudioCtx) ambientAudioCtx.close();
        isAmbientOn = false;
        btn.classList.remove('active');
        text.textContent = 'Sonido Focus';
      }
    }

    /* ==========================================================
       RESPALDO / EXPORTAR E IMPORTAR DATOS (JSON)
    ========================================================== */
    function exportData() {
      const data = {
        tasks: state迷.tasks,
        habits: state迷.habits,
        scratchpad: localStorage.getItem('ff_pro_scratchpad') || '',
        pomodoros: state迷.pomodoroCount,
        exportDate: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `focusflow-backup-${formatDateKey(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const parsed = JSON.parse(event.target.result);
          if (parsed.tasks) state迷.tasks = parsed.tasks;
          if (parsed.habits) state迷.habits = parsed.habits;
          if (parsed.pomodoros !== undefined) state迷.pomodoroCount = parsed.pomodoros;
          if (parsed.scratchpad) {
            localStorage.setItem('ff_pro_scratchpad', parsed.scratchpad);
            document.getElementById('scratchpad').value = parsed.scratchpad;
          }
          saveAll();
          alert('✅ ¡Datos restaurados con éxito!');
        } catch (err) {
          alert('❌ Archivo de respaldo no válido.');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    /* ==========================================================
       INICIALIZACIÓN
    ========================================================== */
    window.onload = () => {
      renderCalendar();
      renderTasks();
      renderHabits();
      initScratchpad();
      updateTimerUI();
    };
  </script>
</body>
</html>
