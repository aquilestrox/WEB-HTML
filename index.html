<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Calendar - macOS Pro</title>
    <style>
        :root {
            --bg-window: #1e1e1e;
            --bg-sidebar: #161618;
            --bg-calendar: #1e1e20;
            --grid-line: #2b2b2f;
            --grid-line-subtle: #232326;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --border-ui: rgba(255, 255, 255, 0.08);

            --accent-orange: #ff9f0a;
            --accent-blue: #0a84ff;
            --accent-pink: #ff375f;
            --accent-green: #30d158;
            --accent-yellow: #ffd60a;
            --accent-brown: #a2845e;
            --accent-purple: #bf5af2;
            --accent-red: #ff453a;

            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #000;
            font-family: var(--font-stack);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-size: 13px;
        }

        /* Ventana macOS */
        .window {
            width: 98vw;
            height: 96vh;
            background: var(--bg-window);
            border-radius: 12px;
            box-shadow: 0 35px 80px rgba(0,0,0,0.9), 0 0 0 1px var(--border-ui);
            display: flex;
            overflow: hidden;
        }

        /* BARRA LATERAL */
        .sidebar {
            width: 230px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-ui);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 12px;
            flex-shrink: 0;
        }

        .traffic-lights {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            align-items: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .section-title {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            margin: 12px 6px 6px 6px;
        }

        .calendar-list {
            list-style: none;
            margin-bottom: 8px;
        }

        .calendar-item {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12.5px;
            gap: 8px;
            transition: background 0.15s;
        }

        .calendar-item:hover {
            background: rgba(255,255,255,0.06);
        }

        .custom-checkbox {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #000;
            font-weight: 900;
            transition: all 0.2s;
        }

        .calendar-item.inactive .custom-checkbox {
            background: transparent !important;
            border: 1.5px solid var(--text-muted);
            color: transparent;
        }
        .calendar-item.inactive span:last-child {
            opacity: 0.45;
        }

        /* Minicalendario */
        .mini-calendar {
            background: rgba(0,0,0,0.25);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-ui);
        }

        .mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ddd;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
        }

        .mini-grid .mini-day-title {
            padding-bottom: 4px;
            font-weight: 600;
        }

        .mini-grid .day-num {
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            color: #ccc;
        }
        .mini-grid .day-num.current-day {
            background: var(--accent-red);
            color: #fff;
            font-weight: bold;
        }
        .mini-grid .day-num.in-selected-week {
            background: rgba(255,255,255,0.1);
        }
        .mini-grid .day-num.other-month { color: #444; }

        /* VISTA PRINCIPAL */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-calendar);
            overflow: hidden;
            position: relative;
        }

        .top-bar {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid var(--grid-line);
            flex-shrink: 0;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 17px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.08);
        }

        .main-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.2px;
            min-width: 180px;
        }

        .segmented-control {
            display: flex;
            background: rgba(255,255,255,0.08);
            padding: 2px;
            border-radius: 6px;
        }

        .segment-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 4px 11px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .segment-btn.active {
            background: rgba(255,255,255,0.2);
            color: var(--text-main);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-today {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-ui);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-today:hover { background: rgba(255,255,255,0.15); }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--border-ui);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            margin-right: 6px;
        }
        .btn-reset:hover { color: #ff5f56; border-color: #ff5f56; }

        /* CUERPO DEL CALENDARIO */
        .calendar-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        /* Encabezado columnas */
        .days-header {
            display: grid;
            grid-template-columns: 55px repeat(7, 1fr);
            border-bottom: 1px solid var(--grid-line);
            text-align: center;
            font-size: 12px;
            padding: 8px 0;
            background: var(--bg-calendar);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .day-header-cell {
            color: var(--text-muted);
            font-weight: 500;
        }
        .day-header-cell.is-today {
            color: var(--accent-red);
            font-weight: 700;
        }

        /* Todo el día */
        .all-day-row {
            display: grid;
            grid-template-columns: 55px repeat(7, 1fr);
            border-bottom: 1px solid var(--grid-line);
            min-height: 28px;
            background: rgba(0,0,0,0.15);
            position: sticky;
            top: 33px;
            z-index: 19;
        }

        .all-day-label {
            color: var(--text-muted);
            text-align: right;
            padding-right: 8px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .all-day-cell {
            border-left: 1px solid var(--grid-line);
            min-height: 28px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 3px 4px;
            cursor: pointer;
        }

        /* Rejilla Horaria */
        .time-grid-container {
            display: grid;
            grid-template-columns: 55px repeat(7, 1fr);
            position: relative;
            flex: 1;
        }

        .time-labels {
            display: flex;
            flex-direction: column;
        }

        .time-label {
            height: 60px;
            text-align: right;
            padding-right: 8px;
            font-size: 11px;
            color: var(--text-muted);
            transform: translateY(-7px);
        }

        .day-column {
            border-left: 1px solid var(--grid-line);
            position: relative;
            height: calc(60px * 18);
            cursor: pointer;
        }

        .hour-row-line {
            height: 60px;
            border-bottom: 1px solid var(--grid-line);
            box-sizing: border-box;
            pointer-events: none;
        }

        /* Indicador de Hora Actual */
        .current-time-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-red);
            z-index: 10;
            pointer-events: none;
        }
        .current-time-line::before {
            content: '';
            position: absolute;
            left: -4px;
            top: -3px;
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
        }

        /* EVENTOS */
        .event-card {
            position: absolute;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 11.5px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 2px;
            cursor: pointer;
            border-left-width: 3.5px;
            border-left-style: solid;
            line-height: 1.25;
            z-index: 5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: filter 0.1s, transform 0.08s;
        }

        .event-card:hover {
            filter: brightness(1.25);
            z-index: 8;
        }

        .event-card .event-title-text {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .event-card .event-time {
            font-size: 10px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }

        .all-day-chip {
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            border-left-width: 3px;
            border-left-style: solid;
            font-weight: 500;
        }

        /* Temas de color de categorías */
        .cat-grabacion { background: rgba(255, 159, 10, 0.28); border-left-color: var(--accent-orange); color: #ffd899; }
        .cat-edicion { background: rgba(10, 132, 255, 0.28); border-left-color: var(--accent-blue); color: #a5d0ff; }
        .cat-ocio { background: rgba(162, 132, 94, 0.28); border-left-color: var(--accent-brown); color: #dfd3c5; }
        .cat-casa { background: rgba(10, 132, 255, 0.2); border-left-color: var(--accent-blue); color: #bde0fe; }
        .cat-preparacion { background: rgba(255, 55, 95, 0.28); border-left-color: var(--accent-pink); color: #ffb3c1; }
        .cat-completado { background: rgba(48, 209, 88, 0.28); border-left-color: var(--accent-green); color: #b7efc5; }
        .cat-cumpleanos { background: rgba(191, 90, 242, 0.28); border-left-color: var(--accent-purple); color: #e8c5ff; }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: #252529;
            border: 1px solid var(--border-ui);
            border-radius: 12px;
            width: 340px;
            padding: 18px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.7);
        }

        .modal h3 {
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        .form-group input, .form-group select {
            background: #18181a;
            border: 1px solid var(--border-ui);
            color: white;
            padding: 7px 9px;
            border-radius: 6px;
            outline: none;
            font-size: 12.5px;
            width: 100%;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-blue);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0 10px 0;
            font-size: 12px;
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 12px;
            padding: 6px 8px;
            border-radius: 5px;
        }
        .btn-delete:hover { background: rgba(255,69,58,0.15); }

        .btn-cancel {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 10px;
            font-size: 12px;
        }
        .btn-cancel:hover { color: var(--text-main); }

        .btn-save {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-save:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

<div class="window">
    <!-- BARRA LATERAL -->
    <div class="sidebar">
        <div>
            <div class="traffic-lights">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>

            <div class="section-title">iCloud</div>
            <ul class="calendar-list">
                <li class="calendar-item" data-cat="casa">
                    <span class="custom-checkbox" style="background:var(--accent-blue);">✓</span>
                    <span>Casa</span>
                </li>
                <li class="calendar-item" data-cat="preparacion">
                    <span class="custom-checkbox" style="background:var(--accent-pink);">✓</span>
                    <span>Preparación</span>
                </li>
                <li class="calendar-item" data-cat="grabacion">
                    <span class="custom-checkbox" style="background:var(--accent-orange);">✓</span>
                    <span>Grabación</span>
                </li>
                <li class="calendar-item" data-cat="completado">
                    <span class="custom-checkbox" style="background:var(--accent-green);">✓</span>
                    <span>Completado</span>
                </li>
                <li class="calendar-item" data-cat="edicion">
                    <span class="custom-checkbox" style="background:var(--accent-yellow);">✓</span>
                    <span>Edición</span>
                </li>
                <li class="calendar-item" data-cat="ocio">
                    <span class="custom-checkbox" style="background:var(--accent-brown);">✓</span>
                    <span>Ocio</span>
                </li>
            </ul>

            <div class="section-title">Otros</div>
            <ul class="calendar-list">
                <li class="calendar-item" data-cat="cumpleanos">
                    <span class="custom-checkbox" style="background:var(--accent-purple);">✓</span>
                    <span>Cumpleaños</span>
                </li>
            </ul>
        </div>

        <!-- Minicalendario -->
        <div class="mini-calendar">
            <div class="mini-header">
                <span id="mini-prev" style="cursor:pointer;">&lt;</span>
                <span id="mini-month-label">septiembre de 2026</span>
                <span id="mini-next" style="cursor:pointer;">&gt;</span>
            </div>
            <div class="mini-grid" id="mini-calendar-grid">
                <!-- Días inyectados por JS -->
            </div>
        </div>
    </div>

    <!-- VISTA PRINCIPAL -->
    <div class="main-view">
        <div class="top-bar">
            <div class="top-left">
                <button class="btn-icon" id="open-modal-btn" title="Nuevo evento">+</button>
                <div class="segmented-control">
                    <button class="segment-btn">Día</button>
                    <button class="segment-btn active">Semana</button>
                    <button class="segment-btn">Mes</button>
                    <button class="segment-btn">Año</button>
                </div>
                <h1 class="main-title" id="current-month-title">Agosto de 2026</h1>
            </div>

            <div class="top-right">
                <button class="btn-reset" id="btn-reset" title="Restablecer eventos por defecto">↺ Restaurar</button>
                <button class="btn-icon" id="btn-prev">&lt;</button>
                <button class="btn-today" id="btn-today">Hoy</button>
                <button class="btn-icon" id="btn-next">&gt;</button>
                <button class="btn-icon">🔍</button>
            </div>
        </div>

        <div class="calendar-body" id="calendar-body">
            <!-- Encabezados de días -->
            <div class="days-header" id="days-header">
                <div></div>
                <!-- Celdas de días generadas dinámicamente -->
            </div>

            <!-- Fila Todo el día -->
            <div class="all-day-row">
                <div class="all-day-label">todo el día</div>
                <div class="all-day-cell" data-day-index="0"></div>
                <div class="all-day-cell" data-day-index="1"></div>
                <div class="all-day-cell" data-day-index="2"></div>
                <div class="all-day-cell" data-day-index="3"></div>
                <div class="all-day-cell" data-day-index="4"></div>
                <div class="all-day-cell" data-day-index="5"></div>
                <div class="all-day-cell" data-day-index="6"></div>
            </div>

            <!-- Rejilla de Horas -->
            <div class="time-grid-container" id="time-grid-container">
                <div class="time-labels" id="hour-labels"></div>
                <div class="day-column" data-day-index="0"></div>
                <div class="day-column" data-day-index="1"></div>
                <div class="day-column" data-day-index="2"></div>
                <div class="day-column" data-day-index="3"></div>
                <div class="day-column" data-day-index="4"></div>
                <div class="day-column" data-day-index="5"></div>
                <div class="day-column" data-day-index="6"></div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL PARA CREAR / EDITAR / ELIMINAR EVENTO -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h3 id="modal-title">Detalles del Evento</h3>
        <input type="hidden" id="event-id">
        
        <div class="form-group">
            <label>Título</label>
            <input type="text" id="event-title" placeholder="Ej. Grabación de vídeo">
        </div>

        <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="event-date">
        </div>

        <label class="checkbox-row">
            <input type="checkbox" id="event-allday">
            <span>Todo el día</span>
        </label>

        <div class="form-row" id="time-inputs-container">
            <div class="form-group" style="flex:1;">
                <label>Inicio</label>
                <input type="time" id="event-start-time" value="10:00">
            </div>
            <div class="form-group" style="flex:1;">
                <label>Fin</label>
                <input type="time" id="event-end-time" value="12:00">
            </div>
        </div>

        <div class="form-group">
            <label>Categoría</label>
            <select id="event-category">
                <option value="grabacion">Grabación (Naranja)</option>
                <option value="edicion">Edición (Azul)</option>
                <option value="ocio">Ocio (Marrón)</option>
                <option value="casa">Casa (Azul claro)</option>
                <option value="preparacion">Preparación (Rosa)</option>
                <option value="completado">Completado (Verde)</option>
                <option value="cumpleanos">Cumpleaños (Morado)</option>
            </select>
        </div>

        <div class="modal-actions">
            <button class="btn-delete" id="delete-btn" style="visibility:hidden;">Eliminar</button>
            <div>
                <button class="btn-cancel" id="cancel-btn">Cancelar</button>
                <button class="btn-save" id="save-btn">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script>
    const START_HOUR = 6;
    const END_HOUR = 23;
    const HOUR_HEIGHT = 60; // 60px = 1 hora

    const STORAGE_EVENTS_KEY = 'apple_cal_events_v3';
    const STORAGE_CATS_KEY = 'apple_cal_cats_v3';

    // Fecha base inicial del screenshot: 26 de agosto de 2026 (miércoles)
    let currentWeekStart = new Date(2026, 7, 24); // Lunes 24 de agosto de 2026

    // Eventos exactos de la foto vinculados a fechas reales
    const DEFAULT_EVENTS = [
        { id: '1', date: '2026-08-27', title: 'Grabación mobs bebés G2', startTime: '10:45', endTime: '15:00', category: 'grabacion', isAllDay: false },
        { id: '2', date: '2026-08-27', title: 'Edición y creación de la intro video base perfecta', startTime: '16:00', endTime: '21:00', category: 'edicion', isAllDay: false },
        { id: '3', date: '2026-08-28', title: 'piscina', startTime: '10:00', endTime: '15:45', category: 'ocio', isAllDay: false },
        { id: '4', date: '2026-08-28', title: 'Edición y creación de la intro video base perfecta', startTime: '15:45', endTime: '17:30', category: 'edicion', isAllDay: false },
        { id: '5', date: '2026-08-29', title: 'Edición mobs bebés G2 y G3', startTime: '10:00', endTime: '15:00', category: 'edicion', isAllDay: false },
        { id: '6', date: '2026-08-29', title: 'Miniaturas del vídeo Base Perfecta', startTime: '16:00', endTime: '21:00', category: 'edicion', isAllDay: false },
        { id: '7', date: '2026-08-30', title: 'Grabación mobs bebés G5', startTime: '10:05', endTime: '13:45', category: 'grabacion', isAllDay: false },
        { id: '8', date: '2026-08-30', title: 'Grabación mobs bebés G6', startTime: '16:00', endTime: '20:45', category: 'grabacion', isAllDay: false },
        { id: '9', date: '2026-08-26', title: 'playa', startTime: '00:00', endTime: '23:59', category: 'ocio', isAllDay: true },
        { id: '10', date: '2026-08-31', title: 'Papa cumple años', startTime: '00:00', endTime: '23:59', category: 'cumpleanos', isAllDay: true }
    ];

    let events = [];
    let activeCategories = {
        casa: true, preparacion: true, grabacion: true,
        completado: true, edicion: true, ocio: true, cumpleanos: true
    };

    // 1. GENERAR CUADRÍCULA DE HORAS
    const hourLabelsContainer = document.getElementById('hour-labels');
    const dayColumns = document.querySelectorAll('.day-column');

    for (let h = START_HOUR; h <= END_HOUR; h++) {
        const label = document.createElement('div');
        label.className = 'time-label';
        label.textContent = `${h}:00`;
        hourLabelsContainer.appendChild(label);

        dayColumns.forEach(col => {
            const line = document.createElement('div');
            line.className = 'hour-row-line';
            col.appendChild(line);
        });
    }

    // 2. HELPERS DE FECHAS
    function formatDateISO(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function timeToMinutes(timeStr) {
        if (!timeStr) return 0;
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
    }

    function getWeekDays(startDate) {
        const days = [];
        for (let i = 0; i < 7; i++) {
            const d = new Date(startDate);
            d.setDate(startDate.getDate() + i);
            days.push(d);
        }
        return days;
    }

    // 3. RENDERIZAR ENCABEZADOS Y TÍTULO
    const dayNames = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
    const monthNames = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

    function updateHeaders() {
        const weekDays = getWeekDays(currentWeekStart);
        const headerContainer = document.getElementById('days-header');
        headerContainer.innerHTML = '<div></div>';

        const todayISO = formatDateISO(new Date());

        weekDays.forEach((date, i) => {
            const iso = formatDateISO(date);
            const cell = document.createElement('div');
            const isToday = iso === todayISO;
            cell.className = `day-header-cell ${isToday ? 'is-today' : ''}`;
            
            const dayName = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'][date.getDay()];
            cell.textContent = `${dayName} ${date.getDate()}`;
            headerContainer.appendChild(cell);

            // Asociar columnas con sus fechas
            document.querySelector(`.day-column[data-day-index="${i}"]`).dataset.date = iso;
            document.querySelector(`.all-day-cell[data-day-index="${i}"]`).dataset.date = iso;
        });

        // Actualizar título del mes
        const midWeekDate = weekDays[3];
        document.getElementById('current-month-title').textContent = 
            `${monthNames[midWeekDate.getMonth()].charAt(0).toUpperCase() + monthNames[midWeekDate.getMonth()].slice(1)} de ${midWeekDate.getFullYear()}`;

        renderMiniCalendar();
    }

    // 4. MINICALENDARIO
    function renderMiniCalendar() {
        const grid = document.getElementById('mini-calendar-grid');
        grid.innerHTML = `
            <span class="mini-day-title">l</span>
            <span class="mini-day-title">m</span>
            <span class="mini-day-title">x</span>
            <span class="mini-day-title">j</span>
            <span class="mini-day-title">v</span>
            <span class="mini-day-title">s</span>
            <span class="mini-day-title">d</span>
        `;

        const viewDate = new Date(currentWeekStart);
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();

        document.getElementById('mini-month-label').textContent = `${monthNames[month]} de ${year}`;

        const firstDayOfMonth = new Date(year, month, 1);
        let startDay = firstDayOfMonth.getDay() - 1;
        if (startDay === -1) startDay = 6;

        const calStartDate = new Date(firstDayOfMonth);
        calStartDate.setDate(calStartDate.getDate() - startDay);

        const currentWeekISOS = getWeekDays(currentWeekStart).map(formatDateISO);
        const todayISO = formatDateISO(new Date());

        for (let i = 0; i < 35; i++) {
            const d = new Date(calStartDate);
            d.setDate(calStartDate.getDate() + i);
            const iso = formatDateISO(d);

            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-num';
            dayDiv.textContent = d.getDate();

            if (d.getMonth() !== month) dayDiv.classList.add('other-month');
            if (iso === todayISO) dayDiv.classList.add('current-day');
            if (currentWeekISOS.includes(iso)) dayDiv.classList.add('in-selected-week');

            dayDiv.onclick = () => {
                const newStart = new Date(d);
                let dayOfWeek = newStart.getDay() - 1;
                if (dayOfWeek === -1) dayOfWeek = 6;
                newStart.setDate(newStart.getDate() - dayOfWeek);
                currentWeekStart = newStart;
                updateHeaders();
                renderEvents();
            };

            grid.appendChild(dayDiv);
        }
    }

    // 5. RENDERIZADO DE EVENTOS CON GESTIÓN DE SOLAPAMIENTOS
    function renderEvents() {
        document.querySelectorAll('.event-card').forEach(el => el.remove());
        document.querySelectorAll('.all-day-cell').forEach(cell => cell.innerHTML = '');

        const weekDays = getWeekDays(currentWeekStart);
        const weekISOs = weekDays.map(formatDateISO);

        weekISOs.forEach((iso, dayIndex) => {
            const dayEvents = events.filter(e => e.date === iso && activeCategories[e.category]);

            // All day events
            const allDayCell = document.querySelector(`.all-day-cell[data-day-index="${dayIndex}"]`);
            dayEvents.filter(e => e.isAllDay).forEach(ev => {
                const chip = document.createElement('div');
                chip.className = `all-day-chip cat-${ev.category}`;
                chip.textContent = ev.title;
                chip.onclick = (e) => { e.stopPropagation(); openEditModal(ev); };
                allDayCell.appendChild(chip);
            });

            // Timed events
            const timedEvents = dayEvents.filter(e => !e.isAllDay);
            const col = document.querySelector(`.day-column[data-day-index="${dayIndex}"]`);

            // Algoritmo de columnas y solapamiento
            timedEvents.sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

            const clusters = [];
            timedEvents.forEach(ev => {
                const evStart = timeToMinutes(ev.startTime);
                const evEnd = timeToMinutes(ev.endTime);

                let placed = false;
                for (let cluster of clusters) {
                    if (evStart < cluster.end) {
                        cluster.events.push(ev);
                        cluster.end = Math.max(cluster.end, evEnd);
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    clusters.push({ events: [ev], end: evEnd });
                }
            });

            clusters.forEach(cluster => {
                const count = cluster.events.length;
                cluster.events.forEach((ev, idx) => {
                    const startMin = timeToMinutes(ev.startTime);
                    const endMin = timeToMinutes(ev.endTime);

                    const topPos = ((startMin - (START_HOUR * 60)) / 60) * HOUR_HEIGHT;
                    const height = Math.max(22, ((endMin - startMin) / 60) * HOUR_HEIGHT);

                    const width = 100 / count;
                    const left = idx * width;

                    const card = document.createElement('div');
                    card.className = `event-card cat-${ev.category}`;
                    card.style.top = `${topPos}px`;
                    card.style.height = `${height}px`;
                    card.style.left = `${left}%`;
                    card.style.width = `calc(${width}% - 4px)`;

                    card.innerHTML = `
                        <span class="event-title-text">${ev.title}</span>
                        <span class="event-time">🕒 ${ev.startTime} - ${ev.endTime}</span>
                    `;

                    card.onclick = (e) => {
                        e.stopPropagation();
                        openEditModal(ev);
                    };

                    col.appendChild(card);
                });
            });
        });
    }

    // 6. MODAL (CREAR / EDITAR / ELIMINAR)
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const eventIdInput = document.getElementById('event-id');
    const eventTitleInput = document.getElementById('event-title');
    const eventDateInput = document.getElementById('event-date');
    const eventAllDayInput = document.getElementById('event-allday');
    const eventStartTimeInput = document.getElementById('event-start-time');
    const eventEndTimeInput = document.getElementById('event-end-time');
    const eventCatInput = document.getElementById('event-category');
    const deleteBtn = document.getElementById('delete-btn');
    const timeInputsContainer = document.getElementById('time-inputs-container');

    eventAllDayInput.addEventListener('change', () => {
        timeInputsContainer.style.display = eventAllDayInput.checked ? 'none' : 'flex';
    });

    eventStartTimeInput.addEventListener('change', () => {
        const startMin = timeToMinutes(eventStartTimeInput.value);
        const endMin = timeToMinutes(eventEndTimeInput.value);
        if (endMin <= startMin) {
            const newEndMin = Math.min(24 * 60 - 1, startMin + 60);
            const h = String(Math.floor(newEndMin / 60)).padStart(2, '0');
            const m = String(newEndMin % 60).padStart(2, '0');
            eventEndTimeInput.value = `${h}:${m}`;
        }
    });

    function openCreateModal(dateStr, startHour = 10) {
        modalTitle.textContent = "Nuevo Evento";
        eventIdInput.value = "";
        eventTitleInput.value = "";
        eventDateInput.value = dateStr || formatDateISO(new Date());
        eventAllDayInput.checked = false;
        timeInputsContainer.style.display = 'flex';

        const hStr = String(startHour).padStart(2, '0');
        const hEndStr = String(Math.min(23, startHour + 1)).padStart(2, '0');
        eventStartTimeInput.value = `${hStr}:00`;
        eventEndTimeInput.value = `${hEndStr}:00`;
        eventCatInput.value = "grabacion";

        deleteBtn.style.visibility = 'hidden';
        modal.style.display = 'flex';
        setTimeout(() => eventTitleInput.focus(), 50);
    }

    function openEditModal(ev) {
        modalTitle.textContent = "Editar Evento";
        eventIdInput.value = ev.id;
        eventTitleInput.value = ev.title;
        eventDateInput.value = ev.date;
        eventAllDayInput.checked = !!ev.isAllDay;
        timeInputsContainer.style.display = ev.isAllDay ? 'none' : 'flex';

        eventStartTimeInput.value = ev.startTime || "10:00";
        eventEndTimeInput.value = ev.endTime || "11:00";
        eventCatInput.value = ev.category;

        deleteBtn.style.visibility = 'visible';
        modal.style.display = 'flex';
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    function saveEvent() {
        const title = eventTitleInput.value.trim();
        if (!title) {
            alert("Por favor escribe un título.");
            return;
        }

        const id = eventIdInput.value || Date.now().toString();
        const newEvent = {
            id,
            title,
            date: eventDateInput.value,
            isAllDay: eventAllDayInput.checked,
            startTime: eventAllDayInput.checked ? "00:00" : eventStartTimeInput.value,
            endTime: eventAllDayInput.checked ? "23:59" : eventEndTimeInput.value,
            category: eventCatInput.value
        };

        const idx = events.findIndex(e => e.id === id);
        if (idx > -1) events[idx] = newEvent;
        else events.push(newEvent);

        saveToLocalStorage();
        renderEvents();
        closeModal();
    }

    document.getElementById('save-btn').onclick = saveEvent;
    document.getElementById('cancel-btn').onclick = closeModal;

    deleteBtn.onclick = () => {
        const id = eventIdInput.value;
        events = events.filter(e => e.id !== id);
        saveToLocalStorage();
        renderEvents();
        closeModal();
    };

    // Atajos de teclado para el Modal
    window.addEventListener('keydown', (e) => {
        if (modal.style.display === 'flex') {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && e.target === eventTitleInput) saveEvent();
        }
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    // Clic en columnas para crear evento
    dayColumns.forEach(col => {
        col.addEventListener('click', (e) => {
            const rect = col.getBoundingClientRect();
            const offsetY = e.clientY - rect.top;
            const clickedHour = Math.floor(START_HOUR + (offsetY / HOUR_HEIGHT));
            openCreateModal(col.dataset.date, clickedHour);
        });
    });

    // Clic en fila de Todo el día
    document.querySelectorAll('.all-day-cell').forEach(cell => {
        cell.addEventListener('click', () => {
            openCreateModal(cell.dataset.date);
            eventAllDayInput.checked = true;
            timeInputsContainer.style.display = 'none';
        });
    });

    // Botón "+"
    document.getElementById('open-modal-btn').onclick = () => {
        openCreateModal(formatDateISO(currentWeekStart));
    };

    // 7. NAVEGACIÓN DE SEMANAS
    document.getElementById('btn-prev').onclick = () => {
        currentWeekStart.setDate(currentWeekStart.getDate() - 7);
        updateHeaders();
        renderEvents();
    };

    document.getElementById('btn-next').onclick = () => {
        currentWeekStart.setDate(currentWeekStart.getDate() + 7);
        updateHeaders();
        renderEvents();
    };

    document.getElementById('btn-today').onclick = () => {
        const today = new Date();
        let dayOfWeek = today.getDay() - 1;
        if (dayOfWeek === -1) dayOfWeek = 6;
        today.setDate(today.getDate() - dayOfWeek);
        currentWeekStart = today;
        updateHeaders();
        renderEvents();
    };

    // 8. FILTROS DE LA BARRA LATERAL
    document.querySelectorAll('.calendar-item').forEach(item => {
        item.addEventListener('click', () => {
            const cat = item.dataset.cat;
            activeCategories[cat] = !activeCategories[cat];
            item.classList.toggle('inactive', !activeCategories[cat]);
            saveToLocalStorage();
            renderEvents();
        });
    });

    // 9. LOCALSTORAGE
    function saveToLocalStorage() {
        localStorage.setItem(STORAGE_EVENTS_KEY, JSON.stringify(events));
        localStorage.setItem(STORAGE_CATS_KEY, JSON.stringify(activeCategories));
    }

    function loadFromLocalStorage() {
        const saved = localStorage.getItem(STORAGE_EVENTS_KEY);
        const savedCats = localStorage.getItem(STORAGE_CATS_KEY);

        events = saved ? JSON.parse(saved) : [...DEFAULT_EVENTS];
        if (savedCats) activeCategories = JSON.parse(savedCats);

        document.querySelectorAll('.calendar-item').forEach(item => {
            const cat = item.dataset.cat;
            if (activeCategories[cat] === false) item.classList.add('inactive');
        });

        updateHeaders();
        renderEvents();
    }

    // 10. RESTABLECER
    document.getElementById('btn-reset').onclick = () => {
        if (confirm('¿Restablecer los datos a los de la imagen original?')) {
            events = JSON.parse(JSON.stringify(DEFAULT_EVENTS));
            activeCategories = {
                casa: true, preparacion: true, grabacion: true,
                completado: true, edicion: true, ocio: true, cumpleanos: true
            };
            currentWeekStart = new Date(2026, 7, 24);
            saveToLocalStorage();
            document.querySelectorAll('.calendar-item').forEach(i => i.classList.remove('inactive'));
            updateHeaders();
            renderEvents();
        }
    };

    // INICIAR
    loadFromLocalStorage();
</script>
</body>
</html>
