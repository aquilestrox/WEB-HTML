<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeluxeMenus Studio AI - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        :root {
            --bg-base: #0a0a0b;
            --bg-surface: #141516;
            --bg-surface-hover: #1e1f22;
            --border-color: #2a2b2f;
            --text-primary: #e3e3e3;
            --text-secondary: #a0a0a5;
            --accent: #60a5fa;
            --accent-glow: rgba(96, 165, 250, 0.15);
            
            /* Colores Exactos de Inventario Minecraft */
            --mc-bg: #C6C6C6;
            --mc-border-light: #FFFFFF;
            --mc-border-dark: #555555;
            --mc-slot-bg: #8B8B8B;
            --mc-slot-border-light: #373737;
            --mc-slot-border-dark: #FFFFFF;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-primary);
            overflow: hidden;
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* GEMINI AI INPUT STYLE */
        .ai-input-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .ai-input-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), 0 8px 30px var(--accent-glow);
            background: #18191b;
        }

        /* INVENTARIO MINECRAFT */
        .mc-inventory {
            background-color: var(--mc-bg);
            border-top: 4px solid var(--mc-border-light);
            border-left: 4px solid var(--mc-border-light);
            border-bottom: 4px solid var(--mc-border-dark);
            border-right: 4px solid var(--mc-border-dark);
            padding: 16px;
            border-radius: 2px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.9);
            display: inline-block;
        }

        /* SLOTS GIGANTES Y CLAROS */
        .mc-slot {
            width: 68px;
            height: 68px;
            background-color: var(--mc-slot-bg);
            border-top: 3px solid var(--mc-slot-border-light);
            border-left: 3px solid var(--mc-slot-border-light);
            border-bottom: 3px solid var(--mc-slot-border-dark);
            border-right: 3px solid var(--mc-slot-border-dark);
            position: relative;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
        }
        
        .mc-slot:hover { 
            background-color: #a0a0a0; 
            z-index: 10; 
        }
        
        .mc-slot.active {
            border: 3px solid #60a5fa !important;
            background-color: #3b4252;
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.5), inset 0 0 20px rgba(0,0,0,0.6);
            transform: scale(1.08);
            z-index: 20;
        }

        /* Imágenes dentro del slot */
        .slot-img {
            width: 44px; 
            height: 44px;
            image-rendering: pixelated;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.6));
            object-fit: contain;
        }

        .mc-tooltip {
            display: none;
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 0, 16, 0.95);
            border: 2px solid #3700b3;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            white-space: nowrap;
            z-index: 9999;
            pointer-events: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        .mc-slot:hover .mc-tooltip { display: block; }

        /* SCROLLBAR LIMPIA */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #3f4147; border-radius: 4px; border: 2px solid var(--bg-base); }
        ::-webkit-scrollbar-thumb:hover { background: #5a5d64; }

        /* PANEL LATERAL */
        .side-panel {
            background: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            height: calc(100vh - 64px);
            overflow-y: auto;
        }

        /* MODALES OVERLAY */
        .modal-overlay {
            backdrop-filter: blur(8px);
            background: rgba(0,0,0,0.7);
        }

        /* GRID CATALOGO */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }
        .catalog-item {
            background: #1e1f22;
            border: 1px solid #2a2b2f;
            border-radius: 8px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .catalog-item:hover {
            border-color: #60a5fa;
            background: #2a2d35;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(96, 165, 250, 0.15);
        }
        .catalog-item img {
            width: 48px; height: 48px;
            image-rendering: pixelated;
            margin-bottom: 8px;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.4));
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- HEADER -->
    <header class="h-16 border-b border-[var(--border-color)] flex items-center justify-between px-6 bg-[var(--bg-surface)] shrink-0 z-10 shadow-md">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-blue-500/10 rounded-lg">
                <i data-lucide="blocks" class="w-6 h-6 text-blue-400"></i>
            </div>
            <h1 class="text-xl font-medium tracking-wide text-white">DeluxeMenus <span class="text-blue-400 font-bold">AI Studio Pro</span></h1>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="fillEmptyWithGlass()" title="Rellenar vacíos con cristal oscuro" class="flex items-center gap-2 p-2 hover:bg-white/5 rounded-lg transition-colors text-gray-400 hover:text-white text-sm font-medium">
                <i data-lucide="layout-grid" class="w-4 h-4"></i> Rellenar Vacíos
            </button>
            <div class="w-px h-6 bg-[var(--border-color)] mx-2"></div>
            <button onclick="clearAllData()" title="Limpiar todo el menú" class="flex items-center gap-2 p-2 hover:bg-rose-500/10 rounded-lg transition-colors text-gray-400 hover:text-rose-400 text-sm font-medium">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Limpiar Canvas
            </button>
            <div class="w-px h-6 bg-[var(--border-color)] mx-2"></div>
            <button onclick="openYAMLModal()" class="flex items-center gap-2 bg-blue-500 hover:bg-blue-400 text-white px-5 py-2 rounded-lg font-bold text-sm transition-all shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                <i data-lucide="code-2" class="w-4 h-4"></i> Exportar Código YML
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <main class="flex flex-1 overflow-hidden relative">
        
        <!-- ZONA CENTRAL (Lienzo e IA) -->
        <div class="flex-1 flex flex-col relative bg-[#0a0a0b] overflow-y-auto">
            
            <!-- BARRA DE INTELIGENCIA ARTIFICIAL -->
            <div class="w-full max-w-4xl mx-auto mt-8 px-6">
                <div class="ai-input-container rounded-2xl p-2.5 flex items-center gap-3">
                    <div class="p-3 bg-[#0a0a0b] rounded-xl border border-[var(--border-color)] shadow-inner">
                        <i data-lucide="sparkles" class="w-5 h-5 text-blue-400"></i>
                    </div>
                    <input type="text" id="ai-prompt" placeholder="Ej: Crea un menú de tienda, un menú de warps de 4 filas, un selector de modalidades, un menú de rangos..." 
                           class="flex-1 bg-transparent border-none outline-none text-[15px] text-gray-200 placeholder-gray-500 font-light"
                           onkeypress="if(event.key === 'Enter') generateMenuAI()">
                    <button onclick="generateMenuAI()" class="px-6 py-3.5 rounded-xl bg-blue-500/10 hover:bg-blue-500 hover:text-white text-blue-400 border border-blue-500/20 font-bold text-sm transition-all flex items-center gap-2">
                        Generar Magia
                    </button>
                </div>
                <div id="ai-status" class="text-center mt-3 text-sm text-blue-400 opacity-0 transition-opacity font-medium h-5 tracking-wide">
                    Procesando y construyendo estructura...
                </div>
            </div>

            <!-- CANVAS DEL INVENTARIO -->
            <div class="flex-1 flex justify-center items-center p-8 min-h-[550px]">
                <div class="relative">
                    <!-- Glow background -->
                    <div class="absolute inset-0 bg-blue-500/5 blur-[100px] rounded-full pointer-events-none"></div>
                    
                    <div class="flex items-center justify-between mb-4 px-2 relative z-10">
                        <span id="live-title" class="font-bold text-xl font-mono text-white tracking-wide" style="text-shadow: 2px 2px 0 #000, 0 0 10px rgba(255,255,255,0.2);">&8Menú Principal</span>
                        <span class="text-xs text-gray-400 font-mono bg-[#141516] px-4 py-1.5 rounded-lg border border-[var(--border-color)] shadow-inner" id="size-indicator">54 Slots</span>
                    </div>
                    
                    <div class="mc-inventory relative z-10">
                        <div id="grid-canvas" class="grid grid-cols-9 gap-[3px]">
                            <!-- Slots se inyectan por JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL LATERAL DINÁMICO (Inspector) -->
        <div class="w-[400px] side-panel flex flex-col shrink-0 shadow-2xl z-20">
            
            <!-- Encabezado del Panel -->
            <div class="p-5 border-b border-[var(--border-color)] flex items-center justify-between bg-[var(--bg-surface)] sticky top-0 z-10">
                <h2 id="panel-title" class="text-[15px] font-bold tracking-wide flex items-center gap-2 text-white">
                    <i data-lucide="settings" class="w-4 h-4 text-blue-400"></i> Propiedades Globales
                </h2>
                <button id="btn-close-item" onclick="deselectSlot()" class="hidden p-2 bg-rose-500/10 hover:bg-rose-500 hover:text-white rounded-lg text-rose-400 transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- VISTA 1: GLOBAL -->
            <div id="view-global" class="p-6 space-y-6">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Identificador (YML)</label>
                    <input type="text" id="menu-id" value="menu_principal" class="w-full bg-[#0a0a0b] border border-[var(--border-color)] rounded-xl px-4 py-3.5 text-sm outline-none focus:border-blue-400 transition-colors font-mono text-blue-300 shadow-inner">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Título Visual (& colores)</label>
                    <input type="text" id="menu-title" value="&8Menú Principal" class="w-full bg-[#0a0a0b] border border-[var(--border-color)] rounded-xl px-4 py-3.5 text-sm outline-none focus:border-blue-400 transition-colors shadow-inner">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Capacidad del Cofre</label>
                    <select id="menu-rows" class="w-full bg-[#0a0a0b] border border-[var(--border-color)] rounded-xl px-4 py-3.5 text-sm outline-none focus:border-blue-400 transition-colors cursor-pointer shadow-inner">
                        <option value="1">1 Fila (9 slots)</option>
                        <option value="2">2 Filas (18 slots)</option>
                        <option value="3">3 Filas (27 slots)</option>
                        <option value="4">4 Filas (36 slots)</option>
                        <option value="5">5 Filas (45 slots)</option>
                        <option value="6" selected>6 Filas (54 slots)</option>
                    </select>
                </div>

                <div class="p-4 rounded-xl bg-blue-500/5 border border-blue-500/10 text-sm text-blue-200 leading-relaxed">
                    <i data-lucide="mouse-pointer-click" class="w-4 h-4 inline-block mb-1 text-blue-400"></i> 
                    Para empezar a construir, haz clic en cualquier casilla vacía del inventario en el centro de la pantalla.
                </div>
            </div>

            <!-- VISTA 2: EDITOR DE ÍTEM -->
            <div id="view-item" class="p-6 space-y-5 hidden">
                
                <!-- Selector de Tipo -->
                <div class="flex gap-2 p-1.5 bg-[#0a0a0b] rounded-xl border border-[var(--border-color)] shadow-inner">
                    <button onclick="switchContextType('normal')" id="ctx-normal" class="flex-1 text-xs font-bold py-2.5 rounded-lg bg-[#2a2b2f] text-white shadow-sm transition-all">Objeto Normal</button>
                    <button onclick="switchContextType('custom_head')" id="ctx-custom_head" class="flex-1 text-xs font-bold py-2.5 rounded-lg text-gray-500 hover:text-white transition-all">Cabeza Custom</button>
                </div>

                <!-- Input de Material con Botón de Catálogo -->
                <div id="material-box">
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider flex justify-between items-center">
                        <span>ID del Material</span>
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="item-material" placeholder="DIAMOND_SWORD" class="flex-1 bg-[#0a0a0b] border border-[var(--border-color)] rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-400 font-mono uppercase shadow-inner">
                        <button onclick="openCatalog()" id="btn-open-catalog" class="px-4 bg-blue-500/10 hover:bg-blue-500 hover:text-white text-blue-400 border border-blue-500/20 rounded-xl transition-colors flex items-center justify-center">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-3">
                    <div class="col-span-3">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Nombre a mostrar</label>
                        <input type="text" id="item-name" placeholder="&eEspada Legendaria" class="w-full bg-[#0a0a0b] border border-[var(--border-color)] rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-400 shadow-inner">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider text-center">Cant.</label>
                        <input type="number" id="item-amount" value="1" min="1" max="64" class="w-full bg-[#0a0a0b] border border-[var(--border-color)] rounded-xl px-2 py-3 text-sm outline-none focus:border-blue-400 text-center font-mono shadow-inner">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider flex justify-between">
                        <span>Descripción (Lore)</span>
                        <span class="text-[10px] text-gray-600 normal-case">Una línea por Enter</span>
                    </label>
                    <textarea id="item-lore" rows="3" placeholder="&7Daño: &c+10&#10;&7Rareza: &6Épica" class="w-full bg-[#0a0a0b] border border-[var(--border-color)] rounded-xl p-3.5 text-sm outline-none focus:border-blue-400 resize-none font-mono shadow-inner leading-relaxed"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider flex justify-between">
                        <span>Comandos / Acciones</span>
                    </label>
                    <div class="flex flex-wrap gap-1.5 mb-2.5">
                        <button onclick="injectCmd('[player] ')" class="text-[10px] font-mono bg-[#1e1f22] hover:bg-[#2a2b2f] border border-[var(--border-color)] px-2.5 py-1.5 rounded-md text-blue-300 transition-colors">[player]</button>
                        <button onclick="injectCmd('[console] ')" class="text-[10px] font-mono bg-[#1e1f22] hover:bg-[#2a2b2f] border border-[var(--border-color)] px-2.5 py-1.5 rounded-md text-amber-300 transition-colors">[console]</button>
                        <button onclick="injectCmd('[opengui] ')" class="text-[10px] font-mono bg-[#1e1f22] hover:bg-[#2a2b2f] border border-[var(--border-color)] px-2.5 py-1.5 rounded-md text-purple-300 transition-colors">[opengui]</button>
                        <button onclick="injectCmd('[close]')" class="text-[10px] font-mono bg-[#1e1f22] hover:bg-[#2a2b2f] border border-[var(--border-color)] px-2.5 py-1.5 rounded-md text-rose-300 transition-colors">[close]</button>
                    </div>
                    <textarea id="item-commands" rows="2" placeholder="[player] spawn" class="w-full bg-[#0a0a0b] border border-[var(--border-color)] rounded-xl p-3.5 text-sm outline-none focus:border-blue-400 resize-none font-mono shadow-inner leading-relaxed"></textarea>
                </div>

                <div class="flex gap-3 pt-4 border-t border-[var(--border-color)]">
                    <button onclick="saveItem()" class="flex-1 bg-blue-500 hover:bg-blue-400 text-white font-bold py-3.5 rounded-xl text-sm transition-all shadow-[0_0_15px_rgba(59,130,246,0.3)] flex justify-center items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Guardar Cambios
                    </button>
                    <button onclick="deleteItem()" title="Eliminar ítem del slot" class="px-5 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-xl hover:bg-rose-500 hover:text-white transition-all flex justify-center items-center">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- MODALES DE LA APLICACIÓN -->

    <!-- MODAL YAML CODE -->
    <div id="yaml-modal" class="fixed inset-0 z-50 flex justify-center items-center hidden opacity-0 transition-opacity modal-overlay">
        <div class="bg-[#141516] border border-[#2a2b2f] rounded-2xl w-full max-w-4xl h-[85vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform" id="yaml-modal-content">
            <div class="flex justify-between items-center p-5 border-b border-[#2a2b2f] bg-[#0a0a0b]">
                <h3 class="text-lg font-bold flex items-center gap-2 text-white"><i data-lucide="file-code-2" class="w-5 h-5 text-blue-400"></i> Código YAML Generado</h3>
                <div class="flex gap-3">
                    <button onclick="copyCode()" id="copy-btn" class="text-sm px-5 py-2.5 bg-blue-500 hover:bg-blue-400 text-white rounded-xl transition-colors flex items-center gap-2 font-bold shadow-lg">
                        <i data-lucide="copy" class="w-4 h-4"></i> Copiar Todo
                    </button>
                    <button onclick="closeModal('yaml-modal', 'yaml-modal-content')" class="text-sm px-5 py-2.5 bg-[#1e1f22] text-gray-300 hover:bg-[#2a2b2f] hover:text-white rounded-xl transition-colors font-medium border border-[#2a2b2f]">
                        Cerrar
                    </button>
                </div>
            </div>
            <textarea id="yaml-code" readonly class="flex-1 w-full bg-[#0a0a0b] p-6 text-[13px] font-mono text-emerald-400 resize-none outline-none overflow-y-auto leading-relaxed whitespace-pre"></textarea>
        </div>
    </div>

    <!-- MODAL CATÁLOGO DE MATERIALES / CABEZAS -->
    <div id="catalog-modal" class="fixed inset-0 z-50 flex justify-center items-center hidden opacity-0 transition-opacity modal-overlay">
        <div class="bg-[#141516] border border-[#2a2b2f] rounded-2xl w-full max-w-5xl h-[85vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform" id="catalog-modal-content">
            
            <div class="flex justify-between items-center p-5 border-b border-[#2a2b2f] bg-[#0a0a0b]">
                <div class="flex items-center gap-4 flex-1">
                    <h3 id="catalog-title" class="text-lg font-bold flex items-center gap-2 text-white w-64">
                        <i data-lucide="library" class="w-5 h-5 text-blue-400"></i> Catálogo Visual
                    </h3>
                    
                    <div class="flex-1 max-w-md relative">
                        <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-3 top-3"></i>
                        <input type="text" id="catalog-search" oninput="filterCatalog()" placeholder="Buscar material o cabeza..." class="w-full bg-[#1e1f22] border border-[#2a2b2f] rounded-xl pl-10 pr-4 py-2.5 text-sm outline-none focus:border-blue-400 text-white placeholder-gray-500 transition-colors">
                    </div>
                </div>

                <button onclick="closeModal('catalog-modal', 'catalog-modal-content')" class="p-2 bg-rose-500/10 hover:bg-rose-500 hover:text-white rounded-lg text-rose-400 transition-colors ml-4">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 bg-[#0a0a0b]" id="catalog-container">
                <!-- Se inyecta la cuadrícula desde JS -->
            </div>
        </div>
    </div>

    <!-- MAIN LOGIC ENGINE -->
    <script>
        // MASIVA BASE DE DATOS DE MATERIALES
        const MC_MATERIALS = [
            "DIAMOND_SWORD", "IRON_SWORD", "GOLDEN_SWORD", "STONE_SWORD", "WOODEN_SWORD", "NETHERITE_SWORD",
            "BOW", "CROSSBOW", "TRIDENT", "SHIELD", "ARROW", "SPECTRAL_ARROW",
            "DIAMOND_PICKAXE", "IRON_PICKAXE", "GOLDEN_PICKAXE", "STONE_PICKAXE", "WOODEN_PICKAXE", "NETHERITE_PICKAXE",
            "DIAMOND_AXE", "IRON_AXE", "GOLDEN_AXE", "STONE_AXE", "WOODEN_AXE", "NETHERITE_AXE",
            "DIAMOND_SHOVEL", "IRON_SHOVEL", "GOLDEN_SHOVEL", "STONE_SHOVEL", "WOODEN_SHOVEL", "NETHERITE_SHOVEL",
            "DIAMOND_HOE", "IRON_HOE", "GOLDEN_HOE", "STONE_HOE", "WOODEN_HOE", "NETHERITE_HOE",
            "DIAMOND_HELMET", "DIAMOND_CHESTPLATE", "DIAMOND_LEGGINGS", "DIAMOND_BOOTS",
            "IRON_HELMET", "IRON_CHESTPLATE", "IRON_LEGGINGS", "IRON_BOOTS",
            "GOLDEN_HELMET", "GOLDEN_CHESTPLATE", "GOLDEN_LEGGINGS", "GOLDEN_BOOTS",
            "LEATHER_HELMET", "LEATHER_CHESTPLATE", "LEATHER_LEGGINGS", "LEATHER_BOOTS",
            "CHAINMAIL_HELMET", "CHAINMAIL_CHESTPLATE", "CHAINMAIL_LEGGINGS", "CHAINMAIL_BOOTS",
            "NETHERITE_HELMET", "NETHERITE_CHESTPLATE", "NETHERITE_LEGGINGS", "NETHERITE_BOOTS", "TURTLE_HELMET",
            "DIAMOND", "EMERALD", "GOLD_INGOT", "IRON_INGOT", "NETHERITE_INGOT", "NETHERITE_SCRAP", 
            "COAL", "CHARCOAL", "REDSTONE", "LAPIS_LAZULI", "QUARTZ", "COPPER_INGOT", "RAW_GOLD", "RAW_IRON", "RAW_COPPER",

        const MC_COLORS = {
            '0': '#000000', '1': '#0000AA', '2': '#00AA00', '3': '#00AAAA', '4': '#AA0000', '5': '#AA00AA', '6': '#FFAA00', '7': '#AAAAAA',
            '8': '#555555', '9': '#5555FF', 'a': '#55FF55', 'b': '#55FFFF', 'c': '#FF5555', 'd': '#FF55FF', 'e': '#FFFF55', 'f': '#FFFFFF'
        };

        function parseMCColor(text) {
            if (!text) return '';
            let parts = text.split('&');
            if(parts.length === 1) return parts[0];
            let html = parts[0];
            for (let i = 1; i < parts.length; i++) {
                let code = parts[i].charAt(0).toLowerCase();
                let rest = parts[i].substring(1);
                if (MC_COLORS[code]) html += `<span style="color: ${MC_COLORS[code]}; ${code==='l'?'font-weight:bold;':''}">${rest}</span>`;
                else if (code === 'l') html += `<span style="font-weight: bold;">${rest}</span>`;
                else if (code === 'r') html += `</span>${rest}`;
                else html += `&${parts[i]}`;
            }
            return html;
        }

        const ASSET_BASE = "https://cdn.jsdelivr.net/gh/InventivetalentDev/minecraft-assets@1.20.1/assets/minecraft/textures";

        function getSafeMaterialName(mat) {
            let clean = mat.toLowerCase().replace(/ /g, "_");
            // Truco: Para los paneles de cristal usados de borde, usaremos la textura del bloque completo, así se ve perfectamente coloreado.
            if (clean.includes("stained_glass_pane")) {
                return clean.replace("_pane", "");
            }
            if (clean === "wood" || clean === "log") return "oak_log";
            return clean;
        }

        function getHeadUrl(mat) {
            let headName = mat.replace(/HEAD;/i, '').trim();
            if (headName.includes('%')) return 'https://mc-heads.net/avatar/Steve/64'; 
            return `https://mc-heads.net/avatar/${headName}/64`;
        }

        function renderCanvas() {
            const canvas = document.getElementById('grid-canvas');
            canvas.innerHTML = '';
            const total = STATE.rows * 9;

            for (let i = 0; i < total; i++) {
                const slot = document.createElement('div');
                slot.className = `mc-slot flex flex-col items-center justify-center p-1 text-[10px] ${STATE.selectedSlot === i ? 'active' : ''}`;
                
                if (STATE.items[i]) {
                    const node = STATE.items[i];
                    let pName = parseMCColor(node.name || node.material);
                    
                    let isHead = node.type === 'custom_head' || node.material.toUpperCase().startsWith('HEAD;');
                    
                    if (isHead) {
                        let headUrl = getHeadUrl(node.material);
                        slot.innerHTML = `
                            <img src="${headUrl}" class="slot-img mb-0.5 z-10 rounded-sm border border-black/30" alt="head">
                            ${node.amount > 1 ? `<span class="absolute bottom-1 right-1 text-white font-mono text-[13px] font-bold drop-shadow-[2px_2px_0_#000] z-20">${node.amount}</span>` : ''}
                            <div class="mc-tooltip text-left min-w-[150px]">
                                <p class="font-bold text-white text-sm">${(node.name || node.material).replace(/&[0-9a-fk-or]/gi, '')}</p>
                                ${node.lore && node.lore.length > 0 ? `<div class="mt-2 pt-2 border-t border-gray-600/50 text-xs text-gray-300 space-y-1">${node.lore.map(l => `<p>${parseMCColor(l)}</p>`).join('')}</div>` : ''}
                            </div>
                        `;
                    } else {
                        let cleanMat = getSafeMaterialName(node.material);
                        let urlItem = `${ASSET_BASE}/item/${cleanMat}.png`;
                        let urlBlock = `${ASSET_BASE}/block/${cleanMat}.png`;
                        let urlBarrier = `${ASSET_BASE}/item/barrier.png`;

                        // Lógica de fallback súper robusta:
                        // Intenta cargar como ITEM -> Si falla, intenta como BLOCK -> Si falla, pone una BARRERA.
                        slot.innerHTML = `
                            <img src="${urlItem}" 
                                 onerror="this.onerror=null; this.src='${urlBlock}'; setTimeout(() => { if(this.naturalWidth === 0) this.src='${urlBarrier}'; }, 50);" 
                                 class="slot-img mb-0.5 z-10" alt="${cleanMat}">
                            ${node.amount > 1 ? `<span class="absolute bottom-1 right-1 text-white font-mono text-[13px] font-bold drop-shadow-[2px_2px_0_#000] z-20">${node.amount}</span>` : ''}
                            <div class="mc-tooltip text-left min-w-[150px]">

                            </div>
                        `;
                    }
                }

                slot.onclick = () => selectSlot(i);
                canvas.appendChild(slot);
            }

        function selectSlot(id) {
            STATE.selectedSlot = id;
            document.getElementById('view-global').classList.add('hidden');

            document.getElementById('btn-close-item').classList.remove('hidden');
            document.getElementById('panel-title').innerHTML = `<i data-lucide="box" class="w-4 h-4 text-blue-400"></i> Editando Casilla ${id}`;
            
            lucide.createIcons();
            renderCanvas();

            if (STATE.items[id]) {
                const t = STATE.items[id];
                switchContextType(t.type);
                document.getElementById('item-material').value = t.material;
                document.getElementById('item-name').value = t.name || '';
                document.getElementById('item-amount').value = t.amount || 1;
                document.getElementById('item-lore').value = t.lore ? t.lore.join('\n') : '';
                document.getElementById('item-commands').value = t.commands ? t.commands.join('\n') : '';
            } else {
                switchContextType('normal');
                document.getElementById('item-material').value = '';
                document.getElementById('item-name').value = '';
                document.getElementById('item-amount').value = '1';
                document.getElementById('item-lore').value = '';
                document.getElementById('item-commands').value = '';

        function saveItem() {
            if(STATE.selectedSlot === null) return;
            const mat = document.getElementById('item-material').value.trim();
            if(!mat) return;

            STATE.items[STATE.selectedSlot] = {
                type: STATE.activeType,
                material: mat,
                name: document.getElementById('item-name').value.trim(),
                amount: parseInt(document.getElementById('item-amount').value) || 1,
                lore: document.getElementById('item-lore').value.split('\n').filter(l => l.trim()),
                commands: document.getElementById('item-commands').value.split('\n').filter(c => c.trim())
            };
            renderCanvas();
            updateYAML();
        }

        function renderCatalogGrid(filterText) {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '<div class="catalog-grid" id="c-grid"></div>';
            const grid = document.getElementById('c-grid');
            
            const isNormal = STATE.activeType === 'normal';
            const term = filterText.toLowerCase();
            
            if (isNormal) {
                MC_MATERIALS.forEach(mat => {
                    if(mat.toLowerCase().includes(term)) {
                        const item = document.createElement('div');
                        item.className = 'catalog-item';
                        
                        let cleanMat = getSafeMaterialName(mat);
                        let urlItem = `${ASSET_BASE}/item/${cleanMat}.png`;
                        let urlBlock = `${ASSET_BASE}/block/${cleanMat}.png`;
                        let urlBarrier = `${ASSET_BASE}/item/barrier.png`;
                        
                        item.innerHTML = `
                            <img src="${urlItem}" onerror="this.onerror=null; this.src='${urlBlock}'; setTimeout(() => { if(this.naturalWidth === 0) this.src='${urlBarrier}'; }, 50);" alt="${mat}">
                            <span class="text-[10px] text-gray-300 font-mono break-all leading-tight">${mat}</span>
                        `;
                        item.onclick = () => {
                            document.getElementById('item-material').value = mat;
                            closeModal('catalog-modal', 'catalog-modal-content');
                            saveItem();
                        };
                        grid.appendChild(item);
                    }
                });
            } else {
                MC_HEADS.forEach(head => {
                    if(head.id.toLowerCase().includes(term) || head.label.toLowerCase().includes(term)) {
                        const item = document.createElement('div');
                        item.className = 'catalog-item';
                        item.innerHTML = `
                            <img src="https://mc-heads.net/avatar/${head.id}/64" alt="${head.label}">

                            }
                            closeModal('catalog-modal', 'catalog-modal-content');
                            saveItem();
                        };
                        grid.appendChild(item);
                    }
                });
            }
        }

                }
                // 6. RANGOS
                else if (prompt.includes('rango') || prompt.includes('rank')) {
                    STATE.menuTitle = '&8Información de Rangos';
                    STATE.menuId = 'rangos';
                    STATE.items[mid + 1] = { type: 'normal', material: 'COAL', name: '&8Rango Usuario', amount: 1, lore: ['&7El rango por defecto'], commands: [] };
                    STATE.items[mid + 3] = { type: 'normal', material: 'IRON_INGOT', name: '&fRango VIP', amount: 1, lore: ['&7Ventajas especiales'], commands: ['[player] buy vip'] };
                    STATE.items[mid + 5] = { type: 'normal', material: 'GOLD_INGOT', name: '&eRango PRO', amount: 1, lore: ['&7Más comandos y kits'], commands: ['[player] buy pro'] };
                    STATE.items[mid + 7] = { type: 'normal', material: 'DIAMOND', name: '&bRango ÉLITE', amount: 1, lore: ['&7¡El mejor rango de todos!'], commands: ['[player] buy elite'] };
                }
                // 7. TRABAJOS (JOBS)
                else if (prompt.includes('trabajo') || prompt.includes('job')) {
                    STATE.menuTitle = '&8Agencia de Empleo';
                    STATE.menuId = 'jobs';
                    STATE.items[mid + 1] = { type: 'normal', material: 'DIAMOND_PICKAXE', name: '&7Minero', amount: 1, lore: ['&7Gana dinero picando'], commands: ['[player] jobs join minero'] };
                    STATE.items[mid + 3] = { type: 'normal', material: 'DIAMOND_AXE', name: '&2Leñador', amount: 1, lore: ['&7Gana dinero talando'], commands: ['[player] jobs join lenador'] };
                    STATE.items[mid + 5] = { type: 'normal', material: 'DIAMOND_HOE', name: '&eGranjero', amount: 1, lore: ['&7Gana dinero cultivando'], commands: ['[player] jobs join granjero'] };
                    STATE.items[mid + 7] = { type: 'normal', material: 'DIAMOND_SWORD', name: '&cCazador', amount: 1, lore: ['&7Gana dinero matando mobs'], commands: ['[player] jobs join cazador'] };
                }
                // 8. MASCOTAS
                else if (prompt.includes('mascota') || prompt.includes('pet')) {
                    STATE.menuTitle = '&8Tus Mascotas';
                    STATE.menuId = 'mascotas';
                    STATE.items[mid + 2] = { type: 'custom_head', material: 'MHF_Pig', name: '&dCerdito', amount: 1, lore: ['&7Invocar mascota'], commands: ['[player] pet call pig'] };
                    STATE.items[mid + 4] = { type: 'custom_head', material: 'MHF_Cow', name: '&fVaca', amount: 1, lore: ['&7Invocar mascota'], commands: ['[player] pet call cow'] };
                    STATE.items[mid + 6] = { type: 'custom_head', material: 'MHF_Chicken', name: '&ePollo', amount: 1, lore: ['&7Invocar mascota'], commands: ['[player] pet call chicken'] };
                }
                // 9. PANEL DE ADMIN
                else if (prompt.includes('admin') || prompt.includes('staff')) {
                    STATE.menuTitle = '&4&lPanel de Administración';
                    STATE.menuId = 'admin_panel';
                    STATE.items[10] = { type: 'normal', material: 'DIAMOND_SWORD', name: '&cModo Supervivencia', amount: 1, lore: ['&7Cambiar a gamemode 0'], commands: ['[player] gm 0'] };
                    STATE.items[12] = { type: 'normal', material: 'GRASS_BLOCK', name: '&aModo Creativo', amount: 1, lore: ['&7Cambiar a gamemode 1'], commands: ['[player] gm 1'] };
                    STATE.items[14] = { type: 'normal', material: 'ENDER_PEARL', name: '&bVanish', amount: 1, lore: ['&7Ocultarse de jugadores'], commands: ['[player] vanish'] };
                    STATE.items[16] = { type: 'normal', material: 'CLOCK', name: '&eTiempo: Día', amount: 1, lore: ['&7Hacer de día'], commands: ['[console] time set day'] };
                }
                // 10. DEFAULT (GENÉRICO)
                else {
                    STATE.menuTitle = '&8Menú Personalizado';
                    STATE.menuId = 'menu_custom';
                    STATE.items[mid + 4] = { type: 'normal', material: 'COMPASS', name: '&bMenú Principal', amount: 1, lore: ['&7Usa comandos para configurar'], commands: [] };
                }

                // Generar Bordes Inteligentes
                if(prompt.includes('borde') || prompt.includes('decorado') || prompt.includes('cristales')) {
                    for(let i=0; i<total; i++) {
                        if (i < 9 || i >= (total - 9) || i % 9 === 0 || i % 9 === 8) {
                            if (!STATE.items[i]) STATE.items[i] = { type: 'normal', material: 'BLACK_STAINED_GLASS_PANE', name: ' ', amount: 1, lore: [], commands: [] };
                        }
                    }
                }

                // Generar botón de cerrar automático en la parte inferior central
                const centerBottom = total - 5;
                if (!STATE.items[centerBottom] && STATE.rows >= 3) {
                    STATE.items[centerBottom] = { type: 'normal', material: 'BARRIER', name: '&c&lCerrar Menú', amount: 1, lore: ['&7Cierra esta ventana'], commands: ['[close]'] };
                }

                // Actualizar UI
                document.getElementById('menu-rows').value = STATE.rows;
                document.getElementById('menu-title').value = STATE.menuTitle;
                document.getElementById('menu-id').value = STATE.menuId;
                document.getElementById('live-title').innerHTML = parseMCColor(STATE.menuTitle);
                document.getElementById('size-indicator').innerText = (STATE.rows * 9) + ' Slots';

                input.value = '';
                status.innerText = '¡Menú estructurado con éxito! 🎉';
                
                deselectSlot();
                updateYAML();

                setTimeout(() => { status.style.opacity = '0'; }, 3000);
            }, 1000);
        }

        // --- UTILIDADES GLOBALES ---
        function fillEmptyWithGlass() {
            const total = STATE.rows * 9;
            for(let i=0; i<total; i++) {
                if (!STATE.items[i]) STATE.items[i] = { type: 'normal', material: 'GRAY_STAINED_GLASS_PANE', name: ' ', amount: 1, lore: [], commands: [] };
            }
            renderCanvas(); updateYAML();
        }

        function clearAllData() {
            if(confirm('¿Seguro que deseas limpiar todo el canvas? Esta acción es irreversible.')){
                STATE.items = {};
                deselectSlot(); updateYAML();
            }
        }

        function injectCmd(cmd) {
            const el = document.getElementById('item-commands');
            el.value += (el.value ? '\n' : '') + cmd;
            el.focus();
        }

        function setupListeners() {
            document.getElementById('menu-title').addEventListener('input', e => {
                STATE.menuTitle = e.target.value;
                document.getElementById('live-title').innerHTML = parseMCColor(e.target.value) || 'GUI';
                updateYAML();
            });
            document.getElementById('menu-rows').addEventListener('change', e => {
                STATE.rows = parseInt(e.target.value);
                document.getElementById('size-indicator').innerText = (STATE.rows * 9) + ' Slots';
                deselectSlot(); updateYAML();
            });
            document.getElementById('menu-id').addEventListener('input', e => { STATE.menuId = e.target.value; updateYAML(); });
        }

        // --- EXPORTACIÓN YAML ---
        function updateYAML() {
            const totalSlots = STATE.rows * 9;
            let yaml = `menu_title: '${STATE.menuTitle}'\nopen_command: ${STATE.menuId}\nsize: ${totalSlots}\nitems:\n`;

            for(let slot = 0; slot < totalSlots; slot++) {
                if(!STATE.items[slot]) continue;
                const n = STATE.items[slot];
                yaml += `  'item_${slot}':\n`;
                yaml += `    material: ${n.type === 'custom_head' ? "'head;" + n.material + "'" : n.material.toUpperCase()}\n`;
                yaml += `    slot: ${slot}\n`;
                if(n.amount > 1) yaml += `    amount: ${n.amount}\n`;
                if(n.name) yaml += `    display_name: '${n.name}'\n`;
                
                if(n.lore && n.lore.length > 0) {
                    yaml += `    lore:\n`;
                    n.lore.forEach(l => yaml += `    - '${l}'\n`);
                }
                if(n.commands && n.commands.length > 0) {
                    yaml += `    left_click_commands:\n`;
                    n.commands.forEach(c => yaml += `    - '${c}'\n`);
                    yaml += `    right_click_commands:\n`;
                    n.commands.forEach(c => yaml += `    - '${c}'\n`);
                }
                yaml += `\n`;
            }
            document.getElementById('yaml-code').value = yaml;
        }

        function openYAMLModal() {
            const modal = document.getElementById('yaml-modal');
            const content = document.getElementById('yaml-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeModal(modalId, contentId) {
            const modal = document.getElementById(modalId);
            const content = document.getElementById(contentId);
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function copyCode() {
            const area = document.getElementById('yaml-code');
            area.select(); document.execCommand('copy');
            const btn = document.getElementById('copy-btn');
            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> ¡Copiado con Éxito!`;
            setTimeout(() => { btn.innerHTML = `<i data-lucide="copy" class="w-4 h-4"></i> Copiar Todo`; lucide.createIcons(); }, 2500);
        }
    </script>
</body>
</html>
