<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Short 2.5D Engine — Mundo 3D Real + Cámara Dinámica (Sin APIs)</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #141923;
      --panel-alt: #1c2230;
      --border: #2b3448;
      --text: #eef1f7;
      --muted: #93a1b9;
      --primary: #4f7cff;
      --accent: #00c2a8;
      --export: #ff4d6d;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar h1 { margin: 0; font-size: 1.12rem; }
    .subtitle { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }

    .badge {
      background: var(--accent);
      color: #06211c;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      vertical-align: middle;
    }

    .status-pill {
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, 1.1fr) minmax(320px, 0.9fr);
      gap: 18px;
      padding: 18px;
      max-width: 1520px;
      margin: 0 auto;
    }

    @media (max-width: 960px) {
      .workspace { grid-template-columns: 1fr; }
    }

    .panel { display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
    }

    .card h2 { margin: 0 0 10px; font-size: 0.98rem; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .card-header h2 { margin: 0; }

    textarea, select {
      width: 100%;
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font: inherit;
      font-size: 0.88rem;
    }

    textarea { resize: vertical; line-height: 1.5; }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .checkbox-label {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      color: var(--text);
      cursor: pointer;
    }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
    .toggles-grid { display: flex; flex-wrap: wrap; gap: 16px; margin: 10px 0; }
    .preset-row, .actions-row { display: flex; gap: 8px; align-items: center; }
    .preset-row { flex: 1; min-width: 240px; }
    .actions-row { margin-top: 12px; gap: 10px; }

    button, .download-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: opacity 0.15s ease;
    }

    button:hover, .download-btn:hover { opacity: 0.9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); }
    .btn-export { background: var(--export); color: #fff; width: 100%; padding: 12px; font-size: 0.96rem; }

    .scenes-summary {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
    }

    .scene-pill {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
    }

    .scene-pill strong { color: var(--accent); }
    .scene-pill small { display: block; color: var(--muted); margin-top: 2px; }

    .preview-card { position: sticky; top: 16px; }

    .phone-frame {
      width: min(350px, 100%);
      aspect-ratio: 9 / 16;
      margin: 0 auto 12px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border);
    }

    #previewCanvas { width: 100%; height: 100%; display: block; }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .time-display {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .scrubber { width: 100%; margin-bottom: 8px; }
    .status-banner { margin: 4px 0 0; font-size: 0.82rem; color: #b7c4e0; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .progress-wrap { margin-top: 12px; }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--panel-alt);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }

    .export-result {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .export-result video {
      width: min(260px, 100%);
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      border-radius: 10px;
      background: #000;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Short 2.5D Engine <span class="badge">MUNDO 3D REAL + CÁMARA MÓVIL</span></h1>
      <p class="subtitle">Cada historia genera su propio mundo 3D, cámara orbitando/volando, música + SFX y MP4 9:16</p>
    </div>
    <div id="codecSupportBadge" class="status-pill">Iniciando...</div>
  </header>

  <main class="workspace">
    <!-- PANEL IZQUIERDO -->
    <section class="panel controls-panel">
      <div class="card">
        <div class="card-header">
          <h2>1. Tu Guion o Idea</h2>
          <div class="preset-row">
            <select id="presetSelect">
              <option value="boston">Boston 1919: La inundación de melaza</option>
              <option value="hacker">Un hacker robó un banco con una tostadora</option>
              <option value="espacio">El astronauta que quedó atrapado en órbita</option>
              <option value="torre_eiffel">El estafador que vendió la Torre Eiffel</option>
              <option value="pepsi">El día que Pepsi tuvo submarinos militares</option>
              <option value="faraon">El secreto enterrado bajo la pirámide</option>
            </select>
            <button id="loadPresetBtn" type="button" class="btn-secondary">Cargar</button>
          </div>
        </div>

        <textarea id="storyInput" rows="7" placeholder="Escribe cualquier historia nueva aquí (aunque sea corta). Cada historia genera automáticamente nuevos escenarios 3D, colores, personajes y movimientos de cámara..."></textarea>

        <div class="grid-3" style="margin-top:10px;">
          <label>
            Resolución
            <select id="resolutionSelect">
              <option value="720x1280" selected>720×1280 (Rápido)</option>
              <option value="1080x1920">1080×1920 (Full HD)</option>
            </select>
          </label>
          <label>
            FPS
            <select id="fpsSelect">
              <option value="30" selected>30 FPS</option>
              <option value="60">60 FPS</option>
            </select>
          </label>
          <label>
            Subtítulos
            <select id="subtitleModeSelect">
              <option value="on" selected>Activados al ritmo</option>
              <option value="off">Solo rótulo superior</option>
            </select>
          </label>
        </div>

        <div class="toggles-grid">
          <label class="checkbox-label">
            <input type="checkbox" id="musicToggle" checked />
            Música cinematográfica
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="sfxToggle" checked />
            Efectos de sonido (SFX)
          </label>
        </div>

        <div class="actions-row">
          <button id="buildShortBtn" type="button" class="btn-primary" style="flex:1">⚡ Crear Short 3D desde mi Historia</button>
          <button id="remixVisualsBtn" type="button" class="btn-secondary" title="Cambia semilla visual si quieres otra estética">🎲 Variar Visuales</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>2. Escenas Generadas Automáticamente (<span id="sceneCount">0</span>)</h2>
        </div>
        <div id="scenesSummary" class="scenes-summary"></div>
      </div>
    </section>

    <!-- PANEL DERECHO -->
    <section class="panel preview-panel">
      <div class="card preview-card">
        <div class="phone-frame">
          <canvas id="previewCanvas" width="540" height="960"></canvas>
        </div>

        <div class="player-controls">
          <button id="playPauseBtn" type="button" class="btn-primary">▶ Reproducir Preview</button>
          <button id="restartBtn" type="button" class="btn-secondary">⟲ Reiniciar</button>
          <span id="timeDisplay" class="time-display">00.0s / 00.0s</span>
        </div>

        <input type="range" id="timelineScrubber" min="0" max="100" step="0.01" value="0" class="scrubber" />
        <p id="statusBanner" class="status-banner">Listo.</p>

        <hr class="divider" />

        <button id="exportMp4Btn" type="button" class="btn-export">🎬 Exportar Short en MP4 (9:16)</button>

        <div id="exportProgressWrap" class="progress-wrap hidden">
          <div class="progress-track">
            <div id="exportProgressBar" class="progress-fill"></div>
          </div>
          <p id="exportProgressText">Preparando...</p>
        </div>

        <div id="exportResultWrap" class="export-result hidden">
          <h3>¡Short MP4 listo!</h3>
          <video id="exportedVideoPreview" controls playsinline></video>
          <a id="downloadMp4Link" class="btn-primary download-btn" download="short-25d.mp4">⬇ Descargar MP4</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    // =========================================================================
    // 0. CARGADOR NO BLOQUEANTE DE MP4-MUXER
    // =========================================================================
    function loadScriptAsync(url) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url; s.async = true;
        s.onload = () => resolve(true);
        s.onerror = () => reject(new Error('No se pudo cargar ' + url));
        document.head.appendChild(s);
      });
    }

    async function ensureMp4MuxerLoaded() {
      if (typeof window.Mp4Muxer !== 'undefined') return true;
      for (const url of [
        'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js',
        'https://unpkg.com/mp4-muxer@5.2.2/build/mp4-muxer.js'
      ]) {
        try {
          await Promise.race([loadScriptAsync(url), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);
          if (typeof window.Mp4Muxer !== 'undefined') return true;
        } catch (_) {}
      }
      return false;
    }

    // =========================================================================
    // 1. AUDIO: SOLO MÚSICA + SFX DINÁMICOS (SIN VOZ)
    // =========================================================================
    window.AudioEngine = (() => {
      const SR = 48000;
      let liveCtx = null;

      function ensureLiveContext() {
        if (!liveCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          try { liveCtx = new AC({ sampleRate: SR }); } catch (_) { liveCtx = new AC(); }
        }
        if (liveCtx.state === 'suspended') liveCtx.resume();
        return liveCtx;
      }

      async function renderAudioMix({ scenes, totalDuration, enableMusic, enableSFX, seedVal }) {
        const N = Math.ceil(totalDuration * SR);
        const buf = new AudioBuffer({ numberOfChannels: 2, length: N, sampleRate: SR });
        const music = new Float64Array(N);
        const sfx = new Float64Array(N);

        let seed = (seedVal || 42) >>> 0;
        const rand = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return (seed / 4294967296) * 2 - 1;
        };

        if (enableMusic) {
          const rootPool = [55, 65.41, 49, 73.42];
          const root = rootPool[seedVal % rootPool.length];
          const chords = [
            [root, root * 1.5, root * 2],
            [root * 0.89, root * 1.33, root * 1.78],
            [root * 0.84, root * 1.26, root * 1.68],
            [root * 0.75, root * 1.12, root * 1.5]
          ];
          const segDur = totalDuration / chords.length;
          chords.forEach((notes, cIdx) => {
            const i0 = Math.floor(cIdx * segDur * SR);
            const i1 = Math.min(N, Math.floor((cIdx + 1) * segDur * SR));
            for (let i = i0; i < i1; i++) {
              const tt = (i - i0) / SR;
              const env = Math.min(1, tt / 1.2) * Math.min(1, (segDur - tt) / 1.0);
              let v = 0;
              notes.forEach((f, j) => {
                v += 0.045 * env * Math.sin(2 * Math.PI * f * tt + j * 0.4);
                v += 0.014 * env * Math.sin(2 * Math.PI * f * 2.01 * tt);
              });
              music[i] += v;
            }
          });

          // Pulso rítmico
          for (let beat = 0; beat < totalDuration; beat += 0.5) {
            const idx = Math.floor(beat * SR);
            const ln = Math.min(Math.floor(0.24 * SR), N - idx);
            for (let q = 0; q < ln; q++) {
              const qt = q / SR;
              music[idx + q] += 0.08 * Math.sin(2 * Math.PI * (beat % 1 === 0 ? 64 : 92) * qt) * Math.exp(-qt * 18);
            }
          }

          // Notas melódicas espaciadas
          const scale = [1, 1.189, 1.335, 1.498, 1.782, 2.0];
          for (let k = 0; k < Math.floor(totalDuration / 1.8); k++) {
            const sec = k * 1.8 + 0.35;
            const idx = Math.floor(sec * SR);
            const ln = Math.min(Math.floor(1.3 * SR), N - idx);
            const f = root * 4 * scale[(k * 3 + seedVal) % scale.length];
            for (let q = 0; q < ln; q++) {
              const qt = q / SR;
              music[idx + q] += 0.045 * Math.sin(2 * Math.PI * f * qt) * Math.exp(-qt * 3.0);
            }
          }
        }

        if (enableSFX) {
          const addBand = (sec, dur, amp, lo, hi) => {
            const idx = Math.floor(sec * SR);
            const ln = Math.min(Math.floor(dur * SR), N - idx);
            if (ln <= 0) return;
            let lp = 0, hp = 0, prev = 0;
            const aLP = Math.min(0.95, (2 * Math.PI * hi) / (SR + 2 * Math.PI * hi));
            const aHP = SR / (SR + 2 * Math.PI * lo);
            for (let q = 0; q < ln; q++) {
              const qt = q / SR;
              lp += aLP * (rand() - lp);
              hp = aHP * (hp + lp - prev);
              prev = lp;
              sfx[idx + q] += amp * hp * Math.exp(-qt * 3.8) * Math.min(1, qt * 12);
            }
          };

          scenes.forEach((sc, idx) => {
            if (idx > 0) addBand(sc.startTime, 0.35, 0.14, 240, 2600); // Whoosh de cámara en corte
            if (sc.camType === 'impact_shake' || sc.hazard === 'explosion' || sc.hazard === 'flood') {
              addBand(sc.startTime + 0.12, 1.6, 0.34, 55, 850);
            } else if (sc.camType === 'orbit_hero') {
              // Tono cristalino de revelación
              const pIdx = Math.floor((sc.startTime + 0.25) * SR);
              const ln = Math.min(Math.floor(0.65 * SR), N - pIdx);
              for (let q = 0; q < ln; q++) {
                const qt = q / SR;
                sfx[pIdx + q] += 0.11 * Math.sin(2 * Math.PI * 784 * qt) * Math.exp(-qt * 6);
              }
            } else {
              addBand(sc.startTime + 0.15, 0.25, 0.08, 400, 1800);
            }
          });
        }

        const L = buf.getChannelData(0);
        const R = buf.getChannelData(1);
        const norm = Math.tanh(1.1);
        for (let i = 0; i < N; i++) {
          const comp = Math.tanh((music[i] + sfx[i]) * 1.35) / norm;
          L[i] = Math.max(-0.92, Math.min(0.92, comp + 0.02 * music[i]));
          R[i] = Math.max(-0.92, Math.min(0.92, comp - 0.02 * music[i]));
        }
        return buf;
      }

      return { SR, ensureLiveContext, renderAudioMix };
    })();

    // =========================================================================
    // 2. DIRECTOR PROCEDURAL DE HISTORIAS (CERO REPETICIONES, 10 BIOMAS 3D)
    // =========================================================================
    window.StoryBrain = (() => {
      const PRESETS = {
        boston:
`En 1919, un depósito gigantesco en Boston guardaba dos millones de galones de melaza.
El quince de enero, el acero empezó a crujir y los remaches saltaron por los aires.
Una ola marrón avanzó por toda la ciudad a cincuenta y seis kilómetros por hora.
Los edificios quedaron rodeados y los rescatistas tuvieron que usar agua de mar.`,

        hacker:
`Un joven hacker prometió que podía vaciar un banco usando solo una tostadora modificada.
Durante semanas estudió los cables subterráneos y las cámaras acorazadas del edificio.
Una noche conectó su aparato a la red eléctrica y todas las alarmas de la ciudad saltaron.
En lugar de robar oro, dejó sin electricidad al barrio entero durante tres horas.`,

        espacio:
`En plena misión orbital, la cápsula espacial sufrió un fallo en sus propulsores principales.
La estación espacial quedaba cada vez más lejos mientras el oxígeno bajaba rápido.
El astronauta improvisó un cálculo de gravedad usando solo una linterna y un cronómetro.
Logró encender los motores de reserva justo a tiempo y regresar a la Tierra.`,

        torre_eiffel:
`En 1925, un estafador en París falsificó documentos oficiales del gobierno francés.
Reunió en secreto a cinco empresarios millonarios bajo la gran Torre Eiffel.
Les aseguró que la ciudad quería vender la torre entera como chatarra al mejor postor.
Uno le pagó una maleta llena de billetes y meses después intentó venderla otra vez.`,

        pepsi:
`En 1989, la Unión Soviética quería comprar Pepsi pero su moneda no valía fuera del país.
Sus generales propusieron el intercambio más absurdo en mitad del océano.
Pagaron a la empresa con diecisiete submarinos, un crucero y un destructor reales.
Durante unos días, una marca de refrescos tuvo una de las mayores flotas del planeta.`,

        faraon:
`Un grupo de exploradores encontró una puerta oculta bajo las arenas de una pirámide.
Al cruzar el túnel iluminado con antorchas descubrieron mecanismos de piedra intactos.
Una trampa antigua hizo temblar todo el templo mientras las columnas empezaban a caer.
Consiguieron escapar justo antes de que la cámara secreta se sellara para siempre.`
      };

      const BIOMES = [
        'modern_city',      // Rascacielos modernos, neones, coches/carretera
        'cyber_lab',        // Laboratorio futurista, servidores, núcleos brillantes
        'outer_space',      // Espacio profundo, planetas, asteroides, cohete/estación
        'bank_heist',       // Banco, columnas, cajas fuertes, lingotes de oro
        'ocean_naval',      // Océano con olas 3D, submarino, barcos
        'industrial_flood', // Ciudad ladrillo 1919, depósito industrial, ola densa
        'desert_pyramid',   // Desierto dorado, pirámides, obeliscos, esfinge
        'forest_night',     // Bosque nocturno con pinos 3D, luna llena, hoguera
        'medieval_fortress',// Castillo con torres almenadas, murallas, estandartes
        'paris_avenue'      // Bulevar europeo con Torre Eiffel 3D y farolas
      ];

      const ROLES_BY_BIOME = {
        modern_city: ['casual', 'exec', 'hacker'],
        cyber_lab: ['scientist', 'hacker', 'exec'],
        outer_space: ['astronaut', 'scientist'],
        bank_heist: ['exec', 'hacker', 'casual'],
        ocean_naval: ['explorer', 'exec'],
        industrial_flood: ['worker', 'casual'],
        desert_pyramid: ['explorer', 'monarch'],
        forest_night: ['explorer', 'casual'],
        medieval_fortress: ['knight', 'monarch'],
        paris_avenue: ['exec', 'casual']
      };

      function hashString(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function detectBiome(fullText, seed) {
        const l = fullText.toLowerCase();
        if (/espacio|órbita|astronauta|cohete|planeta|galaxia|luna|estrella|marte/.test(l)) return 'outer_space';
        if (/hacker|tostadora|código|laboratorio|ciencia|robot|ia|servidor|experimento|láser/.test(l)) return 'cyber_lab';
        if (/banco|bóveda|oro|dinero|estafador|millon|alarma|ladrón|atraco/.test(l)) return 'bank_heist';
        if (/submarino|océano|mar|barco|flota|pepsi|pirata|isla|tiburón/.test(l)) return 'ocean_naval';
        if (/melaza|depósito|tanque|boston|remaches|fábrica|inund/.test(l)) return 'industrial_flood';
        if (/pirámide|faraón|arena|desierto|egipto|templo|momia/.test(l)) return 'desert_pyramid';
        if (/torre eiffel|parís|francia|bulevar/.test(l)) return 'paris_avenue';
        if (/castillo|rey|caballero|espada|dragón|medieval|troya|imperio/.test(l)) return 'medieval_fortress';
        if (/bosque|hoguera|campamento|árbol|lobo|montaña|noche/.test(l)) return 'forest_night';
        if (/ciudad|calle|coche|policía|edificio|carrera/.test(l)) return 'modern_city';
        // Si no hay palabras clave reconocibles, elegir un bioma completamente distinto según el hash del texto
        return BIOMES[seed % BIOMES.length];
      }

      function detectHazardAndProps(text, biome) {
        const l = text.toLowerCase();
        let hazard = 'none';
        if (/ola|inund|melaza|agua|mar/.test(l)) hazard = 'flood';
        else if (/explot|saltaron|tembl|caer|trampa|fuego|alarma|destru|accidente|fallo/.test(l)) hazard = 'explosion';
        else if (/oro|dinero|billetes|millon/.test(l)) hazard = 'gold_rain';
        else if (/nieve|frío|noche|bosque/.test(l)) hazard = 'particles';

        let prop = 'monolith';
        if (/tanque|depósito|acero|remaches/.test(l)) prop = 'tank';
        else if (/cohete|cápsula|nave|propulsor|estación/.test(l)) prop = 'rocket';
        else if (/submarino|barco|flota/.test(l)) prop = 'submarine';
        else if (/torre eiffel|torre/.test(l)) prop = 'eiffel';
        else if (/pirámide|templo/.test(l)) prop = 'pyramid';
        else if (/bóveda|banco|oro|caja/.test(l)) prop = 'vault';
        else if (/tostadora|servidor|máquina|aparato|robot/.test(l)) prop = 'machine';
        else if (biome === 'outer_space') prop = 'rocket';
        else if (biome === 'ocean_naval') prop = 'submarine';
        else if (biome === 'desert_pyramid') prop = 'pyramid';
        else if (biome === 'paris_avenue') prop = 'eiffel';
        else if (biome === 'bank_heist') prop = 'vault';
        else if (biome === 'cyber_lab') prop = 'machine';
        else if (biome === 'industrial_flood') prop = 'tank';

        return { hazard, prop };
      }

      function buildWords(text, duration) {
        const list = text.trim().split(/\s+/).filter(Boolean);
        if (!list.length) return [];
        const usable = Math.max(0.8, duration - 0.25);
        const w = list.map((x) => Math.max(2, x.length) + (/[,.;:!?]$/.test(x) ? 2 : 0));
        const tot = w.reduce((a, b) => a + b, 0);
        let cur = 0.12;
        return list.map((word, i) => {
          const d = (w[i] / tot) * usable;
          const obj = { word, start: cur, end: cur + d };
          cur += d;
          return obj;
        });
      }

      function makeHeadline(text, idx, total) {
        const num = text.match(/\b(1[0-9]{3}|20[0-2][0-9]|\d+(?:[.,]\d+)?\s?(?:millones|mil|km\/h|horas|días|%))\b/i);
        if (num) return num[1].toUpperCase();
        if (idx === 0) return 'EL INICIO';
        if (idx === total - 1) return 'EL FINAL';
        const clean = text.replace(/[¿?¡!.,;:]/g, '').split(/\s+/).filter((w) => w.length > 3);
        return clean.slice(0, 2).join(' ').toUpperCase() || `ESCENA ${idx + 1}`;
      }

      function compileStory(rawText, extraSeed = 0) {
        const trimmed = rawText.trim();
        if (!trimmed) return { scenes: [], storySeed: 1 };
        const storySeed = (hashString(trimmed) + extraSeed * 7919) >>> 0;

        if (blocks.length === 1) {
          const sents = trimmed.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [trimmed];
          blocks = sents.map((s) => s.trim()).filter(Boolean);
        }
        // Si el usuario escribe solo 1 línea corta (ej: una palabra o idea), la dividimos en 3 actos dinámicos para que haya movimiento y variedad
        if (blocks.length === 1) {

          blocks = [
            t,
            'De pronto algo inesperado cambió todo el escenario.',
            'Y el desenlace sorprendió a todos.'
          ];
        }

        const primaryBiome = detectBiome(trimmed, storySeed);
        // Secuencia de cámaras obligatoriamente distintas entre escenas consecutivas
        const camSequence = ['dolly_flyin', 'orbit_hero', 'whip_pan_chase', 'impact_shake', 'crane_up_reveal', 'orbit_reverse'];

        const scenes = blocks.map((text, idx) => {
          const scSeed = (storySeed + idx * 104729) >>> 0;
          // Cada escena puede variar o evolucionar de bioma si el texto cambia o en el clímax
          let biome = idx === 0 ? primaryBiome : detectBiome(text, scSeed);

          const role = roles[scSeed % roles.length];

          let emotion = emotions[scSeed % emotions.length];
          if (/peligro|alarma|atrapad|saltaron|tembl|huir|shock/.test(text.toLowerCase())) emotion = 'shocked';
          else if (/ri|burl|celebr|victoria/.test(text.toLowerCase())) emotion = 'laughing';
          else if (/guerra|enfad|luch|robo/.test(text.toLowerCase())) emotion = 'angry';

          const { hazard, prop } = detectHazardAndProps(text, biome);
          let camType = camSequence[idx % camSequence.length];
          if (hazard === 'explosion' || hazard === 'flood') camType = 'impact_shake';

          const wordsCnt = text.split(/\s+/).length;
          const duration = Math.max(3.2, Math.min(6.5, wordsCnt * 0.28 + 1.6));

          return {
            id: idx + 1,
            text,
            title: makeHeadline(text, idx, blocks.length),
            biome,
            camType,
            role,
            emotion,
            hazard,
            prop,
            seed: scSeed,
            duration,
            words: buildWords(text, duration)
          };
        });

        return { scenes, storySeed };
      }

      return { PRESETS, compileStory };
    })();

        const dz = wz - cam.z;
