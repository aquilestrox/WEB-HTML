<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow - Calendario & Productividad</title>
  <!-- Fuente moderna Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --prio-high: #ef4444;
      --prio-med: #f59e0b;
      --prio-low: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stats-header {
      display: flex;
      gap: 1.5rem;
    }

    .stat-pill {
      background: var(--bg-card);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
    }

    .stat-pill span {
      font-weight: 700;
      color: var(--accent);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr 380px;
      gap: 1.5rem;
      flex: 1;
    }

    @media (max-width: 1100px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    /* === COLUMNA 1: POMODORO & RESUMEN === */
    .pomodoro-card {
      text-align: center;
    }

    .timer-modes {
      display: flex;
      background: var(--bg-main);
      padding: 0.25rem;
      border-radius: 8px;
      gap: 0.25rem;
    }

    .timer-mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .timer-mode-btn.active {
      background: var(--accent);
      color: white;
      font-weight: 600;
    }

    .timer-display {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 1rem 0;
      color: #fff;
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      padding: 0.6rem 1.2rem;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text);
      padding: 0.6rem 1.2rem;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .progress-bar-container {
      background: var(--bg-main);
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.4s ease;
    }

    /* === COLUMNA 2: CALENDARIO === */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .calendar-header h2 {
      font-size: 1.2rem;
      text-transform: capitalize;
    }

    .nav-btn {
      background: var(--bg-input);
      color: var(--text);
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      flex: 1;
    }

    .day-cell {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .day-cell:hover {
      background: var(--bg-input);
      border-color: var(--accent);
    }

    .day-cell.other-month {
      opacity: 0.3;
    }

    .day-cell.today {
      border: 2px solid var(--accent);
      font-weight: 700;
    }

    .day-cell.selected {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent);
    }

    .day-number {
      font-size: 0.9rem;
    }

    .dots-container {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--accent);
    }

    .dot.done {
      background-color: var(--success);
    }

    /* === COLUMNA 3: TAREAS DEL DÍA === */
    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .tasks-header h2 {
      font-size: 1.2rem;
    }

    .tasks-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .task-form {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: var(--bg-main);
      padding: 0.8rem;
      border-radius: 10px;
    }

    input, select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .form-row {
      display: flex;
      gap: 0.5rem;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      overflow-y: auto;
      max-height: 380px;
      padding-right: 4px;
    }

    .task-item {
      background: var(--bg-main);
      padding: 0.75rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-left: 4px solid var(--accent);
      transition: opacity 0.2s;
    }

    .task-item.prio-Alta { border-left-color: var(--prio-high); }
    .task-item.prio-Media { border-left-color: var(--prio-med); }
    .task-item.prio-Baja { border-left-color: var(--prio-low); }

    .task-item.completed {
      opacity: 0.5;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      overflow: hidden;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .task-text {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 0.4rem;
    }

    .delete-btn {
      background: transparent;
      color: var(--text-muted);
      padding: 0.2rem 0.4rem;
      font-size: 1rem;
    }

    .delete-btn:hover {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 2rem 0;
    }

    /* Custom Checkbox */
    input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>⚡</span> FocusFlow
    </div>
    <div class="stats-header">
      <div class="stat-pill">Tareas hoy: <span id="header-today-tasks">0/0</span></div>
      <div class="stat-pill">Pomodoros: <span id="header-pomo-count">0</span> 🔥</div>
    </div>
  </header>

  <main class="main-grid">
    <!-- COLUMNA 1: POMODORO & PRODUCTIVIDAD -->
    <section class="card pomodoro-card">
      <h3>Enfoque & Pomodoro</h3>
      <div class="timer-modes">
        <button class="timer-mode-btn active" onclick="setTimerMode('work')">Pomodoro (25m)</button>
        <button class="timer-mode-btn" onclick="setTimerMode('shortBreak')">Descanso (5m)</button>
        <button class="timer-mode-btn" onclick="setTimerMode('longBreak')">Largo (15m)</button>
      </div>

      <div class="timer-display" id="timer-display">25:00</div>

      <div class="timer-controls">
        <button class="btn-primary" id="timer-start-btn" onclick="toggleTimer()">Iniciar</button>
        <button class="btn-secondary" onclick="resetTimer()">Reiniciar</button>
      </div>

      <div style="margin-top: 1rem; text-align: left;">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
          <span>Progreso del día</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="daily-progress-bar"></div>
        </div>
      </div>
    </section>

    <!-- COLUMNA 2: CALENDARIO -->
    <section class="card">
      <div class="calendar-header">
        <h2 id="calendar-month-year">Mes Año</h2>
        <div style="display: flex; gap: 0.5rem;">
          <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
          <button class="nav-btn" onclick="goToToday()">Hoy</button>
          <button class="nav-btn" onclick="changeMonth(1)">▶</button>
        </div>
      </div>

      <div class="calendar-weekdays">
        <div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div>
      </div>

      <div class="calendar-days" id="calendar-days">
        <!-- Días generados dinámicamente -->
      </div>
    </section>

    <!-- COLUMNA 3: TAREAS DEL DÍA SELECCIONADO -->
    <section class="card">
      <div class="tasks-header">
        <div>
          <h2>Tareas del Día</h2>
          <p id="selected-date-text">Selecciona una fecha</p>
        </div>
      </div>

      <form class="task-form" id="task-form" onsubmit="handleAddTask(event)">
        <input type="text" id="task-input" placeholder="¿Qué vas a lograr?" required>
        <div class="form-row">
          <input type="time" id="task-time">
          <select id="task-priority">
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
            <option value="Baja">Baja</option>
          </select>
          <select id="task-category">
            <option value="Trabajo">💼 Trabajo</option>
            <option value="Estudio">📚 Estudio</option>
            <option value="Personal">🌱 Personal</option>
          </select>
        </div>
        <button type="submit" class="btn-primary" style="padding: 0.5rem;">+ Añadir Tarea</button>
      </form>

      <ul class="task-list" id="task-list">
        <!-- Lista de tareas generadas dinámicamente -->
      </ul>
    </section>
  </main>

  <script>
    /* ==========================================================
       ESTADO GLOBAL & LOCAL STORAGE
    ========================================================== */
    let currentDate = new Date();
    let selectedDate = new Date();
    
    // Formato de clave: "YYYY-MM-DD"
    let tasks = JSON.parse(localStorage.getItem('focusflow_tasks')) || {};
    let pomodoroCount = parseInt(localStorage.getItem('focusflow_pomos')) || 0;

    function saveTasks() {
      localStorage.setItem('focusflow_tasks', JSON.stringify(tasks));
      renderCalendar();
      renderTasks();
      updateStats();
    }

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    /* ==========================================================
       CALENDARIO
    ========================================================== */
    const monthNames = [
      "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
      "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
    ];

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('calendar-month-year').textContent = `${monthNames[month]} ${year}`;

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Ajuste para Lunes = 0
      const lastDay = new Date(year, month + 1, 0).getDate();
      const prevLastDay = new Date(year, month, 0).getDate();

      const daysContainer = document.getElementById('calendar-days');
      daysContainer.innerHTML = '';

      const todayStr = formatDateKey(new Date());
      const selectedStr = formatDateKey(selectedDate);

      // Días del mes anterior
      for (let x = firstDayIndex; x > 0; x--) {
        const day = prevLastDay - x + 1;
        const cell = document.createElement('div');
        cell.classList.add('day-cell', 'other-month');
        cell.innerHTML = `<span class="day-number">${day}</span>`;
        daysContainer.appendChild(cell);
      }

      // Días del mes actual
      for (let i = 1; i <= lastDay; i++) {
        const cellDate = new Date(year, month, i);
        const cellDateStr = formatDateKey(cellDate);

        const cell = document.createElement('div');
        cell.classList.add('day-cell');
        
        if (cellDateStr === todayStr) cell.classList.add('today');
        if (cellDateStr === selectedStr) cell.classList.add('selected');

        // Indicadores de tareas (puntos)
        let dotsHtml = '';
        const dayTasks = tasks[cellDateStr] || [];
        if (dayTasks.length > 0) {
          dotsHtml = '<div class="dots-container">';
          dayTasks.slice(0, 4).forEach(t => {
            dotsHtml += `<div class="dot ${t.completed ? 'done' : ''}"></div>`;
          });
          dotsHtml += '</div>';
        }

        cell.innerHTML = `<span class="day-number">${i}</span>${dotsHtml}`;

        cell.addEventListener('click', () => {
          selectedDate = new Date(year, month, i);
          renderCalendar();
          renderTasks();
        });

        daysContainer.appendChild(cell);
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      selectedDate = new Date();
      renderCalendar();
      renderTasks();
    }

    /* ==========================================================
       GESTIÓN DE TAREAS
    ========================================================== */
    function renderTasks() {
      const selectedKey = formatDateKey(selectedDate);
      const dayTasks = tasks[selectedKey] || [];
      const listElement = document.getElementById('task-list');
      
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('selected-date-text').textContent = 
        selectedDate.toLocaleDateString('es-ES', options);

      listElement.innerHTML = '';

      if (dayTasks.length === 0) {
        listElement.innerHTML = `<div class="empty-state">No hay tareas para este día.<br>¡Añade una arriba para empezar!</div>`;
        return;
      }

      dayTasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item prio-${task.priority} ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="task-left">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
            <div class="task-info">
              <span class="task-text">${escapeHtml(task.text)}</span>
              <span class="task-meta">
                ${task.time ? `🕒 ${task.time}` : ''}
                <span>🏷️ ${task.category}</span>
              </span>
            </div>
          </div>
          <button class="delete-btn" onclick="deleteTask(${index})" title="Eliminar">✕</button>
        `;
        listElement.appendChild(li);
      });
    }

    function handleAddTask(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const timeInput = document.getElementById('task-time');
      const prioritySelect = document.getElementById('task-priority');
      const categorySelect = document.getElementById('task-category');

      const text = input.value.trim();
      if (!text) return;

      const selectedKey = formatDateKey(selectedDate);
      if (!tasks[selectedKey]) {
        tasks[selectedKey] = [];
      }

      tasks[selectedKey].push({
        text: text,
        time: timeInput.value || null,
        priority: prioritySelect.value,
        category: categorySelect.value,
        completed: false
      });

      input.value = '';
      timeInput.value = '';
      saveTasks();
    }

    function toggleTask(index) {
      const selectedKey = formatDateKey(selectedDate);
      if (tasks[selectedKey] && tasks[selectedKey][index]) {
        tasks[selectedKey][index].completed = !tasks[selectedKey][index].completed;
        saveTasks();
      }
    }

    function deleteTask(index) {
      const selectedKey = formatDateKey(selectedDate);
      if (tasks[selectedKey]) {
        tasks[selectedKey].splice(index, 1);
        if (tasks[selectedKey].length === 0) {
          delete tasks[selectedKey];
        }
        saveTasks();
      }
    }

    function updateStats() {
      const todayKey = formatDateKey(new Date());
      const todayTasks = tasks[todayKey] || [];
      const total = todayTasks.length;
      const done = todayTasks.filter(t => t.completed).length;

      document.getElementById('header-today-tasks').textContent = `${done}/${total}`;
      document.getElementById('header-pomo-count').textContent = pomodoroCount;

      const percent = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('progress-percent').textContent = `${percent}%`;
      document.getElementById('daily-progress-bar').style.width = `${percent}%`;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    /* ==========================================================
       TEMPORIZADOR POMODORO + SONIDO DE ALARMA SINTETIZADO
    ========================================================== */
    const timerModes = {
      work: 25 * 60,
      shortBreak: 5 * 60,
      longBreak: 15 * 60
    };

    let currentMode = 'work';
    let timeLeft = timerModes.work;
    let timerInterval = null;
    let isRunning = false;

    function playBeep() {
      // Alarma sin archivos externos (Web Audio API)
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } catch(e) {
        console.log("Audio not allowed yet");
      }
    }

    function updateTimerDisplay() {
      const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const sec = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${min}:${sec}`;
      document.title = isRunning ? `(${min}:${sec}) FocusFlow` : `FocusFlow`;
    }

    function toggleTimer() {
      const btn = document.getElementById('timer-start-btn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        btn.textContent = 'Reanudar';
        btn.style.background = 'var(--accent)';
      } else {
        isRunning = true;
        btn.textContent = 'Pausar';
        btn.style.background = 'var(--warning)';
        
        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimerDisplay();

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            isRunning = false;
            playBeep();
            btn.textContent = 'Iniciar';
            btn.style.background = 'var(--accent)';
            
            if (currentMode === 'work') {
              pomodoroCount++;
              localStorage.setItem('focusflow_pomos', pomodoroCount);
              updateStats();
              alert('🎉 ¡Excelente sesión de trabajo terminada! Tómate un descanso.');
              setTimerMode('shortBreak');
            } else {
              alert('⏰ Descanso terminado. ¡A por el siguiente bloque!');
              setTimerMode('work');
            }
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeLeft = timerModes[currentMode];
      const btn = document.getElementById('timer-start-btn');
      btn.textContent = 'Iniciar';
      btn.style.background = 'var(--accent)';
      updateTimerDisplay();
    }

    function setTimerMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.timer-mode-btn').forEach(btn => btn.classList.remove('active'));
      event?.target?.classList?.add('active') || 
        document.querySelector(`[onclick="setTimerMode('${mode}')"]`).classList.add('active');
      
      resetTimer();
    }

    /* ==========================================================
       INICIALIZACIÓN AL CARGAR LA PÁGINA
    ========================================================== */
    window.onload = () => {
      renderCalendar();
      renderTasks();
      updateStats();
      updateTimerDisplay();
    };
  </script>
</body>
</html>
