        }

            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-green);
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            text-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
        }

        .dashboard {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            position: sticky;
            top: 10px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .progress-bg {
            background: #08090f;
            height: 24px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-fill {
            background: linear-gradient(90deg, #00b0ff, var(--accent-green));
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .tools-row {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #08090f;
            color: #fff;
            font-size: 1rem;
        }

        .btn {
            background: #232a3d;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--accent-green);
            color: #000;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .day-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .day-header {
            color: var(--accent-gold);
            font-size: 1.3rem;
            font-weight: bold;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .category-title {
            color: var(--accent-green);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 18px 0 8px 0;
            font-weight: bold;
        }

        .item-row {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            background: #0d101a;
            margin-bottom: 3px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .item-row:hover {
            background: #1a2030;
        }

        .item-row input[type="checkbox"] {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--accent-green);
        }

        .item-row.checked {
            background: #092015;
        }

        .item-row.checked span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .reset-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 40px auto;
            display: block;
        }
    </style>
</head>

let totalItems = 0;
let hideCompleted = false;

function renderApp() {
    const container = document.getElementById('days-container');
    container.innerHTML = '';
    totalItems = 0;

    db.forEach((d, dayIndex) => {
        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';

        let html = `
            <div class="day-header">
                <span>${d.day}</span>
                <span style="font-size:0.85rem; color:var(--text-muted);">${d.title}</span>
            </div>
        `;

        d.categories.forEach((cat, catIndex) => {
            html += `<div class="category-title">${cat.name} (${cat.items.length})</div>`;
            cat.items.forEach((item, itemIndex) => {
                totalItems++;
                const itemId = `item_${dayIndex}_${catIndex}_${itemIndex}`;
                html += `
                    <div class="item-row" id="row_${itemId}" data-name="${item.toLowerCase()}">
                        <input type="checkbox" id="${itemId}" onchange="updateProgress()">
                        <label for="${itemId}"><span>${item}</span></label>
                    </div>
                `;
            });
        });

        dayCard.innerHTML = html;
        container.appendChild(dayCard);
    });

    document.getElementById('total-count').innerText = totalItems;
    loadProgress();
}

function updateProgress() {
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    let checkedCount = 0;

    checkboxes.forEach(cb => {
        const row = document.getElementById(`row_${cb.id}`);
        if (cb.checked) {
            checkedCount++;
            if (row) {
                row.classList.add('checked');
                if (hideCompleted) row.style.display = 'none';
            }
        } else {
            if (row) {
                row.classList.remove('checked');
                if (hideCompleted) row.style.display = 'flex';
            }
        }
        localStorage.setItem(cb.id, cb.checked);
    });

    const percent = Math.round((checkedCount / totalItems) * 100) || 0;
    document.getElementById('collected-count').innerText = checkedCount;
    document.getElementById('percent-text').innerText = percent + '%';
    document.getElementById('progress-bar').style.width = percent + '%';
}

function filterItems() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const rows = document.querySelectorAll('.item-row');

    rows.forEach(row => {
        const name = row.getAttribute('data-name');
        if (name.includes(query)) {
            row.style.display = 'flex';
        } else {
            row.style.display = 'none';
        }
    });
}

function toggleCompletedVisibility() {
    hideCompleted = !hideCompleted;
    const btn = document.getElementById('hide-btn');
    btn.innerText = hideCompleted ? "Mostrar Conseguidos" : "Ocultar Conseguidos";

    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(cb => {
        const row = document.getElementById(`row_${cb.id}`);
        if (row && cb.checked) {
            row.style.display = hideCompleted ? 'none' : 'flex';
        }
    });
}

function loadProgress() {
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(cb => {
        if (localStorage.getItem(cb.id) === 'true') {
            cb.checked = true;
        }
    });
    updateProgress();
}

function resetChallenge() {
    if (confirm('¿Seguro que quieres borrar todas las casillas marcadas para empezar el reto de cero?')) {
        localStorage.clear();
        location.reload();
    }
}

window.onload = renderApp;
</script>
