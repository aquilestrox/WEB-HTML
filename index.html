<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeluxeMenus Studio AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        :root {
            --bg-base: #131314;
            --bg-surface: #1e1f20;
            --bg-surface-hover: #282a2c;
            --border-color: #333537;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent: #a8c7fa;
            --accent-glow: rgba(168, 199, 250, 0.15);
            
            /* Colores Minecraft (Escalados para verse mejor) */
            --mc-bg: #C6C6C6;
            --mc-border-light: #FFFFFF;
            --mc-border-dark: #555555;
            --mc-slot-bg: #8B8B8B;
            --mc-slot-border-light: #373737;
            --mc-slot-border-dark: #FFFFFF;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-primary);
            overflow-x: hidden;
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* GEMINI AI INPUT STYLE */
        .ai-input-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .ai-input-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), 0 8px 30px var(--accent-glow);
            background: #232527;
        }

        /* INVENTARIO MINECRAFT (Más grande) */
        .mc-inventory {
            background-color: var(--mc-bg);
            border-top: 4px solid var(--mc-border-light);
            border-left: 4px solid var(--mc-border-light);
            border-bottom: 4px solid var(--mc-border-dark);
            border-right: 4px solid var(--mc-border-dark);
            padding: 16px;
            border-radius: 4px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            display: inline-block;
        }

        /* SLOTS GIGANTES Y CLAROS */
        .mc-slot {
            width: 64px;
            height: 64px;
            background-color: var(--mc-slot-bg);
            border-top: 3px solid var(--mc-slot-border-light);
            border-left: 3px solid var(--mc-slot-border-light);
            border-bottom: 3px solid var(--mc-slot-border-dark);
            border-right: 3px solid var(--mc-slot-border-dark);
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .mc-slot:hover { background-color: #a0a0a0; z-index: 10; }
        
        /* Slot seleccionado */
        .mc-slot.active {
            border: 3px solid #a8c7fa !important;
            background-color: #4b5563;
            box-shadow: 0 0 0 2px rgba(168, 199, 250, 0.5), inset 0 0 15px rgba(0,0,0,0.5);
            transform: scale(1.05);
            z-index: 20;
        }

        /* Imágenes e Íconos dentro del slot */
        .slot-img {
            width: 40px; height: 40px;
            image-rendering: pixelated;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.5));
        }

        .mc-tooltip {
            display: none;
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 0, 16, 0.95);
            border: 2px solid #3700b3;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .mc-slot:hover .mc-tooltip { display: block; }

        /* SCROLLBAR LIMPIA */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* PANEL LATERAL */
        .side-panel {
            background: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            height: calc(100vh - 64px);
            overflow-y: auto;
        }

        /* MODAL CÓDIGO YAML */
        #yaml-modal {
            backdrop-filter: blur(8px);
            background: rgba(0,0,0,0.6);
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- HEADER ESTILO GEMINI -->
    <header class="h-16 border-b border-[#333537] flex items-center justify-between px-6 bg-[#131314] shrink-0">
        <div class="flex items-center gap-3">
            <i data-lucide="sparkles" class="w-6 h-6 text-[#a8c7fa]"></i>
            <h1 class="text-xl font-medium tracking-wide">DeluxeMenus <span class="text-[#a8c7fa] font-semibold">AI Studio</span></h1>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="fillEmptyWithGlass()" title="Rellenar vacíos con cristal" class="p-2 hover:bg-[#282a2c] rounded-full transition-colors text-gray-400 hover:text-white">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
            </button>
            <button onclick="clearAllData()" title="Limpiar todo" class="p-2 hover:bg-rose-500/10 rounded-full transition-colors text-gray-400 hover:text-rose-400">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
            <div class="w-px h-6 bg-[#333537] mx-2"></div>
            <button onclick="openYAMLModal()" class="flex items-center gap-2 bg-[#a8c7fa] hover:bg-[#b9d3fa] text-[#131314] px-4 py-2 rounded-full font-medium text-sm transition-all shadow-[0_0_15px_rgba(168,199,250,0.15)]">
                <i data-lucide="code" class="w-4 h-4"></i> Ver Código
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <main class="flex flex-1 overflow-hidden">
        
        <!-- ZONA CENTRAL (Vista e Inteligencia Artificial) -->
        <div class="flex-1 flex flex-col relative bg-[#0E0E0E] overflow-y-auto">
            
            <!-- AI PROMPT BAR -->
            <div class="w-full max-w-3xl mx-auto mt-8 px-6">
                <div class="ai-input-container rounded-3xl p-2 flex items-center gap-3">
                    <div class="p-3 bg-[#131314] rounded-full border border-[#333537]">
                        <i data-lucide="bot" class="w-5 h-5 text-[#a8c7fa]"></i>
                    </div>
                    <input type="text" id="ai-prompt" placeholder="Ej: Crea un menú de tienda VIP de 3 filas con espadas y armaduras..." 
                           class="flex-1 bg-transparent border-none outline-none text-base text-gray-200 placeholder-gray-500 font-light"
                           onkeypress="if(event.key === 'Enter') generateMenuAI()">
                    <button onclick="generateMenuAI()" class="px-5 py-3 rounded-full bg-[#1e1f20] hover:bg-[#a8c7fa] hover:text-[#131314] text-gray-300 font-medium text-sm transition-all flex items-center gap-2">
                        Generar ✨
                    </button>
                </div>
                <div id="ai-status" class="text-center mt-3 text-sm text-[#a8c7fa] opacity-0 transition-opacity font-medium h-5">
                    Generando menú por arte de magia...
                </div>
            </div>

            <!-- CANVAS DEL INVENTARIO (Centrado y Grande) -->
            <div class="flex-1 flex justify-center items-center p-8 min-h-[500px]">
                <div>
                    <div class="flex items-center justify-between mb-4 px-2">
                        <span id="live-title" class="font-bold text-lg font-mono text-white tracking-wide" style="text-shadow: 2px 2px 0 #000;">&8Menú Principal</span>
                        <span class="text-xs text-gray-500 font-mono bg-[#1e1f20] px-3 py-1 rounded-full border border-[#333537]" id="size-indicator">54 Slots</span>
                    </div>
                    
                    <div class="mc-inventory">
                        <div id="grid-canvas" class="grid grid-cols-9 gap-[3px]">
                            <!-- Slots inyectados por JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL LATERAL DINÁMICO (Derecha - 350px) -->
        <div class="w-[360px] side-panel flex flex-col shrink-0">
            
            <!-- Encabezado del Panel -->
            <div class="p-5 border-b border-[#333537] flex items-center justify-between bg-[#131314]">
                <h2 id="panel-title" class="text-sm font-semibold tracking-wide flex items-center gap-2">
                    <i data-lucide="settings" class="w-4 h-4 text-[#a8c7fa]"></i> Configuración Global
                </h2>
                <button id="btn-close-item" onclick="deselectSlot()" class="hidden p-1.5 hover:bg-[#282a2c] rounded-md text-gray-400">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- VISTA 1: Ajustes Globales (Se muestra cuando NO hay slot seleccionado) -->
            <div id="view-global" class="p-5 space-y-6">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-2">Nombre del Archivo YML</label>
                    <input type="text" id="menu-id" value="menu_principal" class="w-full bg-[#131314] border border-[#333537] rounded-xl px-4 py-3 text-sm outline-none focus:border-[#a8c7fa] transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-2">Título de la Interfaz</label>
                    <input type="text" id="menu-title" value="&8Menú Principal" class="w-full bg-[#131314] border border-[#333537] rounded-xl px-4 py-3 text-sm outline-none focus:border-[#a8c7fa] transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-2">Tamaño (Filas)</label>
                    <select id="menu-rows" class="w-full bg-[#131314] border border-[#333537] rounded-xl px-4 py-3 text-sm outline-none focus:border-[#a8c7fa] transition-colors cursor-pointer">
                        <option value="1">1 Fila (9 slots)</option>
                        <option value="2">2 Filas (18 slots)</option>
                        <option value="3">3 Filas (27 slots)</option>
                        <option value="4">4 Filas (36 slots)</option>
                        <option value="5">5 Filas (45 slots)</option>
                        <option value="6" selected>6 Filas (54 slots)</option>
                    </select>
                </div>

                <div class="pt-6 border-t border-[#333537]">
                    <p class="text-xs text-gray-500 mb-3 font-medium">💡 Tip: Haz clic en cualquier casilla del inventario para empezar a añadir ítems.</p>
                </div>
            </div>

            <!-- VISTA 2: Editor de Ítem (Se muestra cuando hay un slot seleccionado) -->
            <div id="view-item" class="p-5 space-y-5 hidden">
                <div class="flex gap-2 p-1 bg-[#131314] rounded-xl border border-[#333537]">
                    <button onclick="switchContextType('normal')" id="ctx-normal" class="flex-1 text-xs font-medium py-2 rounded-lg bg-[#282a2c] text-white">Normal</button>
                    <button onclick="switchContextType('custom_head')" id="ctx-custom_head" class="flex-1 text-xs font-medium py-2 rounded-lg text-gray-400 hover:text-white">Cabeza</button>
                </div>

                <div id="material-box">
                    <label class="block text-xs font-medium text-gray-400 mb-2">Material (ej. DIAMOND_SWORD)</label>
                    <input type="text" id="item-material" placeholder="DIAMOND_SWORD" class="w-full bg-[#131314] border border-[#333537] rounded-xl px-4 py-3 text-sm outline-none focus:border-[#a8c7fa] font-mono uppercase">
                </div>

                <div class="grid grid-cols-4 gap-3">
                    <div class="col-span-3">
                        <label class="block text-xs font-medium text-gray-400 mb-2">Nombre</label>
                        <input type="text" id="item-name" placeholder="&eObjeto" class="w-full bg-[#131314] border border-[#333537] rounded-xl px-4 py-3 text-sm outline-none focus:border-[#a8c7fa]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-2">Cant.</label>
                        <input type="number" id="item-amount" value="1" min="1" max="64" class="w-full bg-[#131314] border border-[#333537] rounded-xl px-2 py-3 text-sm outline-none focus:border-[#a8c7fa] text-center">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-2">Lore (Descripción)</label>
                    <textarea id="item-lore" rows="3" placeholder="&7Línea 1..." class="w-full bg-[#131314] border border-[#333537] rounded-xl p-3 text-sm outline-none focus:border-[#a8c7fa] resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-2">Comandos al hacer clic</label>
                    <textarea id="item-commands" rows="2" placeholder="[player] spawn" class="w-full bg-[#131314] border border-[#333537] rounded-xl p-3 text-sm outline-none focus:border-[#a8c7fa] resize-none"></textarea>
                    <div class="flex gap-1 mt-2">
                        <button onclick="injectCmd('[player] ')" class="text-[10px] bg-[#282a2c] hover:bg-[#333537] px-2 py-1 rounded text-gray-300">[player]</button>
                        <button onclick="injectCmd('[console] ')" class="text-[10px] bg-[#282a2c] hover:bg-[#333537] px-2 py-1 rounded text-gray-300">[console]</button>
                        <button onclick="injectCmd('[close]')" class="text-[10px] bg-[#282a2c] hover:bg-[#333537] px-2 py-1 rounded text-gray-300">[close]</button>
                    </div>
                </div>

                <div class="flex gap-2 pt-4">
                    <button onclick="saveItem()" class="flex-1 bg-[#a8c7fa] text-[#131314] font-medium py-3 rounded-xl text-sm hover:bg-[#b9d3fa] transition-colors">Guardar</button>
                    <button onclick="deleteItem()" class="px-4 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-xl hover:bg-rose-500 hover:text-white transition-colors">
                        <i data-lucide="trash" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL YAML CODE -->
    <div id="yaml-modal" class="fixed inset-0 z-50 flex justify-center items-center hidden opacity-0 transition-opacity">
        <div class="bg-[#1e1f20] border border-[#333537] rounded-2xl w-full max-w-3xl h-[80vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform" id="yaml-modal-content">
            <div class="flex justify-between items-center p-5 border-b border-[#333537] bg-[#131314]">
                <h3 class="text-lg font-medium flex items-center gap-2"><i data-lucide="file-code" class="w-5 h-5 text-[#a8c7fa]"></i> Código Generado</h3>
                <div class="flex gap-3">
                    <button onclick="copyCode()" id="copy-btn" class="text-sm px-4 py-2 bg-[#282a2c] hover:bg-[#333537] rounded-lg transition-colors flex items-center gap-2">
                        <i data-lucide="copy" class="w-4 h-4"></i> Copiar
                    </button>
                    <button onclick="closeYAMLModal()" class="text-sm px-4 py-2 bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white rounded-lg transition-colors">
                        Cerrar
                    </button>
                </div>
            </div>
            <textarea id="yaml-code" readonly class="flex-1 w-full bg-[#0E0E0E] p-6 text-sm font-mono text-[#a8c7fa] resize-none outline-none overflow-y-auto leading-relaxed whitespace-pre"></textarea>
        </div>
    </div>

    <!-- MAIN LOGIC ENGINE -->
    <script>
        // Data Structure
        let STATE = {
            rows: 6,
            selectedSlot: null, // Si es null, muestra global settings
            activeType: 'normal',
            menuId: 'menu_principal',
            menuTitle: '&8Menú Principal',
            items: {}
        };

        const MC_COLORS = {
            '0': '#000000', '1': '#0000AA', '2': '#00AA00', '3': '#00AAAA', '4': '#AA0000', '5': '#AA00AA', '6': '#FFAA00', '7': '#AAAAAA',
            '8': '#555555', '9': '#5555FF', 'a': '#55FF55', 'b': '#55FFFF', 'c': '#FF5555', 'd': '#FF55FF', 'e': '#FFFF55', 'f': '#FFFFFF'
        };

        function parseMCColor(text) {
            if (!text) return '';
            let parts = text.split('&');
            if(parts.length === 1) return parts[0];
            let html = parts[0];
            for (let i = 1; i < parts.length; i++) {
                let code = parts[i].charAt(0).toLowerCase();
                let rest = parts[i].substring(1);
                if (MC_COLORS[code]) html += `<span style="color: ${MC_COLORS[code]}; ${code==='l'?'font-weight:bold;':''}">${rest}</span>`;
                else if (code === 'l') html += `<span style="font-weight: bold;">${rest}</span>`;
                else if (code === 'r') html += `</span>${rest}`;
                else html += `&${parts[i]}`;
            }
            return html;
        }

        window.onload = () => {
            lucide.createIcons();
            setupListeners();
            renderCanvas();
            updateYAML();
        };

        function renderCanvas() {
            const canvas = document.getElementById('grid-canvas');
            canvas.innerHTML = '';
            const total = STATE.rows * 9;

            for (let i = 0; i < total; i++) {
                const slot = document.createElement('div');
                slot.className = `mc-slot flex flex-col items-center justify-center p-1 text-[10px] ${STATE.selectedSlot === i ? 'active' : ''}`;
                
                if (STATE.items[i]) {
                    const node = STATE.items[i];
                    let pName = parseMCColor(node.name || node.material);

                    if (node.type === 'custom_head') {
                        slot.innerHTML = `
                            <img src="https://mc-heads.net/avatar/Steve/40" class="slot-img mb-1 rounded-sm border border-black/50" alt="head">
                            <span class="truncate w-full text-center block leading-none font-bold text-white drop-shadow-md text-[10px]">${pName}</span>
                            <div class="mc-tooltip"><p class="font-bold text-white">${node.name.replace(/&[0-9a-fk-or]/gi, '')}</p></div>
                        `;
                    } else if (node.material.includes('STAINED_GLASS_PANE')) {
                        slot.innerHTML = `<div class="w-full h-full bg-slate-800/50 absolute inset-0 m-0.5 border border-white/10 shadow-inner"></div>`;
                    } else {
                        slot.innerHTML = `
                            <img src="https://assets.mcfallout.net/items/${node.material.toLowerCase()}.png" 
                                 onerror="this.src='https://assets.mcfallout.net/items/barrier.png'" 
                                 class="slot-img mb-1 z-10" alt="item">
                            ${node.amount > 1 ? `<span class="absolute bottom-1 right-1 text-white font-mono text-[12px] font-bold drop-shadow-[2px_2px_0_#000] z-20">${node.amount}</span>` : ''}
                            <div class="mc-tooltip text-left min-w-[140px]">
                                <p class="font-bold text-white text-sm">${(node.name || node.material).replace(/&[0-9a-fk-or]/gi, '')}</p>
                                ${node.lore ? `<div class="mt-2 text-xs text-gray-400 space-y-1">${node.lore.map(l => `<p>${parseMCColor(l)}</p>`).join('')}</div>` : ''}
                            </div>
                        `;
                    }
                }

                slot.onclick = () => selectSlot(i);
                canvas.appendChild(slot);
            }
        }

        // --- SISTEMA DE PANELES DINÁMICOS ---
        function selectSlot(id) {
            STATE.selectedSlot = id;
            document.getElementById('view-global').classList.add('hidden');
            document.getElementById('view-item').classList.remove('hidden');
            document.getElementById('btn-close-item').classList.remove('hidden');
            document.getElementById('panel-title').innerHTML = `<i data-lucide="box" class="w-4 h-4 text-[#a8c7fa]"></i> Editando Slot ${id}`;
            
            lucide.createIcons();
            renderCanvas();

            if (STATE.items[id]) {
                const t = STATE.items[id];
                switchContextType(t.type);
                document.getElementById('item-material').value = t.material;
                document.getElementById('item-name').value = t.name || '';
                document.getElementById('item-amount').value = t.amount || 1;
                document.getElementById('item-lore').value = t.lore ? t.lore.join('\n') : '';
                document.getElementById('item-commands').value = t.commands ? t.commands.join('\n') : '';
            } else {
                switchContextType('normal');
                document.getElementById('item-material').value = '';
                document.getElementById('item-name').value = '';
                document.getElementById('item-amount').value = '1';
                document.getElementById('item-lore').value = '';
                document.getElementById('item-commands').value = '';
            }
        }

        function deselectSlot() {
            STATE.selectedSlot = null;
            document.getElementById('view-item').classList.add('hidden');
            document.getElementById('view-global').classList.remove('hidden');
            document.getElementById('btn-close-item').classList.add('hidden');
            document.getElementById('panel-title').innerHTML = `<i data-lucide="settings" class="w-4 h-4 text-[#a8c7fa]"></i> Configuración Global`;
            lucide.createIcons();
            renderCanvas();
        }

        function switchContextType(type) {
            STATE.activeType = type;
            document.getElementById('ctx-normal').className = type === 'normal' ? "flex-1 text-xs font-medium py-2 rounded-lg bg-[#282a2c] text-white" : "flex-1 text-xs font-medium py-2 rounded-lg text-gray-400 hover:text-white";
            document.getElementById('ctx-custom_head').className = type === 'custom_head' ? "flex-1 text-xs font-medium py-2 rounded-lg bg-[#282a2c] text-white" : "flex-1 text-xs font-medium py-2 rounded-lg text-gray-400 hover:text-white";
        }

        function saveItem() {
            if(STATE.selectedSlot === null) return;
            const mat = document.getElementById('item-material').value.trim();
            if(!mat) return;

            STATE.items[STATE.selectedSlot] = {
                type: STATE.activeType,
                material: mat,
                name: document.getElementById('item-name').value.trim(),
                amount: parseInt(document.getElementById('item-amount').value) || 1,
                lore: document.getElementById('item-lore').value.split('\n').filter(l => l.trim()),
                commands: document.getElementById('item-commands').value.split('\n').filter(c => c.trim())
            };
            renderCanvas();
            updateYAML();
        }

        function deleteItem() {
            if(STATE.selectedSlot !== null && STATE.items[STATE.selectedSlot]) {
                delete STATE.items[STATE.selectedSlot];
                selectSlot(STATE.selectedSlot); // Refresh
            }
        }

        // --- FUNCIONES IA (SIMULADAS) ---
        function generateMenuAI() {
            const input = document.getElementById('ai-prompt');
            const prompt = input.value.toLowerCase();
            if(!prompt) return;

            const status = document.getElementById('ai-status');
            status.style.opacity = '1';
            status.innerText = 'Analizando tu petición... ✨';

            setTimeout(() => {
                // Logica ultra basica de IA simulada
                clearAllDataSilently();
                
                // Determinar filas (Busca "X filas")
                let filasMatch = prompt.match(/(\d+)\s*fila/);
                if(filasMatch) {
                    STATE.rows = parseInt(filasMatch[1]);
                    if(STATE.rows > 6) STATE.rows = 6;
                }

                // Generador Temático
                if (prompt.includes('tienda')) {
                    STATE.menuTitle = '&8Tienda Principal';
                    STATE.menuId = 'tienda';
                    STATE.items[4] = { type: 'normal', material: 'GOLD_INGOT', name: '&e&lTu Dinero', amount: 1, lore: ['&7Saldo: &a$5,000'], commands: [] };
                    STATE.items[STATE.rows*9 > 18 ? 10 : 0] = { type: 'normal', material: 'DIAMOND_SWORD', name: '&bEspadas', amount: 1, lore: ['&7Clic para ver espadas'], commands: ['[opengui] tienda_espadas'] };
                    STATE.items[STATE.rows*9 > 18 ? 12 : 2] = { type: 'normal', material: 'IRON_CHESTPLATE', name: '&fArmaduras', amount: 1, lore: [], commands: [] };
                    STATE.items[STATE.rows*9 > 18 ? 14 : 4] = { type: 'normal', material: 'APPLE', name: '&cComida', amount: 1, lore: [], commands: [] };
                    STATE.items[STATE.rows*9 > 18 ? 16 : 6] = { type: 'normal', material: 'POTION', name: '&dPociones', amount: 1, lore: [], commands: [] };
                } 
                else if (prompt.includes('lobby') || prompt.includes('modalidades')) {
                    STATE.menuTitle = '&8Selector de Servidor';
                    STATE.items[11] = { type: 'normal', material: 'GRASS_BLOCK', name: '&a&lSurvival', amount: 1, lore: ['&7Unirse al servidor'], commands: ['[connect] survival'] };
                    STATE.items[13] = { type: 'normal', material: 'BOW', name: '&c&lSkyWars', amount: 1, lore: ['&7Unirse al servidor'], commands: ['[connect] skywars'] };
                    STATE.items[15] = { type: 'normal', material: 'BEDROCK', name: '&e&lFactions', amount: 1, lore: ['&7Unirse al servidor'], commands: ['[connect] factions'] };
                }
                else if (prompt.includes('perfil') || prompt.includes('vip')) {
                    STATE.menuTitle = '&8Tu Perfil';
                    STATE.items[13] = { type: 'custom_head', material: '%player_name%', name: '&ePerfil de %player_name%', amount: 1, lore: ['&7Rango: &bVIP'], commands: [] };
                    STATE.items[22] = { type: 'normal', material: 'BARRIER', name: '&cCerrar', amount: 1, lore: [], commands: ['[close]'] };
                }

                // Generar Bordes
                if(prompt.includes('borde') || prompt.includes('decorado')) {
                    fillBorders();
                }

                // Actualizar UI Global
                document.getElementById('menu-rows').value = STATE.rows;
                document.getElementById('menu-title').value = STATE.menuTitle;
                document.getElementById('live-title').innerHTML = parseMCColor(STATE.menuTitle);
                document.getElementById('size-indicator').innerText = (STATE.rows * 9) + ' Slots';

                input.value = '';
                status.innerText = '¡Menú generado con éxito! 🎉';
                
                deselectSlot();
                updateYAML();

                setTimeout(() => { status.style.opacity = '0'; }, 3000);
            }, 800);
        }

        // --- UTILIDADES ---
        function fillBorders() {
            const total = STATE.rows * 9;
            for(let i=0; i<total; i++) {
                if (i < 9 || i >= (total - 9) || i % 9 === 0 || i % 9 === 8) {
                    if (!STATE.items[i]) STATE.items[i] = { type: 'normal', material: 'BLACK_STAINED_GLASS_PANE', name: ' ', amount: 1, lore: [], commands: [] };
                }
            }
        }

        function fillEmptyWithGlass() {
            const total = STATE.rows * 9;
            for(let i=0; i<total; i++) {
                if (!STATE.items[i]) STATE.items[i] = { type: 'normal', material: 'GRAY_STAINED_GLASS_PANE', name: ' ', amount: 1, lore: [], commands: [] };
            }
            renderCanvas(); updateYAML();
        }

        function clearAllDataSilently() {
            STATE.items = {};
        }

        function clearAllData() {
            STATE.items = {};
            deselectSlot(); updateYAML();
        }

        function injectCmd(cmd) {
            const el = document.getElementById('item-commands');
            el.value += (el.value ? '\n' : '') + cmd;
            el.focus();
        }

        function setupListeners() {
            document.getElementById('menu-title').addEventListener('input', e => {
                STATE.menuTitle = e.target.value;
                document.getElementById('live-title').innerHTML = parseMCColor(e.target.value) || 'GUI';
                updateYAML();
            });
            document.getElementById('menu-rows').addEventListener('change', e => {
                STATE.rows = parseInt(e.target.value);
                document.getElementById('size-indicator').innerText = (STATE.rows * 9) + ' Slots';
                deselectSlot(); updateYAML();
            });
            document.getElementById('menu-id').addEventListener('input', e => { STATE.menuId = e.target.value; updateYAML(); });
        }

        // --- COMPILADOR Y MODAL YAML ---
        function updateYAML() {
            const totalSlots = STATE.rows * 9;
            let yaml = `menu_title: '${STATE.menuTitle}'\nopen_command: ${STATE.menuId}\nsize: ${totalSlots}\nitems:\n`;

            for(let slot = 0; slot < totalSlots; slot++) {
                if(!STATE.items[slot]) continue;
                const n = STATE.items[slot];
                yaml += `  'item_${slot}':\n`;
                yaml += `    material: ${n.type === 'custom_head' ? "'head;" + n.material + "'" : n.material.toUpperCase()}\n`;
                yaml += `    slot: ${slot}\n`;
                if(n.amount > 1) yaml += `    amount: ${n.amount}\n`;
                if(n.name) yaml += `    display_name: '${n.name}'\n`;
                
                if(n.lore && n.lore.length > 0) {
                    yaml += `    lore:\n`;
                    n.lore.forEach(l => yaml += `    - '${l}'\n`);
                }
                if(n.commands && n.commands.length > 0) {
                    yaml += `    left_click_commands:\n`;
                    n.commands.forEach(c => yaml += `    - '${c}'\n`);
                }
                yaml += `\n`;
            }
            document.getElementById('yaml-code').value = yaml;
        }

        function openYAMLModal() {
            const modal = document.getElementById('yaml-modal');
            const content = document.getElementById('yaml-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeYAMLModal() {
            const modal = document.getElementById('yaml-modal');
            const content = document.getElementById('yaml-modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function copyCode() {
            const area = document.getElementById('yaml-code');
            area.select(); document.execCommand('copy');
            const btn = document.getElementById('copy-btn');
            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Copiado`;
            setTimeout(() => { btn.innerHTML = `<i data-lucide="copy" class="w-4 h-4"></i> Copiar`; lucide.createIcons(); }, 2000);
        }
    </script>
</body>
</html>
